<div class="stg-window" style="overflow: hidden">
    <stg-window-bar [title]="title"></stg-window-bar>
    <div style="padding: 0.5rem;">
        <div style="position: relative;">
            <input type=text class="stg-input" placeholder="Buscar" (keyup)="filter($event)">
        </div>
    </div>
    <div style="padding: 0.5rem;">
        <div style="overflow: auto;">
            <div>
                <!--[loadingObs]="loadingObs" [loadingStyleConfig]="loadingConf"-->
                <stg-table [headersDef]="headerDefs" [dataSource]="dataSource" [tableStyleConfig]="tableConf"
                    [loadingObs]="dataLoadObs"  activeSelection="true"
                    (onSelectRow)="selectSec($event)">
                </stg-table>
                <ng-container *ngIf="showPaginator">
                    <stg-paginator #paginator [totalLenght]="dataSourceLenght" pageLenght="10"
                        (onChangePage)="changePage($event)">
                    </stg-paginator>
                </ng-container>
            </div>
        </div>
    </div>
</div>
<div style="padding-top: 10px;" fxLayout="row" fxLayoutAlign.gt-sm="end center" fxLayoutAlign="center center"
    fxLayoutGap="10px">
    <!--cdkFocusInitial-->
    <button mat-raised-button color="primary" (click)="selectAndClose()"
        [disabled]="!enableSelectBtn">Seleccionar</button>
    <button *ngIf="showCloseBtn" mat-raised-button mat-dialog-close style="width: 105px;">Cerrar</button>

</div>
