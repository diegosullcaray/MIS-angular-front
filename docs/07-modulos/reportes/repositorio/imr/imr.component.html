<div class="stg-window" fxFill fxLayout="column">
    <stg-window-bar title="Indicadores IMR"> </stg-window-bar>
    <div class="stg-panel" fxLayout="column" fxFlex>
        <div fxLayout="row">
            <ng-container *ngIf="activeHier">
                <hier-rem-selector fxFlex [confHier]="confHier1"
                    (onSelectHier)="selectHier($event)"></hier-rem-selector>
            </ng-container>
        </div>
        <div style="padding-right: 10px; padding-left: 10px;">
            <div class="stg-simple-card" fxLayout="row" fxLayoutAlign="start center">
                <div fxLayoutGap="10">
                    <mat-form-field *ngIf="showFilterFlagAsesor">
                        <mat-label>Tipo de cartera</mat-label>
                        <mat-select [(value)]="selector1">
                            <mat-option *ngFor="let item of filter1" [value]="item"
                                (onSelectionChange)="eventFilter($event)">
                                {{item.label}} </mat-option>
                        </mat-select>
                    </mat-form-field>  
                </div>
            </div>
        </div> 
            
    
        <mat-tab-group style="height: 100%;" class="mat-tab-fill-height" (selectedTabChange)="onTabChanged($event);">
            <mat-tab>
                <ng-template mat-tab-label>
                    <span style="font-size: 14px;">Información</span>
                </ng-template>
                <ng-template matTabContent>
                    <div style="height: 100%;padding: 10px;" *ngIf="!loading" fxLayout="column" fxLayoutGap="10">
                        <!-- <div fxLayoutAlign="center">
                            <span style="font-weight: bold;font-size: 16px;">AGENDAMIENTO COMERCIAL TOTAL</span>
                        </div> -->
                        <stg-table2 fxFlex [dataSource]="dataSource" [headers]="headerDefs" [options]="Opts" [enableSort]="1" >
                        </stg-table2>
                    </div>
                </ng-template>
            </mat-tab> 
        </mat-tab-group>
    </div>
</div>
