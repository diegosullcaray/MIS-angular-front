<div class="stg-window" fxFill fxLayout="column">
    <stg-window-bar title="Seguros Pasivos"> </stg-window-bar>
    <div class="stg-panel" fxLayout="column" fxFlex>
        <div fxLayout="row">
            <ng-container *ngIf="activeHier">
                <hier-rem-selector fxFlex [confHier]="confHier1"
                    (onSelectHier)="selectHier($event)"></hier-rem-selector>
            </ng-container>
        </div>
         
        <mat-tab-group style="height: 100%;" class="mat-tab-fill-height">
            <mat-tab>
                <ng-template mat-tab-label>
                    <span style="font-size: 14px;">Seguro Pasivo Resumen</span>
                </ng-template>
                <ng-template matTabContent>
                    
                    <div style="height: 100%;padding: 10px;" *ngIf="!loading" fxLayout="column" fxLayoutGap="10">
                        <div class="low-ltrs" fxLayout="column" fxFlex="100" fxLayoutGap="10">
                           
                            <stg-table2 fxFlex [dataSource]="dataSource3" [headers]="headerDefs3" [options]="Opts" [customCellStyler]="customStyler">
                            </stg-table2>
                        </div>

                         
                    </div>

                </ng-template>
            </mat-tab>

            <mat-tab>
                <ng-template mat-tab-label>
                    <span style="font-size: 14px;">Seguros Oncologicos</span>
                </ng-template>

                <ng-template matTabContent>

                    <div style="height: 100%;padding: 10px;" *ngIf="!loading" fxLayout="column" fxLayoutGap="10">
                        <div class="low-ltrs" fxLayout="column" fxFlex="100" fxLayoutGap="10">
                           
                            <stg-table2 fxFlex [dataSource]="dataSource" [headers]="headerDefs" [options]="Opts">
                            </stg-table2>
                        </div>

                         
                    </div>
                </ng-template>


 
            </mat-tab>

            <mat-tab>
                <ng-template mat-tab-label>
                    <span style="font-size: 14px;">Vida Segura </span>
                </ng-template>
                <ng-template matTabContent>
                    
                    <div style="height: 100%;padding: 10px;" *ngIf="!loading" fxLayout="column" fxLayoutGap="10">
                        <div class="low-ltrs" fxLayout="column" fxFlex="100" fxLayoutGap="10">
                           
                            <stg-table2 fxFlex [dataSource]="dataSource2" [headers]="headerDefs2" [options]="Opts">
                            </stg-table2>
                        </div>

                         
                    </div>

                </ng-template>
            </mat-tab>
            <mat-tab>
                <ng-template mat-tab-label>
                    <span style="font-size: 14px;">Protección Total </span>
                </ng-template>
                <ng-template matTabContent>
                    
                    <div style="height: 100%;padding: 10px;" *ngIf="!loading" fxLayout="column" fxLayoutGap="10">
                        <div class="low-ltrs" fxLayout="column" fxFlex="100" fxLayoutGap="10">
                           
                            <stg-table2 fxFlex [dataSource]="dataSource4" [headers]="headerDefs4" [options]="Opts">
                            </stg-table2>
                        </div>

                         
                    </div>

                </ng-template>
            </mat-tab>
            <mat-tab>
                <ng-template mat-tab-label>
                    <span style="font-size: 14px;">Protección 360 </span>
                </ng-template>
                <ng-template matTabContent>
                    
                    <div style="height: 100%;padding: 10px;" *ngIf="!loading" fxLayout="column" fxLayoutGap="10">
                        <div class="low-ltrs" fxLayout="column" fxFlex="100" fxLayoutGap="10">
                           
                            <stg-table2 fxFlex [dataSource]="dataSource5" [headers]="headerDefs5" [options]="Opts">
                            </stg-table2>
                        </div>

                         
                    </div>

                </ng-template>
            </mat-tab>
        </mat-tab-group>



    </div>
</div>
