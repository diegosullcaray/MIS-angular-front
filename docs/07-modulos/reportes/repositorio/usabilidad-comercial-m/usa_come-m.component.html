    <stg-window-bar-m
  [items]="filter1"
  [title]="'Tablero Digital Comercial'"
  [showTitle]="true"
  [icon]="'date_range'"
  [placeholder]="'Seleccionar fecha'"
  [(ngModel)]="fechaMensual"
  (selectionChange)="onFechaChange($event)">
</stg-window-bar-m>

    <div class="stg-panel" fxLayout="column" fxFlex>
        <div fxLayout="row">
            <ng-container *ngIf="activeHier">
                <hier-rem-selector fxFlex [confHier]="confHier1"
                    (onSelectHier)="selectHier($event)"></hier-rem-selector>
            </ng-container>
        </div>
          
        <stg-table2 fxFlex [dataSource]="dataSource" [headers]="headerDefs" [options]="Opts" (onClickCell)="ddEventV($event)">
        </stg-table2>
  
    </div>
</div>
