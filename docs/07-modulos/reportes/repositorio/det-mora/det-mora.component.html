<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shift" />

<div class="dashboard-container">
  <header class="dashboard-header">
    <h1 class="dashboard-title">DETALLE MORA</h1>
    <div class="filters-panel"> 
      <ng-container *ngIf="activeHier">
        <hier-rem-selector fxFlex [confHier]="confHier1" class="compact-selector"
          (onSelectHier)="selectHier($event)">
        </hier-rem-selector>
      </ng-container>
    </div>
  </header>

  <main class="content-area" >
   
    
    <div class="table-container">
      <div fxFlex> 
        <stg-table2 [dataSource]="dataSource" [headers]="headerDefs" [options]="Opts"
          [enableSort]="1">
        </stg-table2>
      </div>
    </div>
    <!-- Paginador debajo -->
  <div class="paginator-wrapper" *ngIf="showPaginator">
    <stg-paginator 
      #paginator 
      [totalLenght]="dataSource3Length" 
      pageLenght="10"
      (onChangePage)="eventChangePage($event)">
    </stg-paginator>
  </div>
    
  </main>
</div>
