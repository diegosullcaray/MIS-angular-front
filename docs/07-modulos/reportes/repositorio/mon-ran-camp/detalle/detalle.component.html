<div *ngIf="!config.loading" style="width:100%;height:100%" fxLayout="column" class="stg-window">

        (onClose)="navMain()">
    </stg-window-bar>

        <ng-container>
            <input type=text class="stg-input" placeholder="Buscar" (keyup)="filter($event)">
        </ng-container>
    </div> -->
    <div fxFlex style="padding: 5px;">
        <!--service.dataSource$ | async-->
        <stg-table2 [options]="tableOpts" [dataSource]="dataSource" [headers]="tableHeaders">
        </stg-table2>
    </div>

        <stg-paginator #paginator [totalLenght]="dataSourceLenght" pageLenght="20"

        </stg-paginator>
    </div>
</div>
