<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<div class="dashboard-container">
  <header class="dashboard-header">
    <h1 class="dashboard-title">Ranking Unidades de Negocio - Desembolsos</h1>
    <div class="filters-panel "> 
      <ng-container *ngIf="activeHier">
        <hier-rem-selector fxFlex [confHier]="confHier1" class="compact-selector"
          (onSelectHier)="selectHier($event)">
        </hier-rem-selector>
      </ng-container>
    </div>
  </header>

  <main class="content-area" >
  
    <div class="table-container">
      
      <div class="table-toolbar">
        <div class="timing-chip">
          <span class="material-symbols-outlined icon">schedule</span>
          <span class="label">Avance Esperado (Timing):</span>
          <span class="value">{{ avanceEsperado | number:'1.2-2' }}%</span>
        </div>
        <div class="search-filters-container">
          <div class="search-box-mini">
              <span class="material-symbols-outlined search-icon">search</span>
              <input type="text" placeholder="Buscar Unidad..." (input)="aplicarFiltro('unidad', $event)">
          </div>
          <div class="search-box-mini">
              <span class="material-symbols-outlined search-icon">search</span>
              <input type="text" placeholder="Buscar Corredor..." (input)="aplicarFiltro('corredor', $event)">
          </div>
          <div class="search-box-mini mat-select-mini">
            <span class="material-symbols-outlined search-icon">filter_list</span>
            <mat-select (selectionChange)="aplicarFiltro('territorio', $event)" value="" panelClass="dropdown-territorio">
                <mat-option value="">Todos los Territorios</mat-option>
                <mat-option *ngFor="let terr of territoriosDisponibles" [value]="terr">{{ terr }}</mat-option>
            </mat-select>
        </div>
      </div>
      </div>
      
      <div fxFlex class="table-wrapper" style="margin-left: 10px; margin-right: 10px;"> 
        <stg-table4 [dataSource]="dataSource" [headers]="headerDefs" [options]="Opts"  
          [enableSort]="1">
        </stg-table4>
      </div>
      
    </div>
    
  </main>
</div>
