<app-select-group [config_select_group]='config_select_group' (refresh)="load($event)"></app-select-group>
<app-select-multiple [config_select_multiple]='config_select_multiple' (refresh)="loadFilter($event)"></app-select-multiple>

<div fxLayout="column">
  <ng-container *ngIf="activeHier">
    <hier-rem-selector fxFlex [confHier]="confHier1" (onSelectHier)="selectHier($event)"></hier-rem-selector>
  </ng-container>
  <ng-container *ngIf="activeFilters">
    <app-select-multiple [config_select_multiple]='configFilters' (refresh)="loadFilter($event)"></app-select-multiple>
  </ng-container>
  
  <mat-tab-group>
  <mat-tab label="Saldo Vigente">
   <!-- <app-table-multiheader *ngFor='let c of configT;let i=index'[config_table]='config_table[i]'></app-table-multiheader> -->
     <app-table-multiheader  [config_table]='config_table[0]'></app-table-multiheader> 
     <app-table-multiheader  [config_table]='config_table[1]'></app-table-multiheader> 
  </mat-tab>
  <mat-tab label="Saldo Total">
           <app-table-multiheader  [config_table]='config_table[2]'></app-table-multiheader>
          <app-table-multiheader  [config_table]='config_table[3]'></app-table-multiheader> 
           
  </mat-tab>
  
  </mat-tab-group>
  <app-table-multiheader  [config_table]='config_table[4]'></app-table-multiheader>  
  <app-graphic-basic [config_graphic]='config_graphic'></app-graphic-basic>
</div>
