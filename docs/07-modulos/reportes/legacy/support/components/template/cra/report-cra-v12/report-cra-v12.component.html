            <mat-card class="mat-elevation-z m-033">

                        <div class="m-033">

                    <div fxFlex="100" fxFlex.gt-sm="28" fxFlex.sm="33">

                                <input matInput [matDatepicker]="picker" (dateChange)="fechapicker($event)">

                                <mat-label>Fecha Compromiso</mat-label> 
                                <input matInput [matDatepicker]="picker" placeholder=""
                                (dateInput)="addEvent('input', $event)" (dateChange)="addEvent('change', $event)">
                         <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                         <mat-datepicker #picker disabled="false"></mat-datepicker>
                            </mat-form-field>
                        </div>
                    </div>
    
                    <div fxFlex="100" fxFlex.gt-sm="28" fxFlex.sm="33">
                        <div class="m-033">
                            <mat-form-field class="example-full-width" style="width:100%">
                                <input matInput [formControl]="txt_asesor" placeholder="Asesor" #input>

                        </div>
                    </div>
                    <div fxFlex="100" fxFlex.gt-sm="28" fxFlex.sm="33">
                        <div class="m-033">
                            <button mat-raised-button color="primary" (click)="loadAsesor()">Buscar Asesor</button>

                    </div>

            <app-table-ajax [config_table]='config_table_ajax' (refresh)="loadAjax($event)"></app-table-ajax>
