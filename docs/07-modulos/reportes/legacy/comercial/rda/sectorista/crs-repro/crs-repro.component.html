<h2 class="title-module">{{title_module}}</h2>
<app-auto-complete-sec (refresh)="load($event)"></app-auto-complete-sec>
<mat-card *ngIf="active_db" class="mat-elevation-z m-033">
    <div fxFlex="100" fxLayoutAlign="end">
        <div class="m-033">
            <button mat-raised-button color="primary" (click)="downloadDetail()">Descarga Detalle</button>
        </div>
    </div>
</mat-card>
<app-select-multiple [config_select_multiple]='config_select_multiple' (refresh)="loadFilter($event)">
</app-select-multiple>
<mat-tab-group [selectedIndex]="selected" (selectedIndexChange)="selected=$event">
    <mat-tab label="Lista Reprogramación" disabled>
        <app-table-multiheader *ngFor='let c of config;let i=index' [config_table]='config_table[i]'
            (refresh)="update($event)"></app-table-multiheader>
    </mat-tab>
    <mat-tab label="Actualizar Datos" disabled>
        <div fxLayout="row wrap" fxLayoutAlign="space-around center">
            <div fxFlex="100" fxFlex.gt-xs="100">
                <h2 class="title-module">{{cliente}}</h2>
            </div>
            <div fxFlex="100" fxFlex.gt-xs="100">
                <app-select-multiple [config_select_multiple]='config_select_multiple_form'
                    (refresh)="previewSave($event)"></app-select-multiple>
            </div>
            <div fxFlex="100" fxFlex.gt-xs="20" fxFlex.xs="50">
                <div class="m-033">
                    <button mat-raised-button color="primary" (click)="selected=0">
                        <mat-icon>keyboard_return</mat-icon>Regresar
                    </button>
                </div>
            </div>
            <div fxFlex="100" fxFlex.gt-xs="20" fxFlex.xs="50">
                <div class="m-033">
                    <button mat-raised-button color="primary" (click)="save()">
                        <mat-icon>save</mat-icon>Guardar
                    </button>
                </div>
            </div>
        </div>
    </mat-tab>
</mat-tab-group>
