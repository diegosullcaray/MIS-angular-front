<div fxLayout="column">
    <ng-container *ngIf="activeHier">
        <hier-rem-selector fxFlex [confHier]="confHier1" (onSelectHier)="selectHier($event)"></hier-rem-selector>
    </ng-container>
    <ng-container *ngIf="activeFilters">
        <app-select-multiple [config_select_multiple]='configFilters' (refresh)="loadFilter($event)"></app-select-multiple>
    </ng-container>
    
    <app-table-multiheader *ngFor='let c of config;let i=index'[config_table]='config_table[i]' (refresh)="loadG($event)"></app-table-multiheader>
    <app-graphic-basic [config_graphic]='config_graphic'></app-graphic-basic>
</div>
