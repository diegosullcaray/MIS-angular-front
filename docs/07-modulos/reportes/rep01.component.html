<div fxLayout="column" fxFill>
    <!--cabecera-->
    <div fxLayout="row" style="height: 48px;">
        <div fxFlex.gt-sm="10" fxLayoutAlign="start center" style="padding-left: 5px;background-color: white;">
            <button mat-button (click)="toggleExplorer()">
                <mat-icon style="color: black;">dehaze</mat-icon>
            </button>
        </div>
        <div fxFlex style="background-color: white;">

        </div>
        <div fxHide fxShow.gt-sm fxFlex="10" style="background-color: white;"></div>
    </div>
    <div fxFlex style="overflow-y: auto;height: 100%;">

        <mat-sidenav-container style="height: 100%;">
            <mat-sidenav [style]="calcWidth()" mode="side" [opened]="layout.isMobile ? openExplorerMob : openExplorerDesk" (openedChange)="layout.isMobile ? (openExplorerMob = $event) : (openExplorerDesk = $event)">
                <!--(closed)="msg('close!')" (opened)="msg('open!')"-->
                <mod-rep-sidenav [menuItems]="menuItems" (onSelectMenuItem)="hideExplorer($event)"></mod-rep-sidenav>
            </mat-sidenav>

            <mat-sidenav-content>
                <router-outlet></router-outlet>
            </mat-sidenav-content>
        </mat-sidenav-container>
    </div>
</div>
