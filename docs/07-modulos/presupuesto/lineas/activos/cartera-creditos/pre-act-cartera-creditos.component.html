<div>
    <ng-container *ngIf="activeHier">
        <hier-rem-selector [confHier]="confHier" (onSelectHier)="selectHier($event)"></hier-rem-selector> 

    </ng-container>
    <div style="height: 10px;"></div>
    <div class="stg-panel">
        <div class="stg-window">
            <stg-window-bar [title]="mainTitle"></stg-window-bar>
            <stg-toolbar>

                <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px" >
                    <button mat-button color="primary" (click)="save()" *ngIf="actSave">
                        <mat-icon>save</mat-icon><span style="padding-left: 5px;">Guardar</span>
                    </button>
                    <button mat-flat-button (click)="restart()" *ngIf="actSave">
                        <mat-icon>restore</mat-icon><span style="padding-left: 5px;">Reiniciar</span>
                    </button>
                    <button mat-flat-button (click)="verify()" *ngIf="actVeri">
                        <mat-icon>check_circle</mat-icon><span style="padding-left: 5px;">Verificar</span>
                    </button>
                </div>
            </stg-toolbar>
            <div style="height: 10px;"></div>
            <div style="padding: 0px 10px;">
                <mat-tab-group fxFlex style="overflow-y: auto;">
                    <mat-tab label="Variables">
                        <ng-template matTabContent>
                            <div style="height: 15px;"></div>
                            <stg-table [tableStyleConfig]="tableCfgStyle" [loadingStyleConfig]="loadingConf"
                                [headersDef]="headerDefs" [dataSource]="wsSource" [loadingObs]="loadingObs"
                                [customComponentCell]="customComponent" [customComponentStyler]="inputStyler"
                                [metaSources]="tableMeta" (onEditCell)="editCell($event)">
                                <!--[actionTrigger]="action" [iconizerMap]="iconColMap"
                [metaSources]="extraSources" >-->
                            </stg-table>
                        </ng-template>
                    </mat-tab>
                    <mat-tab label="Comp. Prod. Monto">
                        <ng-template matTabContent>
                            <div style="height: 15px;"></div>
                            <stg-table [tableStyleConfig]="tableCfgStyle" [loadingStyleConfig]="loadingConf"
                                [headersDef]="headerDefs2" [dataSource]="csSource" [loadingObs]="loadingObs">
                            </stg-table>
                        </ng-template>
                    </mat-tab>
                    <mat-tab label="Comp. Prod. Ratio">
                        <ng-template matTabContent>
                            <div style="height: 15px;"></div>
                            <stg-table [tableStyleConfig]="tableCfgStyle" [loadingStyleConfig]="loadingConf"
                                [headersDef]="headerDefs3" [dataSource]="csSource" [loadingObs]="loadingObs">
                            </stg-table>
                        </ng-template>
                    </mat-tab>
                </mat-tab-group>
            </div>
            <div style="height: 10px;"></div>
            <div style="height: 50px;padding-left: 10px;padding-top: 15px;font-size: 12px;">
                <span>*Los saldos y ratios mostrados estan construidos para generar un historico en función de los
                    responsables vigentes al último cierre de mes.</span>
            </div>
        </div>
    </div>
</div>
