<div *ngIf="!config.loading" fxFill fxLayout="column">
    <div fxFlex fxLayout="row" fxLayout.lt-md="column" fxLayoutGap="5px">
        <div fxFlex="60" fxLayout="row" fxLayoutGap="5px">
            <div fxLayoutAlign="center center" style="width: 85px;">
                <div class="portrait">
                    <img class="p" src="{{config.usu.img_url}}" alt="" referrerpolicy="no-referrer">
                </div>    
            </div>
            <div fxFlex fxLayout="column" class="usu">
                <div fxFlex>
                    <div fxFlex fxLayout="column">
                        <span class="t">{{config.usu.nom}}</span>
                        <span class="n">{{config.usu.niv}}: {{config.usu.des_niv}}</span>
                    </div>
                    <div fxFlex="20" *ngIf="config.change_btn" fxLayoutAlign="start center">
                        <stg-button color="primary" icon="person_search" (click)="chooser()"></stg-button>
                    </div>
                </div>
                <div fxFlex="50" class="var-icon" fxLayout="row" fxLayoutAlign="space-around center">
                    <ng-container *ngFor="let item of config.sem;let i = index;let c = count;">
                        <ng-container *ngIf="item.show">
                            <div fxLayout="column" fxLayoutGap="5px" fxLayoutAlign="center center" style="padding: 0px 3px;">
                                <span [class]="getIconCls(item.val)">{{item.icon}}</span>
                                <span fxHide.lt-md [class]="getDesCls(item.val)">{{item.des}}</span>
                            </div>
                        </ng-container>
                    </ng-container>
                </div>
            </div>
        </div>
        <app-monetizado-incentivos3 fxFlex></app-monetizado-incentivos3>

        <span *ngIf="!layout.isMobile">*Los cálculos son referenciales y están sujetos a variaciones al final de mes y ajustes particulares de la normativa.</span>
