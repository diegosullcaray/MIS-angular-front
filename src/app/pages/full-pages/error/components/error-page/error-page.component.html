<div class="flex flex-col items-center justify-center gap-4 min-h-screen p-12 text-center">
  <div class="flex items-center justify-center w-20 h-20 rounded-full bg-[var(--mis-danger-light)]">
    <ng-icon [name]="info().icono" size="36" class="text-[var(--mis-danger)]" />
  </div>
  <div class="text-[64px] font-bold text-[var(--mis-primary-light)] leading-none tracking-[-2px]">{{ info().code }}</div>
  <h1 class="m-0 text-[var(--mis-text-2xl)] font-semibold text-[var(--mis-text-primary)]">{{ info().titulo }}</h1>
  <p class="m-0 text-[var(--mis-text-secondary)] text-[var(--mis-text-base)] max-w-[420px]">
    {{ info().mensaje }}
  </p>

  <div class="flex items-center gap-3 mt-2">
    <button
      type="button"
      class="inline-flex items-center gap-2 px-5 py-2 rounded-[6px] bg-[var(--mis-primary)] text-[var(--mis-text-on-primary)] border-0 text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-[var(--mis-primary-hover)]"
      (click)="ejecutarAccion()"
    >
      <ng-icon [name]="accionIcono[info().accion]" size="14" />
      {{ accionLabel[info().accion] }}
    </button>
    <a routerLink="/admin/dashboard" class="inline-flex items-center gap-2 px-5 py-2 rounded-[6px] bg-transparent text-[var(--mis-text-secondary)] no-underline text-sm font-medium transition-colors duration-150 hover:text-[var(--mis-text-primary)]">
      Mi espacio
    </a>
  </div>
</div>
