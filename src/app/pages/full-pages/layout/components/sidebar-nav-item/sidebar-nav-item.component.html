<div class="nav-item-node" [class.nav-item-node--expanded]="esGrupo && expanded()">
  <a
    (click)="onClick($event)"
    [routerLink]="esGrupo ? null : ruta().ruta"
    routerLinkActive="nav-item-link--active"
    [routerLinkActiveOptions]="{ exact: false }"
    class="nav-item-link flex items-center gap-1.5 mx-1 my-[1px] rounded-[8px] py-1.5 pr-1 text-sm no-underline cursor-pointer transition-all duration-150"
    [style.paddingLeft.px]="8 + depth() * 14"
  >
    @if (ruta().icono) {
      <i [class]="ruta().icono + ' text-[13px] shrink-0'"></i>
    } @else {
      <span class="nav-item-dot w-[5px] h-[5px] rounded-full shrink-0 ml-1"></span>
    }
    <span class="flex-1 whitespace-nowrap overflow-hidden text-ellipsis">{{ ruta().etiqueta }}</span>
    @if (esGrupo) {
      <i class="pi pi-chevron-down nav-item-chevron text-[11px] shrink-0" [class.nav-item-chevron--open]="expanded()"></i>
    }
  </a>

  @if (esGrupo && expanded()) {
    <ul class="nav-item-submenu list-none m-0 p-0">
      @for (hijo of ruta().hijos!; track hijo.etiqueta; let i = $index) {
        <li>
          <app-sidebar-nav-item
            [ruta]="hijo"
            [depth]="depth() + 1"
            [index]="i"
            [expanded]="currentExpandedIndex()[depth() + 1] === i"
            [currentExpandedIndex]="currentExpandedIndex()"
            (expandChange)="onExpandChangeHijo($event)"
            (rutaSeleccionada)="onRutaSeleccionadaHijo($event)"
          />
        </li>
      }
    </ul>
  }
</div>
