<!-- Col 1: Tira de íconos — barra inferior fija en mobile (estilo Facebook), rail vertical desde sm: -->
<aside
  id="tour-sidebar-icons"
  class="fixed bottom-0 inset-x-0 z-40 w-full h-16 flex flex-row items-stretch justify-around gap-0 px-1 pb-[env(safe-area-inset-bottom)] bg-[var(--mis-sidebar-bg)] overflow-x-auto overflow-y-hidden scrollbar-none sm:static sm:inset-auto sm:z-auto sm:w-[var(--mis-sidebar-col1-w)] sm:h-full sm:flex-col sm:items-center sm:justify-start sm:gap-0 sm:px-0 sm:py-1 sm:pb-1 sm:overflow-hidden"
  aria-label="Sistemas"
>
  <!-- Botón Menú Hamburguesa — solo en el rail vertical de desktop; en mobile el botón vive en el header (arriba) -->
  <button
    class="hidden sm:flex w-9 h-9 rounded-[10px] bg-transparent hover:bg-white/10 text-white/70 hover:text-white items-center justify-center shrink-0 sm:mb-1 border-0 cursor-pointer transition-all duration-150 active:bg-white/15 focus:outline-none"
    (click)="shell.toggleNavPanel()"
    aria-label="Alternar menú lateral"
    pTooltip="Alternar menú"
  >
    <i class="pi pi-bars text-[20px]"></i>
  </button>

  <div class="hidden sm:block sm:w-7 sm:h-[1px] sm:mx-0 sm:my-1 bg-white/12 shrink-0"></div>

  <!-- Íconos de sistemas -->
  <div class="flex flex-row items-center justify-around gap-3 flex-1 overflow-x-auto overflow-y-hidden w-auto px-2 scrollbar-none sm:flex-col sm:items-center sm:justify-start sm:gap-[2px] sm:w-full sm:px-0 sm:overflow-y-auto sm:overflow-x-hidden">
    @for (icon of iconos(); track icon.id) {
      <button
        class="sidebar-icon-btn w-12 h-12 sm:w-11 sm:h-auto shrink-0 flex flex-col items-center justify-center gap-[3px] sm:py-2 border-0 bg-transparent text-white/55 rounded-[10px] cursor-pointer transition-all duration-150 relative hover:bg-white/10 hover:text-white/90"
        [class.sidebar-icon-btn--active]="iconActivoId() === icon.id"
        [pTooltip]="icon.etiqueta"
        (click)="seleccionarIcono(icon)"
        [attr.aria-label]="icon.etiqueta"
        [attr.aria-current]="iconActivoId() === icon.id ? 'page' : null"
      >
        <i [class]="icon.icono + ' text-[20px]'"></i>
        <span class="text-[9px] font-medium text-center leading-none whitespace-nowrap overflow-hidden text-ellipsis max-w-[40px]">{{ icon.etiqueta }}</span>
      </button>
    }
  </div>
</aside>

<!-- Col 2: Panel de navegación con animación de desvanecimiento (fade in/out) -->
@if (panelActivo(); as panel) {
  <!-- Fondo oscuro que bloquea el layout en mobile mientras el panel está abierto -->
  @if (!shell.navPanelColapsado()) {
    <div
      class="sm:hidden fixed inset-0 bottom-16 z-40 bg-black/50 transition-opacity duration-300 ease-in-out"
      (click)="shell.setNavPanelColapsado(true)"
      aria-hidden="true"
    ></div>
  }

  <div
    class="transition-all duration-300 ease-in-out overflow-hidden shrink-0 sm:h-full"
    [class.w-0]="shell.navPanelColapsado()"
    [class.opacity-0]="shell.navPanelColapsado()"
    [class.pointer-events-none]="shell.navPanelColapsado()"
    [class.w-[85vw]]="!shell.navPanelColapsado()"
    [class.sm:w-[220px]]="!shell.navPanelColapsado()"
    [class.opacity-100]="!shell.navPanelColapsado()"
  >
    @if (cambiandoPanel()) {
      <!-- Esqueleto de transición al cambiar de sistema -->
      <div
        class="fixed top-0 left-0 bottom-16 z-50 w-[85vw] max-w-[300px] shadow-2xl flex flex-col overflow-hidden sm:static sm:inset-auto sm:z-auto sm:h-full sm:w-[220px] sm:shrink-0 sm:shadow-none bg-white/80 backdrop-blur-xl border-r border-[var(--mis-border)]"
        aria-label="Cargando navegación del sistema"
      >
        <div class="flex items-center gap-3 px-3 h-[44px] min-h-[44px] border-b border-[var(--mis-border)] shrink-0 box-border">
          <p-skeleton shape="circle" width="1.75rem" height="1.75rem" />
          <p-skeleton width="60%" height="1rem" />
        </div>
        <div class="flex flex-col gap-3 p-3">
          @for (i of [1, 2, 3, 4, 5]; track i) {
            <p-skeleton height="1.1rem" />
          }
        </div>
      </div>
    } @else {
      <app-sidebar-nav-panel
        [panelConfig]="panel"
        (rutaSeleccionada)="onRutaSeleccionada($event)"
      />
    }
  </div>
}
