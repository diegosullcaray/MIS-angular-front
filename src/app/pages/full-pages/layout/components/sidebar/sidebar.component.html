<!-- Col 1: Tira de íconos — barra inferior fija en mobile (estilo Facebook), rail vertical desde sm: -->
<aside
  id="tour-sidebar-icons"
  class="sidebar-rail fixed bottom-0 inset-x-0 z-40 w-full h-16 flex flex-row items-center justify-between gap-0 px-1 pb-[env(safe-area-inset-bottom)] overflow-hidden scrollbar-none sm:static sm:inset-auto sm:z-auto sm:w-[var(--mis-sidebar-col1-w)] sm:h-full sm:flex-col sm:items-center sm:justify-start sm:gap-0 sm:px-0 sm:py-1 sm:pb-1 sm:border-r sm:border-[var(--mis-border)]"
  aria-label="Sistemas"
>
  <!-- Wordmark MIS. Vive acá y no en el header desde que el rail es la
       constante visual del shell. Va siempre en su versión BLANCA —en claro y
       en oscuro— porque el rail es navy en los dos temas (`--mis-sidebar-bg`),
       donde el wordmark navy sería ilegible.
       Solo en el rail vertical: en mobile la Col 1 es una barra inferior de
       64px y ahí el alto es para los íconos. -->
  <a
    class="hidden sm:flex items-center justify-center w-full h-9 shrink-0 mb-1 no-underline"
    routerLink="/app/dashboard"
    aria-label="MIS — ir al inicio"
  >
    <img src="assets/images/fc/logos/mis_white.png" alt="MIS" class="h-4 w-auto opacity-90 hover:opacity-100 transition-opacity" />
  </a>

  <div class="hidden sm:block sm:w-7 sm:h-[1px] sm:mx-0 sm:mb-1 bg-white/12 shrink-0"></div>

  <!-- Contenedor relativo en mobile para alojar los íconos y las flechas de desplazamiento; rail vertical scrollable en desktop -->
  <div class="relative flex-1 flex flex-row items-center overflow-hidden w-full h-full sm:flex-col sm:min-h-0 sm:overflow-hidden">
    <!-- Flecha izquierda en mobile -->
    @if (puedeScrollIzquierda()) {
      <button
        type="button"
        class="sidebar-rail-edge sm:hidden absolute left-0 z-10 flex shrink-0 items-center justify-center w-8 h-full text-white/80 hover:text-white transition-all duration-150 border-0 cursor-pointer p-0 shadow-md"
        (click)="desplazarIzquierda()"
        aria-label="Desplazar íconos a la izquierda"
      >
        <i class="pi pi-chevron-left text-[16px] drop-shadow-md"></i>
      </button>
    }

    <!-- Íconos de sistemas -->
    <div
      #scrollContainer
      (scroll)="onScrollMobile()"
      class="flex flex-row items-center justify-start gap-3 flex-1 overflow-x-auto overflow-y-hidden w-full px-7 scrollbar-none sm:flex-col sm:items-center sm:justify-start sm:gap-[2px] sm:px-0 sm:w-full sm:h-full sm:min-h-0 sm:overflow-y-auto sm:overflow-x-hidden"
    >
      @for (icon of iconos(); track icon.id) {
        <button
          class="sidebar-icon-btn w-12 h-12 sm:w-11 sm:h-auto shrink-0 flex flex-col items-center justify-center gap-[3px] sm:py-2 border-0 bg-transparent text-white/70 rounded-[10px] cursor-pointer transition-all duration-150 relative hover:bg-white/10 hover:text-white/90"
          [class.sidebar-icon-btn--active]="iconActivoId() === icon.id"
          [pTooltip]="icon.etiqueta"
          (click)="seleccionarIcono(icon)"
          [attr.aria-label]="icon.etiqueta"
          [attr.aria-current]="iconActivoId() === icon.id ? 'page' : null"
        >
          <i [class]="icon.icono + ' text-[20px]'"></i>
          <span class="text-[9px] font-medium text-center leading-none whitespace-nowrap overflow-hidden text-ellipsis max-w-[40px]">{{ icon.etiqueta }}</span>
        </button>
      }
    </div>

    <!-- Flecha derecha en mobile -->
    @if (puedeScrollDerecha()) {
      <button
        type="button"
        class="sidebar-rail-edge sm:hidden absolute right-0 z-10 flex shrink-0 items-center justify-center w-8 h-full text-white/80 hover:text-white transition-all duration-150 border-0 cursor-pointer p-0 shadow-md"
        (click)="desplazarDerecha()"
        aria-label="Desplazar íconos a la derecha"
      >
        <i class="pi pi-chevron-right text-[16px] drop-shadow-md"></i>
      </button>
    }
  </div>
</aside>
