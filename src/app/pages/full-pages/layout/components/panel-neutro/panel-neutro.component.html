<div class="mis-page flex flex-col items-center justify-center min-h-[50vh] sm:min-h-[60vh] text-center p-4 py-8 sm:p-12 animate-fadeIn">
  <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] flex items-center justify-center mb-3 sm:mb-4 shadow-sm border border-[var(--mis-border)] shrink-0">
    <i [class]="iconoSistema() + ' text-2xl sm:text-3xl text-[var(--mis-primary-text)]'"></i>
  </div>
  <h2 class="text-lg sm:text-2xl font-bold text-[var(--mis-text-primary)] mb-2 px-2">
    {{ tituloSistema() }}
  </h2>
  <p class="text-xs sm:text-sm text-[var(--mis-text-secondary)] max-w-md mb-5 sm:mb-6 leading-relaxed px-2">
    Selecciona una opción del panel secundario a la izquierda para comenzar a consultar o gestionar la información de este módulo.
  </p>
  <button
    type="button"
    (click)="shell.setNavPanelColapsado(false)"
    class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[var(--mis-surface-elevado)] hover:bg-[var(--mis-panel-bg)] text-[var(--mis-text-primary)] text-xs font-medium border border-[var(--mis-border)] shadow-xs cursor-pointer transition-all duration-150 active:scale-95"
  >
    <i class="pi pi-arrow-left text-xs hidden sm:inline text-[var(--mis-secondary)]"></i>
    <i class="pi pi-bars text-xs sm:hidden text-[var(--mis-secondary)]"></i>
    <span>Elige una opción en el menú lateral</span>
  </button>
</div>
