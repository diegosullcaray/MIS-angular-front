<!-- Fondo: wallpaper_cell.png en mobile, wallpaper.png desde sm:. El velo
     (`shell-wallpaper::before`) lo oscurece en modo oscuro. -->
<div class="shell-wallpaper h-screen flex overflow-hidden bg-[url('/assets/images/fc/fondos/wallpaper_cell.png')] sm:bg-[url('/assets/images/fc/fondos/wallpaper.png')] bg-cover bg-center bg-no-repeat bg-fixed">
  <!-- Sidebar: Col1 (íconos) + Col2 (panel) -->
  <app-sidebar class="flex shrink-0 h-full" />

  <!-- Zona principal -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <!-- Header minimalista translúcido con elevación ligera z-30 -->
    <header
      class="h-[44px] min-h-[44px] shrink-0 bg-[var(--mis-surface-translucido)] backdrop-blur-md border-b border-[var(--mis-border)] shadow-2xs z-30 flex items-center w-full relative"
    >
      <app-header class="w-full h-full block" />
    </header>

    <!-- Contenido de la ruta activa -->
    <main class="flex-1 overflow-y-auto bg-transparent">
      <!-- Mientras se elige un sub-ítem tras cambiar de sistema, se oculta el
           router-outlet (todavía tiene montada la pantalla anterior) y se
           muestra este loader — ver ShellStateService.contenidoPendienteSeleccion. -->
      @if (shell.contenidoPendienteSeleccion()) {
        <div class="w-full p-3 pb-20 sm:p-4">
          <app-panel-neutro />
        </div>
      }
      <!-- pb-20: reserva espacio para la barra inferior fija del sidebar en mobile (h-16 + margen) -->
      <div class="w-full p-3 pb-20 sm:p-4 shell-content-inner" [class.hidden]="shell.contenidoPendienteSeleccion()">
        <router-outlet />
      </div>
    </main>
  </div>
  <app-redirect-overlay />
  <app-loading-overlay />
</div>
