<!-- Fondo: wallpaper_cell.png en mobile, wallpaper.png desde sm:. El velo
     (`shell-wallpaper::before`) lo oscurece en modo oscuro. -->
<div class="shell-wallpaper h-screen flex overflow-hidden bg-[url('/assets/images/fc/fondos/wallpaper_cell.png')] sm:bg-[url('/assets/images/fc/fondos/wallpaper.png')] bg-cover bg-center bg-no-repeat bg-fixed">
  <!-- Sidebar: Col1 (íconos) + Col2 (panel) -->
  <app-sidebar class="flex shrink-0 h-full" />

  <!-- Zona principal -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <!-- Header minimalista translúcido con elevación ligera z-30 -->
    <header
      class="h-[44px] min-h-[44px] shrink-0 bg-[var(--mis-surface-translucido)] backdrop-blur-md border-b border-[var(--mis-border)] shadow-2xs z-30 flex items-center w-full relative"
    >
      <app-header class="w-full h-full block" />
    </header>

    <!-- Contenido de la ruta activa. `flex flex-col` para que el panel de
         cada módulo (`.mis-window`/`.mis-page`, `flex:1`) llene el alto real
         disponible en vez de aproximarlo con un `calc(100vh - Npx)`. -->
    <main class="flex-1 flex flex-col overflow-y-auto bg-transparent">
      <!-- Mientras se elige un sub-ítem tras cambiar de sistema, se oculta el
           router-outlet (todavía tiene montada la pantalla anterior) y se
           muestra el explorador del sistema, que es desde donde se navega —
           ver ShellStateService.contenidoPendienteSeleccion. -->
      @if (shell.contenidoPendienteSeleccion()) {
        <div class="w-full flex-1 flex flex-col min-h-0 p-3 pb-20 sm:p-4">
          <app-explorador-sistema />
        </div>
      }
      <!-- pb-20: reserva espacio para la barra inferior fija del sidebar en mobile (h-16 + margen) -->
      <div
        class="w-full flex-1 flex flex-col min-h-0 p-3 pb-20 sm:p-4 shell-content-inner"
        [class.hidden]="shell.contenidoPendienteSeleccion()"
      >
        <router-outlet />
      </div>
    </main>
  </div>
</div>
<!-- Fuera de `.shell-wallpaper`: ese contenedor tiene `isolation: isolate`
     (ver .css), que crea un stacking context propio y le pone techo a
     cualquier z-index de adentro — incluido el z-[9999] de estos overlays.
     Los diálogos de PrimeNG con `appendTo="body"` (ej. `selector-nivel-dialog`)
     se montan directo en `<body>`, fuera de ese contexto, y por eso pintaban
     por ENCIMA del spinner aunque su propio z-index fuera menor. Estando acá
     afuera, ambos comparan en el mismo stacking context que esos diálogos. -->
<app-redirect-overlay />
<app-loading-overlay />
