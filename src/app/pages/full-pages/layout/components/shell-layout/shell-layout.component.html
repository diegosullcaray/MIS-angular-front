<div class="h-screen flex overflow-hidden bg-[url('/assets/images/fc/fondos/wallpaper.png')] bg-cover bg-center bg-no-repeat bg-fixed">
  <!-- Sidebar: Col1 (íconos) + Col2 (panel) -->
  <app-sidebar class="flex shrink-0 h-full" />

  <!-- Zona principal -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <!-- Header con fondo sólido opaco y elevación z-30 -->
    <header
      class="h-[56px] min-h-[56px] shrink-0 bg-white border-b border-[var(--mis-border)] shadow-xs z-30 flex items-center w-full relative"
    >
      <app-header class="w-full h-full block" />
    </header>

    <!-- Contenido de la ruta activa -->
    <main class="flex-1 overflow-y-auto bg-transparent">
      <!-- pb-20: reserva espacio para la barra inferior fija del sidebar en mobile (h-16 + margen) -->
      <div class="w-full p-3 pb-20 sm:p-4 shell-content-inner">
        <router-outlet />
      </div>
    </main>
  </div>
  <app-redirect-overlay />
</div>
