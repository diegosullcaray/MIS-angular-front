<div class="load-spinner-wrapper fixed inset-0 z-[999] min-h-screen flex flex-col items-center justify-center gap-6 p-4">
    <div class="relative flex items-center justify-center">
        <p-progressSpinner styleClass="mis-spinner" strokeWidth="3" fill="transparent" [style]="{ width: '180px', height: '180px' }" />
        <img src="assets/images/fc/avatars/mis_wait.png" alt="" class="absolute w-[130px] h-[130px] rounded-full" />
    </div>

    <div class="flex flex-col items-center gap-1 text-center">
        <span class="text-lg font-semibold text-white tracking-[0.2px]">{{ mensaje() }}</span>
        <span class="text-sm text-white/60">MIS — Sistema de Información</span>
    </div>
</div>
