@switch (paso()) {
  @case ('cargando') {
    <app-load-spinner />
  }
  @case ('verificando') {
    <app-load-spinner mensaje="Verificando tu sesión…" />
  }
  @default {
    <div class="login-wrapper min-h-screen w-full grid grid-cols-1 md:grid-cols-2 overflow-hidden">
      <!-- Left Column: Banner Image -->
      <div class="relative hidden md:flex md:flex-col overflow-hidden">
        <img
          src="assets/images/fc/fondos/images.jpg"
          alt="Atención en oficina Financiera Confianza"
          class="absolute inset-0 w-full h-full object-cover block"
        />
        <div
          class="absolute inset-0 bg-gradient-to-t from-[rgba(5,11,24,0.9)] via-[rgba(5,11,24,0.15)] to-transparent"
        ></div>
        <div class="relative mt-auto p-8 md:p-12 flex flex-col items-center gap-2">
          <img
            src="assets/images/fc/logos/fc_blank.png"
            alt="MIS — Sistema de Información"
            class="h-12 w-auto"
          />
        </div>
      </div>

      <!-- Right Column: Google Sign-In -->
      <div
        class="login-right-panel relative flex flex-col justify-center items-center bg-[var(--mis-surface)] p-6 md:p-16"
      >
        <!-- Marca MIS, esquina superior izquierda del panel (hidden on mobile) -->
        <div class="absolute top-6 left-6 hidden md:flex items-center gap-2">
          <!-- El wordmark navy es ilegible en oscuro: se cambia por la versión blanca. -->
          <img [src]="logoMis()" alt="MIS" class="h-9 w-auto" />
          <span class="text-lg font-bold text-[var(--mis-primary-text)]">Sistema de Información</span>
        </div>

        <div class="login-card w-full max-w-[380px] flex flex-col gap-4">
          <div class="flex flex-col items-center gap-1 mb-2">
            <h1 class="text-xl font-bold text-[var(--mis-primary-text)] m-0">Inicio de sesión</h1>
            <p class="text-sm text-[var(--mis-text-secondary)] text-center m-0">
              Ingresa con tu cuenta corporativa de Google.
            </p>
          </div>

          <p-button
            (onClick)="onGoogleLogin()"
            styleClass="w-full login-btn-dark mt-1"
          >
            <div class="flex items-center justify-center gap-3 w-full">
              <span class="flex items-center justify-center bg-white rounded-full p-1.5 shrink-0 shadow-sm">
                <svg class="w-4 h-4 block" viewBox="0 0 24 24">
                  <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                  />
                </svg>
              </span>
              <span class="font-semibold text-sm tracking-wide">Continuar con Google</span>
            </div>
          </p-button>

          <span class="text-xs text-[var(--mis-text-tertiary)] text-center">{{
            appVersion
          }}</span>
        </div>
      </div>
    </div>
  }
}
