<p-button
  [label]="etiquetaActual() ?? placeholder()"
  icon="pi pi-sitemap"
  [text]="true"
  size="small"
  (onClick)="abrir()"
/>

<p-dialog
  [header]="paramsHier().dlgTitulo"
  [(visible)]="dialogAbierto"
  [modal]="true"
  appendTo="body"
  [style]="{ width: '420px' }"
  [draggable]="false"
>
  @if (!cargandoRaiz() && nodos().length === 1) {
    <p-button
      label="Seleccionar toda la jerarquía"
      icon="pi pi-check-square"
      [text]="true"
      size="small"
      styleClass="w-full mb-2"
      (onClick)="seleccionarRaiz()"
    />
  }
  <p-tree
    [value]="nodos()"
    [loading]="cargandoRaiz()"
    selectionMode="single"
    [filter]="true"
    filterPlaceholder="Buscar…"
    emptyMessage="Sin niveles disponibles."
    (onNodeExpand)="onExpandir($event)"
    (onNodeSelect)="onSeleccionar($event)"
  />
</p-dialog>
