<app-window-panel
  [titulo]="config().mainTitle"
  [altoAuto]="true"
  [actualizando]="cargando()"
  [permitirActualizar]="nivelActual() !== null"
  etiquetaActualizar="Actualizar datos"
  (actualizar)="recargar()"
>
  <button
    ventana-acciones
    type="button"
    class="mis-window-btn"
    (click)="mostrarFiltros.set(!mostrarFiltros())"
    [attr.aria-pressed]="mostrarFiltros()"
    [attr.aria-label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    [pTooltip]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    tooltipPosition="bottom"
  >
    <i [class]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'" class="text-[14px]"></i>
  </button>

  @if (puedeGuardar() || puedeVerificar()) {
    <div class="flex items-center justify-end gap-2 flex-wrap">
      @if (puedeGuardar()) {
        <p-button label="Reiniciar" severity="secondary" [outlined]="true" size="small" (onClick)="reiniciar()" />
        <p-button label="Guardar" size="small" [loading]="guardando()" (onClick)="guardar()" />
      }
      @if (puedeVerificar()) {
        <p-button label="Verificar" icon="pi pi-check-circle" size="small" [loading]="verificando()" (onClick)="verificar()" />
      }
    </div>
  }

  <div class="flex items-center gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <app-hier-selector [paramsHier]="config().paramsHier" (nodoSeleccionado)="onNivelSeleccionado($event)" />
  </div>

  <app-editable-table
    [columnas]="config().columnas"
    [filas]="filas()"
    [cargando]="cargando()"
    [esEditable]="esEditable"
    (celdaEditada)="onCeldaEditada($event)"
  />

  <p class="text-[11px] text-[var(--mis-text-tertiary)]">
    Los datos mostrados están construidos para generar un histórico en función de los últimos responsables vigentes.
  </p>
</app-window-panel>
