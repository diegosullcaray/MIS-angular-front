<app-window-panel
  [conFiltros]="true" [filtrosAbiertos]="true"
  titulo="Cartera de Créditos"
  [altoAuto]="true"
  [actualizando]="cargando()"
  [permitirActualizar]="nivelActual() !== null"
  etiquetaActualizar="Actualizar cartera"
  (actualizar)="recargar()"
>
  @if (puedeGuardar() || puedeVerificar()) {
    <div class="flex items-center justify-end gap-2 flex-wrap">
      @if (puedeGuardar()) {
        <p-button label="Reiniciar" severity="secondary" [outlined]="true" size="small" (onClick)="reiniciar()" />
        <p-button label="Guardar" size="small" [loading]="guardando()" (onClick)="guardar()" />
      }
      @if (puedeVerificar()) {
        <p-button label="Verificar" icon="pi pi-check-circle" size="small" [loading]="verificando()" (onClick)="verificar()" />
      }
    </div>
  }

  <div ventana-filtros class="flex items-center gap-3 flex-wrap">
    <app-hier-selector [paramsHier]="paramsHier" [anchoCompleto]="true" [reintentarSinFecha]="true" (nodoSeleccionado)="onNivelSeleccionado($event)" />
  </div>

  <p-tabs [(value)]="tabActiva">
    <p-tablist>
      <p-tab value="variables">Variables</p-tab>
      <p-tab value="monto">Comp. Prod. Monto</p-tab>
      <p-tab value="ratio">Comp. Prod. Ratio</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="variables">
        <app-editable-table
          [columnas]="columnasVariables"
          [filas]="filas()"
          [cargando]="cargando()"
          [esEditable]="esEditable"
          (celdaEditada)="onCeldaEditada($event)"
        />
      </p-tabpanel>
      <p-tabpanel value="monto">
        <app-editable-table [columnas]="columnasMonto" [filas]="filasComposicion()" [cargando]="cargando()" [esEditable]="soloLectura" />
      </p-tabpanel>
      <p-tabpanel value="ratio">
        <app-editable-table [columnas]="columnasRatio" [filas]="filasComposicion()" [cargando]="cargando()" [esEditable]="soloLectura" />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

  <p class="text-[11px] text-[var(--mis-text-tertiary)]">
    Los datos mostrados están construidos para generar un histórico en función de los últimos responsables vigentes.
  </p>
</app-window-panel>
