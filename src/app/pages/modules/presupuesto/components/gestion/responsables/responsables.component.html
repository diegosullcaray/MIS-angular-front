<div class="flex flex-col gap-3">
  <div class="mis-card flex flex-wrap items-end gap-3 p-3 bg-white/95 backdrop-blur-[10px] border border-white/50">
    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Nivel</label>
      <p-select
        [options]="niveles"
        optionLabel="des_lvl"
        [ngModel]="nivelActual()"
        (ngModelChange)="onNivelCambiado($event)"
        styleClass="w-56"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Buscar elemento</label>
      <input
        pInputText
        type="text"
        placeholder="Buscar por nombre…"
        class="text-[13px]"
        [ngModel]="filtro()"
        (ngModelChange)="filtro.set($event)"
      />
    </div>

    <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">Responsables</h2>

    <div class="flex-1"></div>

    <p-button label="Reiniciar" severity="secondary" [text]="true" size="small" (onClick)="reiniciar()" />
    <p-button label="Guardar" size="small" [loading]="guardando()" (onClick)="guardar()" />
  </div>

  <app-editable-table
    [columnas]="columnas"
    [filas]="filasFiltradas()"
    [cargando]="cargando()"
    [esEditable]="esEditable"
  />
</div>
