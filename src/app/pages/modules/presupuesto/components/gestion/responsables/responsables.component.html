<div class="mis-card p-3.5 sm:p-5 flex flex-col gap-4 sm:gap-5 w-full bg-white/70 backdrop-blur-[15px] border border-white/60 rounded-xl shadow-lg">
  <div class="flex flex-col gap-3 pb-3.5 border-b border-[var(--mis-border)]">
    <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">Responsables</h2>

    <div class="flex items-end gap-3 flex-wrap">
      <div class="flex flex-col gap-1.5">
        <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Nivel</label>
        <p-select
          [options]="niveles"
          optionLabel="des_lvl"
          [ngModel]="nivelActual()"
          (ngModelChange)="onNivelCambiado($event)"
          styleClass="w-56"
          appendTo="body"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Buscar elemento</label>
        <input
          pInputText
          type="text"
          placeholder="Buscar por nombre…"
          class="text-[13px]"
          [ngModel]="filtro()"
          (ngModelChange)="filtro.set($event)"
        />
      </div>

      <div class="flex-1"></div>

      <p-button label="Reiniciar" severity="secondary" [outlined]="true" size="small" (onClick)="reiniciar()" />
      <p-button label="Guardar" size="small" [loading]="guardando()" (onClick)="guardar()" />
    </div>
  </div>

  <app-editable-table
    [columnas]="columnas"
    [filas]="filasFiltradas()"
    [cargando]="cargando()"
    [esEditable]="esEditable"
  />
</div>
