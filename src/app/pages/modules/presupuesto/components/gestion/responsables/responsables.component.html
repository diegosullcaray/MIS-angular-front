<app-window-panel
  titulo="Responsables"
  [altoAuto]="true"
  [actualizando]="cargando()"
  etiquetaActualizar="Actualizar responsables"
  (actualizar)="recargar()"
>
  <!-- Acciones de edición: se quedan en el cuerpo (llevan etiqueta y son
       acciones de formulario, no de ventana). -->
  <div class="flex items-center justify-end gap-2 flex-wrap">
    <p-button label="Reiniciar" severity="secondary" [outlined]="true" size="small" (onClick)="reiniciar()" />
    <p-button label="Guardar" size="small" [loading]="guardando()" (onClick)="guardar()" />
  </div>

  <!-- Franja de filtros: solo lo que cambia la consulta al backend. -->
  <div class="flex items-end gap-3 flex-wrap w-fit p-3 bg-[var(--mis-panel-bg)]/60 border border-[var(--mis-border)] rounded-lg shadow-sm">
    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-semibold text-[var(--mis-text-primary)]">Nivel</label>
      <p-select
        [options]="niveles"
        optionLabel="des_lvl"
        [ngModel]="nivelActual()"
        (ngModelChange)="onNivelCambiado($event)"
        styleClass="w-56"
        appendTo="body"
      />
    </div>
  </div>

  <app-editable-table
    [columnas]="columnas"
    [filas]="filasFiltradas()"
    [cargando]="cargando()"
    [esEditable]="esEditable"
    [conCaption]="true"
  >
    <!-- El buscador filtra las filas ya cargadas, así que va en el caption de
         la tabla y no en la franja de filtros. -->
    <div tabla-caption class="flex items-center gap-2">
      <p-iconfield iconPosition="left" styleClass="w-full sm:w-72">
        <p-inputicon styleClass="pi pi-search text-xs text-[var(--mis-text-tertiary)]" />
        <input
          pInputText
          type="text"
          placeholder="Buscar elemento por nombre…"
          class="w-full text-[13px]"
          aria-label="Buscar elemento en la tabla"
          [ngModel]="filtro()"
          (ngModelChange)="filtro.set($event)"
        />
      </p-iconfield>
      <span class="text-[11px] text-[var(--mis-text-tertiary)]">{{ filasFiltradas().length }} de {{ totalFilas() }}</span>
    </div>
  </app-editable-table>
</app-window-panel>
