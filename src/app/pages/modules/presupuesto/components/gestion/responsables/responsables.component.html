<app-window-panel
  titulo="Responsables"
  [altoAuto]="true"
  [actualizando]="cargando()"
  etiquetaActualizar="Actualizar responsables"
  (actualizar)="recargar()"
>
  <!-- Acciones de edición: se quedan en el cuerpo (llevan etiqueta y son
       acciones de formulario, no de ventana). -->
  <div class="flex items-center justify-end gap-2 flex-wrap">
    <p-button label="Reiniciar" severity="secondary" [outlined]="true" size="small" (onClick)="reiniciar()" />
    <p-button label="Guardar" size="small" [loading]="guardando()" (onClick)="guardar()" />
  </div>

  <div class="flex items-end gap-3 flex-wrap">
    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Nivel</label>
      <p-select
        [options]="niveles"
        optionLabel="des_lvl"
        [ngModel]="nivelActual()"
        (ngModelChange)="onNivelCambiado($event)"
        styleClass="w-56"
        appendTo="body"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Buscar elemento</label>
      <input
        pInputText
        type="text"
        placeholder="Buscar por nombre…"
        class="text-[13px]"
        [ngModel]="filtro()"
        (ngModelChange)="filtro.set($event)"
      />
    </div>
  </div>

  <app-editable-table
    [columnas]="columnas"
    [filas]="filasFiltradas()"
    [cargando]="cargando()"
    [esEditable]="esEditable"
  />
</app-window-panel>
