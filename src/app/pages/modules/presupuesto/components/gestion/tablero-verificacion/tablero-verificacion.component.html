<app-window-panel
  [conFiltros]="true"
  titulo="Tablero de Verificación"
  [altoAuto]="true"
  [actualizando]="cargando()"
  etiquetaActualizar="Actualizar histórico"
  (actualizar)="recargar()"
>
  <!-- Un único selector de jerarquía, igual que el resto del módulo y que
       Reportes: la pantalla necesita DOS nodos, pero son los dos primeros
       niveles de la MISMA ruta, no dos selecciones independientes. -->
  <div ventana-filtros class="flex items-center gap-3 flex-wrap">
    <app-hier-selector
      [paramsHier]="paramsHier"
      [raizFija]="raizFija"
      (rutaSeleccionada)="onRutaSeleccionada($event)"
    />
  </div>

  <div class="rounded-lg border border-[var(--mis-border)] overflow-hidden">
    <p-table [value]="filasFiltradas()" [scrollable]="true" scrollHeight="480px" [stripedRows]="true" [showGridlines]="true" styleClass="p-datatable-sm">
      <!-- El buscador filtra lo que ya está en la tabla, no la consulta: por eso
           vive en el caption y no en la franja de filtros de arriba. -->
      <ng-template pTemplate="caption">
        <div class="flex items-center gap-2">
          <p-iconfield iconPosition="left" styleClass="w-full sm:w-72">
            <p-inputicon styleClass="pi pi-search text-xs text-[var(--mis-text-tertiary)]" />
            <input
              pInputText
              type="text"
              placeholder="Buscar elemento por nombre…"
              class="w-full text-[13px]"
              aria-label="Buscar elemento en la tabla"
              [ngModel]="filtro()"
              (ngModelChange)="filtro.set($event)"
            />
          </p-iconfield>
          <span class="text-[11px] text-[var(--mis-text-tertiary)]">{{ filasFiltradas().length }} de {{ totalFilas() }}</span>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th rowspan="2" class="whitespace-nowrap text-[12px] uppercase" style="background-color: var(--mis-primary); color: var(--mis-text-on-primary);">
            Elemento
          </th>
          <th colspan="3" class="text-center text-[12px] uppercase" style="background-color: var(--mis-primary); color: var(--mis-text-on-primary);">
            Verificación
          </th>
        </tr>
        <tr>
          <th class="whitespace-nowrap text-[11px]" style="background-color: var(--mis-primary-light);">Estado</th>
          <th class="whitespace-nowrap text-[11px]" style="background-color: var(--mis-primary-light);">Usuario</th>
          <th class="whitespace-nowrap text-[11px]" style="background-color: var(--mis-primary-light);">Hora</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-fila>
        <tr>
          <td class="text-[13px]">{{ fila.des_rel }}</td>
          <td class="text-[13px]">
            <i [class]="estadoIcono(fila.cod_est).icono" [style.color]="estadoIcono(fila.cod_est).color" [title]="estadoIcono(fila.cod_est).titulo"></i>
          </td>
          <td class="text-[13px]">{{ fila.usu_log }}</td>
          <td class="text-[13px]">{{ fila.tim_log }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center text-[13px] text-[var(--mis-text-tertiary)] py-6">
            Elige un segundo nivel de la jerarquía para ver el histórico de verificaciones.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-window-panel>
