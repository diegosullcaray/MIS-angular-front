<app-window-panel
  titulo="Tablero de Verificación"
  [altoAuto]="true"
  [actualizando]="cargando()"
  etiquetaActualizar="Actualizar histórico"
  (actualizar)="recargar()"
>
  <button
    ventana-acciones
    type="button"
    class="mis-window-btn"
    (click)="mostrarFiltros.set(!mostrarFiltros())"
    [attr.aria-pressed]="mostrarFiltros()"
    [attr.aria-label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    [pTooltip]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    tooltipPosition="bottom"
  >
    <i [class]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'" class="text-[14px]"></i>
  </button>

  <!-- Dos selecciones sobre la MISMA jerarquía (línea + segundo nivel), por eso
       cada bloque va titulado: sin título se leen como un filtro repetido. -->
  <div class="flex items-start gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <app-hier-selector
      class="flex-1 min-w-[280px]"
      [paramsHier]="paramsHier"
      [raizFija]="raizFija"
      titulo="Elegir línea"
      (nodoSeleccionado)="onLineaSeleccionada($event)"
    />
    <app-hier-selector
      class="flex-1 min-w-[280px]"
      [paramsHier]="paramsHier"
      [raizFija]="raizFija"
      titulo="Elegir segundo nivel"
      (nodoSeleccionado)="onSegundoNivelSeleccionado($event)"
    />

    <!-- Mismo envoltorio que los selectores para que los tres bloques se lean
         como una sola franja de filtros. -->
    <div class="flex flex-col gap-1.5 p-2 bg-[var(--mis-panel-bg)]/60 border border-[var(--mis-border)] rounded-lg shadow-sm">
      <span class="text-[11px] font-semibold text-[var(--mis-text-primary)]">Buscar elemento</span>
      <input
        pInputText
        type="text"
        placeholder="Buscar por nombre…"
        class="text-[13px]"
        aria-label="Buscar elemento"
        [ngModel]="filtro()"
        (ngModelChange)="filtro.set($event)"
      />
    </div>
  </div>

  <div class="rounded-lg border border-[var(--mis-border)] overflow-hidden">
    <p-table [value]="filasFiltradas()" [scrollable]="true" scrollHeight="480px" [stripedRows]="true" [showGridlines]="true" styleClass="p-datatable-sm">
      <ng-template pTemplate="header">
        <tr>
          <th rowspan="2" class="whitespace-nowrap text-[12px] uppercase" style="background-color: var(--mis-primary); color: var(--mis-text-on-primary);">
            Elemento
          </th>
          <th colspan="3" class="text-center text-[12px] uppercase" style="background-color: var(--mis-primary); color: var(--mis-text-on-primary);">
            Verificación
          </th>
        </tr>
        <tr>
          <th class="whitespace-nowrap text-[11px]" style="background-color: var(--mis-primary-light);">Estado</th>
          <th class="whitespace-nowrap text-[11px]" style="background-color: var(--mis-primary-light);">Usuario</th>
          <th class="whitespace-nowrap text-[11px]" style="background-color: var(--mis-primary-light);">Hora</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-fila>
        <tr>
          <td class="text-[13px]">{{ fila.des_rel }}</td>
          <td class="text-[13px]">
            <i [class]="estadoIcono(fila.cod_est).icono" [style.color]="estadoIcono(fila.cod_est).color" [title]="estadoIcono(fila.cod_est).titulo"></i>
          </td>
          <td class="text-[13px]">{{ fila.usu_log }}</td>
          <td class="text-[13px]">{{ fila.tim_log }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center text-[13px] text-[var(--mis-text-tertiary)] py-6">
            Elige una línea y un segundo nivel para ver el histórico de verificaciones.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-window-panel>
