<div class="flex flex-col gap-6 w-full">
  <header class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-[10px] bg-[var(--mis-secondary-light)] text-[var(--mis-secondary)] flex items-center justify-center shrink-0">
      <ng-icon name="lucideBookOpen" size="20" />
    </div>
    <div>
      <h1 class="text-lg font-bold text-[var(--mis-text-primary)] m-0">Guías de uso</h1>
      <p class="text-sm text-[var(--mis-text-secondary)] m-0">Pasos rápidos para las tareas más comunes del MIS.</p>
    </div>
  </header>

  <section class="grid grid-cols-1 md:grid-cols-3 gap-5">
    @for (guia of guias; track guia.titulo) {
      <div class="bg-[var(--mis-surface)] border border-[var(--mis-border)] rounded-[10px] p-5 flex flex-col gap-4 shadow-sm">
        <div class="w-11 h-11 rounded-[10px] bg-[var(--mis-primary-light)] text-[var(--mis-primary)] flex items-center justify-center shrink-0">
          <ng-icon [name]="guia.icono" size="20" />
        </div>
        <div>
          <h3 class="text-base font-bold text-[var(--mis-text-primary)] m-0 mb-[2px]">{{ guia.titulo }}</h3>
          <p class="text-sm text-[var(--mis-text-secondary)] m-0 leading-normal">{{ guia.descripcion }}</p>
        </div>
      </div>
    }
  </section>
</div>
