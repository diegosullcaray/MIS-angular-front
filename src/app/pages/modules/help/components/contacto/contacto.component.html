<div class="flex flex-col gap-6 w-full">
  <header class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-[10px] bg-[var(--mis-warning-light)] text-[var(--mis-warning)] flex items-center justify-center shrink-0">
      <ng-icon name="lucideLifeBuoy" size="20" />
    </div>
    <div>
      <h1 class="text-lg font-bold text-[var(--mis-text-primary)] m-0">Contacto a soporte</h1>
      <p class="text-sm text-[var(--mis-text-secondary)] m-0">¿No encontraste lo que buscabas? Escríbenos.</p>
    </div>
  </header>

  <p-card styleClass="border border-[var(--mis-border)] rounded-[10px] shadow-sm">
    <div class="flex flex-col gap-4">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-[10px] bg-[var(--mis-primary-light)] text-[var(--mis-primary)] flex items-center justify-center shrink-0">
          <ng-icon name="lucideMail" size="18" />
        </div>
        <div class="flex flex-col">
          <span class="text-[11px] font-semibold text-[var(--mis-text-secondary)] uppercase tracking-[0.5px]">Correo</span>
          <a href="mailto:soporte@confianza.pe" class="text-sm font-semibold text-[var(--mis-primary)] no-underline hover:underline">soporte&#64;confianza.pe</a>
        </div>
      </div>

      <div class="h-[1px] bg-[var(--mis-border)]"></div>

      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-[10px] bg-[var(--mis-secondary-light)] text-[var(--mis-secondary)] flex items-center justify-center shrink-0">
          <ng-icon name="lucidePhone" size="18" />
        </div>
        <div class="flex flex-col">
          <span class="text-[11px] font-semibold text-[var(--mis-text-secondary)] uppercase tracking-[0.5px]">Mesa de ayuda</span>
          <span class="text-sm font-semibold text-[var(--mis-text-primary)]">(01) 500-0000, anexo 123</span>
        </div>
      </div>

      <div class="h-[1px] bg-[var(--mis-border)]"></div>

      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-[10px] bg-[var(--mis-success-light)] text-[var(--mis-success)] flex items-center justify-center shrink-0">
          <ng-icon name="lucideClock" size="18" />
        </div>
        <div class="flex flex-col">
          <span class="text-[11px] font-semibold text-[var(--mis-text-secondary)] uppercase tracking-[0.5px]">Horario de atención</span>
          <span class="text-sm font-semibold text-[var(--mis-text-primary)]">Lunes a viernes, 8:00 a.m. – 6:00 p.m.</span>
        </div>
      </div>
    </div>
  </p-card>
</div>
