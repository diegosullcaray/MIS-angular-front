<p-dialog
  [visible]="visible()"
  (visibleChange)="cerrar()"
  [modal]="true"
  [closable]="!obligatorio()"
  [style]="{ width: '92vw', maxWidth: '520px' }"
  [draggable]="false"
  [resizable]="false"
  header="Selecciona Nivel"
  appendTo="body"
>
  @if (vista() === 'menu') {
    <div class="flex flex-col gap-3 py-1">
      <button
        type="button"
        class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
        (click)="abrirAsesores()"
      >
        Asesores
      </button>
      @for (nivel of niveles; track nivel.tipCodListado) {
        <button
          type="button"
          class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
          (click)="abrirNivelJerarquia(nivel)"
        >
          {{ nivel.etiqueta }}
        </button>
      }
      <button
        type="button"
        class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
        (click)="elegirFinancieraConfianza(1)"
      >
        FC Individual
      </button>
      <button
        type="button"
        class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
        (click)="elegirFinancieraConfianza(2)"
      >
        FC Grupal
      </button>
    </div>
  } @else {
    <div class="flex flex-col gap-3 py-1">
      <div class="flex items-center gap-2">
        <p-button icon="pi pi-arrow-left" [outlined]="true" size="small" (onClick)="volverAlMenu()" />
        <p-iconfield iconPosition="left" class="flex-1">
          <p-inputicon class="pi pi-search text-[var(--mis-text-tertiary)]" />
          <input
            pInputText
            type="text"
            class="w-full"
            [placeholder]="vista() === 'asesores' ? 'Buscar asesor…' : 'Buscar…'"
            [ngModel]="filtro()"
            (ngModelChange)="filtro.set($event)"
          />
        </p-iconfield>
      </div>

      @if (vista() === 'asesores') {
        <p-table
          [value]="asesoresFiltrados()"
          [loading]="cargando()"
          [paginator]="true"
          [rows]="8"
          selectionMode="single"
          (onRowSelect)="elegirAsesor($event.data)"
          dataKey="cod_sec"
          styleClass="p-datatable-sm"
        >
          <ng-template pTemplate="header">
            <tr>
              <th class="text-[12px] uppercase" style="background-color: var(--mis-primary); color: var(--mis-text-on-primary);">Código</th>
              <th class="text-[12px] uppercase" style="background-color: var(--mis-primary); color: var(--mis-text-on-primary);">Asesor</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-item>
            <tr [pSelectableRow]="item" class="cursor-pointer text-[13px]">
              <td class="font-mono">{{ item.cod_sec }}</td>
              <td>{{ item.des_sec }}</td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="2" class="text-center text-[13px] text-[var(--mis-text-tertiary)] py-6">Sin asesores para mostrar.</td>
            </tr>
          </ng-template>
        </p-table>
      } @else {
        <p-table
          [value]="nodosFiltrados()"
          [loading]="cargando()"
          [paginator]="true"
          [rows]="8"
          selectionMode="single"
          (onRowSelect)="elegirNodo($event.data)"
          dataKey="cod_rel"
          styleClass="p-datatable-sm"
        >
          <ng-template pTemplate="header">
            <tr>
              <th class="text-[12px] uppercase" style="background-color: var(--mis-primary); color: var(--mis-text-on-primary);">
                {{ nivelJerarquiaActivo()?.etiqueta }}
              </th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-item>
            <tr [pSelectableRow]="item" class="cursor-pointer text-[13px]">
              <td>{{ item.des_rel }}</td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td class="text-center text-[13px] text-[var(--mis-text-tertiary)] py-6">Sin niveles para mostrar.</td>
            </tr>
          </ng-template>
        </p-table>
      }
    </div>
  }
</p-dialog>
