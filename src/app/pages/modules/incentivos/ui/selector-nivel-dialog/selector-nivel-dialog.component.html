<p-dialog
  [visible]="visible()"
  (visibleChange)="cerrar()"
  [modal]="true"
  [closable]="true"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  [style]="estiloDialogo()"
  [styleClass]="vista() === 'menu' ? 'mis-dialog--sin-pie' : ''"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
>
  <!-- `ariaLabelledBy` sale del contexto que da PrimeNG: es el id al que apunta
       el `aria-labelledby` del diálogo. Al poner cabecera propia hay que
       ponérselo al título, o el diálogo queda sin nombre accesible. -->
  <ng-template pTemplate="header" let-ariaLabelledBy="ariaLabelledBy">
    <div class="mis-window-lights mis-dialog-lights" role="group" aria-label="Controles del diálogo">
      <button
        type="button"
        class="mis-window-light mis-window-light--cerrar"
        data-glifo="✕"
        (click)="cerrar()"
        aria-label="Cerrar y volver al inicio"
        pTooltip="Cerrar"
        tooltipPosition="bottom"
      ></button>

      @if (vista() === 'menu') {
        <span class="mis-window-light mis-window-light--apagada" aria-hidden="true"></span>
      } @else {
        <button
          type="button"
          class="mis-window-light mis-window-light--volver"
          data-glifo="‹"
          (click)="volverAlMenu()"
          aria-label="Volver al menú de niveles"
          pTooltip="Volver"
          tooltipPosition="bottom"
        ></button>
      }

      <span class="mis-window-light mis-window-light--apagada" aria-hidden="true"></span>
    </div>

    <span [id]="ariaLabelledBy" class="p-dialog-title">Selecciona Nivel</span>
  </ng-template>

  @if (vista() === 'menu') {
    <div class="flex flex-col gap-3 py-1">
      <button
        type="button"
        class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
        (click)="abrirAsesores()"
      >
        Asesores
      </button>
      @for (nivel of niveles; track nivel.tipCodListado) {
        <button
          type="button"
          class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
          (click)="abrirNivelJerarquia(nivel)"
        >
          {{ nivel.etiqueta }}
        </button>
      }
      <button
        type="button"
        class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
        (click)="elegirFinancieraConfianza(1)"
      >
        FC Individual
      </button>
      <button
        type="button"
        class="w-full py-3 rounded-lg border border-[var(--mis-border)] bg-[var(--mis-primary-light)] text-[var(--mis-text-primary)] font-medium hover:opacity-80 transition-opacity"
        (click)="elegirFinancieraConfianza(2)"
      >
        FC Grupal
      </button>
    </div>
  } @else if (vista() === 'asesores') {
    <app-data-table
      [columns]="columnasAsesor"
      [data]="asesores()"
      [loading]="cargando()"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [searchFields]="camposBusquedaAsesor"
      searchPlaceholder="Buscar por asesor, unidad, corredor o territorio..."
      emptyMessage="Sin asesores para mostrar."
      [selectableRows]="true"
      [selectedRow]="seleccionadoAsesor()"
      (filaSeleccionada)="seleccionadoAsesor.set($event)"
    >
      <ng-template appDataTableCell="des_sec" let-row>
        <span class="font-medium text-[var(--mis-text-primary)]">{{ row.des_sec }}</span>
      </ng-template>
    </app-data-table>
  } @else {
    <app-data-table
      [columns]="columnasJerarquia()"
      [data]="nodos()"
      [loading]="cargando()"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [searchFields]="camposBusquedaJerarquia"
      searchPlaceholder="Buscar en el listado..."
      emptyMessage="Sin niveles para mostrar."
      [selectableRows]="true"
      [selectedRow]="seleccionadoNodo()"
      (filaSeleccionada)="seleccionadoNodo.set($event)"
    >
      <ng-template appDataTableCell="des_rel" let-row>
        <span class="font-medium text-[var(--mis-text-primary)]">{{ row.des_rel }}</span>
      </ng-template>
    </app-data-table>
  }

  <ng-template pTemplate="footer">
    @if (vista() !== 'menu') {
      <p-button label="Seleccionar" size="small" [disabled]="!haySeleccion()" (onClick)="confirmarSeleccion()" />
    }
  </ng-template>
</p-dialog>
