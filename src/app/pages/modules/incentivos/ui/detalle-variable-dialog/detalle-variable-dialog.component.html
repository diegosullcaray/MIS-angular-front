<p-dialog
  [visible]="visible()"
  (visibleChange)="cerrar()"
  [modal]="true"
  [style]="{ width: '95vw', maxWidth: '640px' }"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-2.5">
      <i [class]="icono() + ' text-[18px] text-white'"></i>
      <span class="font-bold text-[15px] text-white tracking-wide">{{ titulo() }}</span>
    </div>
  </ng-template>

  <app-detalle-variable-content [activo]="visible()" [req]="req()" [codVar]="codVar()" [mostrarTarjetas]="mostrarTarjetas()" />
</p-dialog>
