<p-dialog
  [visible]="visible()"
  (visibleChange)="cerrar()"
  [modal]="true"
  [style]="{ width: '95vw', maxWidth: '640px' }"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-2 min-w-0">
      <i [class]="icono() + ' text-[13px] text-[var(--mis-text-secondary)]'"></i>
      <span class="text-[13px] font-semibold text-[var(--mis-text-primary)] truncate">{{ titulo() }}</span>
    </div>
  </ng-template>

  <app-detalle-variable-content [activo]="visible()" [req]="req()" [codVar]="codVar()" [mostrarTarjetas]="mostrarTarjetas()" />
</p-dialog>
