@if (!incentivos.cargando()) {
  <div class="avances">
    @for (item of incentivos.avances(); track item.id) {
      @if (item.show) {
        <button
          type="button"
          data-qa="avance"
          class="avance"
          [class.avance--activo]="item.enab"
          [disabled]="!item.enab"
          [attr.aria-label]="item.des + ': ' + (item.val * 100 | number: '.0-1') + '% de avance'"
          (click)="onClic(item)"
        >
          <!-- Anillo de avance: el arco se pinta con un `conic-gradient` —no con
               un SVG— para que los tokens de color resuelvan en ambos temas. -->
          <div class="avance-medidor" aria-hidden="true">
            <div class="avance-anillo" [style.background]="fondoAnillo(item)"></div>
            <span class="avance-valor">{{ item.val * 100 | number: '.0-1' }}<small>%</small></span>
          </div>
          <span class="avance-etiqueta" aria-hidden="true">
            <i [class]="item.icono"></i>
            {{ item.des }}
          </span>
        </button>
      }
    }
  </div>
}
