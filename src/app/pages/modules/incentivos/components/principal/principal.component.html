<!-- El "Actualizar" del encabezado es ahora el botón de la esquina; como antes,
     no está disponible mientras no hay perfil cargado. -->
<app-window-panel
  titulo="Cuadro de Mando de Incentivos"
  [actualizando]="incentivos.cargando()"
  [permitirActualizar]="incentivos.perfil() !== null"
  etiquetaActualizar="Actualizar cuadro de mando"
  (actualizar)="actualizar()"
>
  <!-- Va acá, en la barra de la ventana, y no dentro de `<app-perfil-card>`:
       esa tarjeta solo existe cuando ya hay un nivel cargado, así que un
       administrador que cerraba el diálogo de entrada se quedaba sin ninguna
       forma de volver a abrirlo (INC-2026-09-08-08). -->
  @if (incentivos.puedeElegirNivel()) {
    <button
      ventana-acciones
      type="button"
      class="mis-window-btn"
      (click)="abrirSelector()"
      aria-label="Seleccionar nivel"
      pTooltip="Seleccionar nivel"
      tooltipPosition="bottom"
    >
      <i class="pi pi-sitemap text-[14px]"></i>
    </button>
  }

  @if (incentivos.error(); as detalleError) {
    <app-inline-error [detalle]="detalleError" (reintentar)="incentivos.reintentar()" />
  } @else if (incentivos.cargando()) {
    <div class="inc-tablero animate-pulse" aria-hidden="true">
      <div class="inc-columna">
        <div class="inc-panel"><p-skeleton height="170px" styleClass="rounded-xl" /></div>
        <div class="inc-panel"><p-skeleton height="360px" styleClass="rounded-xl" /></div>
      </div>
      <div class="inc-columna">
        <div class="inc-panel"><p-skeleton height="300px" styleClass="rounded-xl" /></div>
        <div class="inc-panel"><p-skeleton height="200px" styleClass="rounded-xl" /></div>
      </div>
    </div>
  } @else if (incentivos.perfil()) {
    <div class="inc-tablero inc-tablero--entrada">
      <!-- Columna principal: quién es, cuánto lleva y el detalle del mes. -->
      <div class="inc-columna">
        <section class="inc-panel" aria-label="Perfil y monetizado">
          <app-perfil-card (abrirCalculadora)="abrirCalculadora()" />
        </section>

        <section class="inc-panel" aria-label="Variables del mes">
          <app-tabla-variables (abrirDetalle)="abrirDetalleTabla($event)" />
        </section>
      </div>

      <!-- Columna lateral: avance contra la meta y bonos adicionales. -->
      <div class="inc-columna">
        <section class="inc-panel" aria-label="Avance de metas">
          <app-avances-grid (abrirDetalle)="abrirDetalleAvance($event)" />
        </section>

        <section class="inc-panel" aria-label="Bonos Super Plus">
          <app-super-plus-grid (abrirDetalle)="abrirDetalleSuperPlus($event)" />
        </section>
      </div>
    </div>
  }
</app-window-panel>

<app-selector-nivel-dialog [visible]="mostrarSelector()" (visibleChange)="mostrarSelector.set($event)" />

<app-calculadora-dialog [visible]="mostrarCalculadora()" (visibleChange)="mostrarCalculadora.set($event)" />

@if (detalleActivo(); as detalle) {
  <app-detalle-variable-dialog
    [visible]="mostrarDetalleVariable()"
    (visibleChange)="mostrarDetalleVariable.set($event)"
    [titulo]="detalle.titulo"
    [icono]="detalle.icono"
    [req]="detalle.req"
    [codVar]="detalle.codVar"
    [mostrarTarjetas]="detalle.card"
  />
}

<app-detalle-bancarizacion-dialog [visible]="mostrarDetalleBancarizacion()" (visibleChange)="mostrarDetalleBancarizacion.set($event)" />
