<!-- El "Actualizar" del encabezado es ahora el botón de la esquina; como antes,
     no está disponible mientras no hay perfil cargado. -->
<app-window-panel
  titulo="Cuadro de Mando de Incentivos"
  [actualizando]="incentivos.cargando()"
  [permitirActualizar]="incentivos.perfil() !== null"
  etiquetaActualizar="Actualizar cuadro de mando"
  (actualizar)="actualizar()"
>

  @if (incentivos.error()) {
    <div class="mis-card p-4 text-[13px] text-[var(--mis-danger)] flex items-center gap-2">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ incentivos.error() }}</span>
    </div>
  }

  @if (incentivos.cargando() && !incentivos.perfil()) {
    <div class="flex flex-col lg:flex-row gap-5 lg:gap-6 animate-pulse">
      <div class="flex flex-col gap-5 lg:gap-6 w-full lg:w-2/3">
        <p-skeleton height="160px" styleClass="rounded-xl" />
        <p-skeleton height="400px" styleClass="rounded-xl" />
      </div>
      <div class="flex flex-col gap-5 lg:gap-6 w-full lg:w-1/3">
        <p-skeleton height="200px" styleClass="rounded-xl" />
        <p-skeleton height="360px" styleClass="rounded-xl" />
      </div>
    </div>
  } @else if (incentivos.perfil()) {
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 sm:gap-5 lg:gap-6 items-stretch" pAnimateOnScroll enterClass="animate-fadein animate-duration-500">
      <!-- Columna Principal (2/3) -->
      <div class="lg:col-span-8 flex flex-col gap-3 sm:gap-5 lg:gap-6 min-h-0">
        <div class="mis-card p-3 sm:p-5 shadow-sm hover:shadow-md transition-shadow duration-300">
          <app-perfil-card (abrirSelector)="abrirSelector()" (abrirCalculadora)="abrirCalculadora()" />
        </div>
        <div class="mis-card p-3 sm:p-5 flex-1 min-h-0 lg:min-h-[400px] shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden">
          <app-tabla-variables (abrirDetalle)="abrirDetalleTabla($event)" />
        </div>
      </div>

      <!-- Columna Lateral (1/3) -->
      <div class="lg:col-span-4 flex flex-col gap-3 sm:gap-5 lg:gap-6 min-h-0">
        <div class="mis-card p-3 sm:p-5 shadow-sm hover:shadow-md transition-shadow duration-300">
          <app-avances-grid (abrirDetalle)="abrirDetalleAvance($event)" />
        </div>
        <div class="mis-card p-3 sm:p-5 shadow-sm hover:shadow-md transition-shadow duration-300">
          <app-super-plus-grid (abrirDetalle)="abrirDetalleSuperPlus($event)" />
        </div>
      </div>
    </div>
  }
</app-window-panel>

<app-selector-nivel-dialog [visible]="mostrarSelector()" (visibleChange)="mostrarSelector.set($event)" />

<app-calculadora-dialog [visible]="mostrarCalculadora()" (visibleChange)="mostrarCalculadora.set($event)" />

@if (detalleActivo(); as detalle) {
  <app-detalle-variable-dialog
    [visible]="mostrarDetalleVariable()"
    (visibleChange)="mostrarDetalleVariable.set($event)"
    [titulo]="detalle.titulo"
    [icono]="detalle.icono"
    [req]="detalle.req"
    [codVar]="detalle.codVar"
    [mostrarTarjetas]="detalle.card"
  />
}

<app-detalle-bancarizacion-dialog [visible]="mostrarDetalleBancarizacion()" (visibleChange)="mostrarDetalleBancarizacion.set($event)" />
