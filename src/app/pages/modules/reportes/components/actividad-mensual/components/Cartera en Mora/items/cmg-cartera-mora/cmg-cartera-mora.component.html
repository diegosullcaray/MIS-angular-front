<app-reporte-simple
  titulo="CMG Cartera en Mora"
  [paramsHier]="paramsHier"
  [nivel]="nivelActual()"
  [tabla]="tabla()"
  [cargando]="cargando()"
  (nivelSeleccionado)="onNivelSeleccionado($event)"
  (errorJerarquia)="onErrorJerarquia()"
>
  <div filtros>
    <app-select-filtro
      etiqueta="Fecha Cierre"
      [opciones]="opcionesFechaBase"
      [valor]="fechaBase()"
      (valorChange)="fechaBase.set($event)"
    />
  </div>

  <div nota class="text-xs text-[var(--mis-text-secondary)] space-y-1 mt-2">
    <p class="m-0 font-medium">A partir del día 15 calendario se comparan días hábiles faltantes para el cierre.</p>
    <p class="m-0"><b class="font-semibold text-[var(--mis-text-primary)]">TMM - Tasa Mensual Móvil</b> → Var. fecha actual vs. mismo día del mes anterior.</p>
    <p class="m-0"><b class="font-semibold text-[var(--mis-text-primary)]">TAM - Tasa Anual Móvil</b> → Var. fecha actual vs. mismo día del año anterior.</p>
    <p class="m-0 font-medium">El gasto de provisión no incluye provisiones voluntarias.</p>
  </div>
</app-reporte-simple>
