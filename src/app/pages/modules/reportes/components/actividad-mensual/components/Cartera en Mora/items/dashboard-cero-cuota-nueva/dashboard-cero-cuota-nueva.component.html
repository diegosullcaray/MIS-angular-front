<app-window-panel titulo="Dashboard Cero Cuota Nueva" subtitulo="Información mensual" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <!-- Selector de Jerarquía -->
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />

    <!-- Filtro de Fecha -->
    <div class="flex flex-col sm:flex-row sm:items-end gap-3 flex-wrap">
      <app-select-filtro
        etiqueta="Fecha Cierre"
        [opciones]="opcionesFechaBase"
        [valor]="fechaBase()"
        (valorChange)="fechaBase.set($event)"
      />
    </div>
  </div>

  @if (cargando()) {
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 w-full">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="mis-card p-4 min-h-[420px] animate-pulse bg-gray-100 dark:bg-gray-800 rounded-2xl flex flex-col justify-between">
          <div class="h-5 w-48 bg-gray-200 dark:bg-gray-700 rounded mb-4"></div>
          <div class="flex-1 bg-gray-200/50 dark:bg-gray-700/50 rounded-xl"></div>
        </div>
      }
    </div>
  } @else if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver los gráficos del dashboard."
    />
  } @else {
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 w-full">
      @for (grafico of graficos(); track grafico.titulo) {
        <div class="mis-card p-3 sm:p-4 min-h-[420px] flex flex-col justify-center">
          <app-grafico-mixto [datos]="grafico" tipo="linea" />
        </div>
      }
    </div>
  }
</app-window-panel>
