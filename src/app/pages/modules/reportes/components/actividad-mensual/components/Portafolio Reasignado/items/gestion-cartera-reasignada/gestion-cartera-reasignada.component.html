<app-window-panel [titulo]="titulo()" subtitulo="Cartera en Mora" [permitirActualizar]="false" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
    <!-- "Mostrar por" y "Fecha Cierre" lado a lado, no apilados. -->
    <app-grupo-filtros>
      <app-select-filtro etiqueta="Mostrar por" [opciones]="opcionesMostrarPor" [valor]="mostrarPor()" (valorChange)="onMostrarPor($event)" ancho="w-40" />
      <app-select-filtro etiqueta="Fecha Cierre" [opciones]="opcionesFechaBase" [valor]="fechaBase()" (valorChange)="onFechaBase($event)" />
    </app-grupo-filtros>
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    <!-- Las dos pestañas de `cra-v11`. -->
    <p-tabs value="resumen">
      <p-tablist>
        <p-tab value="resumen" class="!py-2 !px-3">Resumen</p-tab>
        <p-tab value="detalle" class="!py-2 !px-3">Detalle</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="resumen">
          <div class="mis-card p-3 overflow-x-auto">
            <app-tabla-reporte [encabezados]="resumen().headers" [filas]="resumen().body" [cargando]="cargandoResumen()" />
          </div>
          <p class="text-[12px] text-[var(--mis-text-tertiary)] mt-2 mb-0 leading-relaxed" [innerHTML]="nota"></p>
        </p-tabpanel>

        <p-tabpanel value="detalle">
          <!-- El paginador va dentro de la tarjeta de la tabla, pegado a su pie. -->
          <div class="mis-card p-3 overflow-x-auto">
            <app-tabla-reporte [encabezados]="detalle().headers" [filas]="detalle().body" [cargando]="cargandoDetalle()" [encabezadoUniforme]="true" />
            @if (totalDetalle() > porPagina) {
              <p-paginator
                class="border-t border-[var(--mis-border)] mt-2 pt-1"
                [first]="(pagina() - 1) * porPagina"
                [rows]="porPagina"
                [totalRecords]="totalDetalle()"
                [showFirstLastIcon]="true"
                (onPageChange)="onPagina($event)"
                styleClass="text-[12px] !bg-transparent"
              />
            }
          </div>
          <p class="text-[12px] text-[var(--mis-text-tertiary)] mt-2 mb-0 leading-relaxed" [innerHTML]="nota"></p>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</app-window-panel>
