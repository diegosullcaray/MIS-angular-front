<app-reporte-simple [filtrosSoloMovil]="true" [ajustarAncho]="true"
  titulo="Contratación Electrónica"
  [paramsHier]="paramsHier"
  [nivel]="nivelActual()"
  [bloques]="bloques()"
  [cargando]="cargando()"
  (nivelSeleccionado)="onNivelSeleccionado($event)"
  (errorJerarquia)="onErrorJerarquia()"
>
  <!-- Fecha de cierre: botón de calendario en la barra (escritorio); en pantallas angostas queda el selector. -->
  <app-fecha-cierre-boton acciones etiqueta="Fecha Cierre" [opciones]="opcionesFechaBase" [(valor)]="fechaBase" />
  <div filtros>
    <div class="lg:hidden">
      <app-select-filtro etiqueta="Fecha Cierre" [opciones]="opcionesFechaBase" [valor]="fechaBase()" (valorChange)="fechaBase.set($event)" />
    </div>
  </div>
</app-reporte-simple>
