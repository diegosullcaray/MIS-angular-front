<app-reporte-simple
  titulo="Desempeño Social"
  [paramsHier]="paramsHier"
  [nivel]="nivelActual()"
  [tabla]="tabla()"
  [cargando]="cargando()"
  (nivelSeleccionado)="onNivelSeleccionado($event)"
  (errorJerarquia)="onErrorJerarquia()"
>
  <div filtros>
    <app-select-filtro
      etiqueta="Fecha Cierre"
      [opciones]="opcionesFechaBase"
      [valor]="fechaBase()"
      (valorChange)="fechaBase.set($event)"
    />
  </div>

  <div nota class="text-xs text-[var(--mis-text-secondary)] space-y-1 mt-2">
    <p class="m-0 font-medium">Los datos de Bancarización se compara con el último RCC disponible a la fecha.</p>
  </div>
</app-reporte-simple>
