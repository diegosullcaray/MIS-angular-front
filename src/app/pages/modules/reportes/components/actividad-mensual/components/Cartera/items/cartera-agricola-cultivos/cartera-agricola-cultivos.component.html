<app-window-panel titulo="Cartera Agrícola - Cultivos" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
    @if (periodos().length > 0) {
      <div class="flex flex-col sm:flex-row sm:items-end gap-3 flex-wrap">
        <app-select-filtro
          etiqueta="Fecha Cierre"
          [opciones]="periodos()"
          [valor]="periodo()"
          (valorChange)="periodo.set($event)"
        />
      </div>
    }
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <div class="flex flex-col gap-4">
      @if (totales().length > 0) {
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          @for (total of totales(); track total.etiqueta) {
            <div class="mis-card p-3 flex flex-col gap-1">
              <span class="text-[12px] text-[var(--mis-text-secondary)] font-medium">{{ total.etiqueta }}</span>
              <span class="text-[18px] font-bold text-[var(--mis-text-primary)]">
                {{ formatear(total.actual, total.formato) }}
              </span>
              <span class="text-[11px] text-[var(--mis-text-tertiary)]">
                Mes anterior: {{ formatear(total.anterior, total.formato) }}
              </span>
            </div>
          }
        </section>
      }

      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-dinamica [columnas]="tabla().columnas" [filas]="tabla().filas" [cargando]="cargando()" />
      </div>
    </div>
  }
</app-window-panel>
