<app-window-panel
  titulo="PYG FC · Estado de ganancias y pérdidas"
  subtitulo="Cuenta de Resultados"
  [permitirActualizar]="!!nivelActual()" [actualizando]="cargando()" (actualizar)="refrescar()"
  [conFiltros]="true"
>
  @if (periodos().length > 0) {
    <app-fecha-cierre-boton ventana-acciones etiqueta="Período" [opciones]="periodos()" [valor]="periodo()" (valorChange)="onPeriodoChange($event)" />
  }

  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (rutaSeleccionada)="ruta.set($event)"
      (error)="onErrorJerarquia()"
    />
    @if (periodos().length > 0) {
      <app-grupo-filtros class="lg:hidden">
        <app-select-filtro
          etiqueta="Período"
          [opciones]="periodos()"
          [valor]="periodo()"
          (valorChange)="onPeriodoChange($event)"
        />
      </app-grupo-filtros>
    }
  </div>

  @if (errorJerarquia()) {
    <app-inline-error titulo="No se pudo cargar la jerarquía." (reintentar)="reintentarJerarquia()" />
  } @else if (error(); as detalle) {
    <app-inline-error [detalle]="detalle" (reintentar)="reintentar()" />
  } @else if (cargando()) {
    <app-list-skeleton />
  } @else if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else if (resultado(); as reporte) {
    @if (reporte.filas.length === 0) {
      <app-empty-state descripcion="No se encontraron resultados para los filtros seleccionados." />
    } @else {
      <div class="flex flex-col gap-2 w-full">
        <app-ruta-jerarquica [ruta]="ruta()" etiqueta="Ruta de la cuenta de resultados" (irANivel)="volverANivel($event)" />
        <div class="mis-card p-3 overflow-x-auto w-full">
          <app-tabla-dinamica [ajustarAncho]="true" [llenarAlto]="true"
            [columnas]="columnas()"
            [filas]="filas()"
            [cargando]="cargando()"
            [columnasClicables]="columnasDrillDown"
            [filaClicable]="conDetalle"
            [desplegada]="desplegada"
            (celdaSeleccionada)="onCeldaSeleccionada($event)"
            [destacarFila]="sinDestacar"
          />
        </div>
      </div>
    }
  }
</app-window-panel>
