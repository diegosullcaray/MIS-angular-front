<app-window-panel titulo="Cosechas" subtitulo="Cartera en Mora" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
    <app-grupo-filtros>
      <app-select-filtro etiqueta="Producto" [opciones]="opcionesProducto" [(valor)]="producto" />
      <app-select-filtro etiqueta="Sub Producto" [opciones]="opcionesSubproducto" [(valor)]="subproducto" />
      <app-select-filtro etiqueta="Maduración" [opciones]="opcionesMaduracion" [(valor)]="maduracion" />
      <app-select-filtro etiqueta="Tipo" [opciones]="opcionesTipo" [(valor)]="tipo" />
    </app-grupo-filtros>
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el gráfico de cosechas." />
  } @else if (cargando()) {
    <div class="mis-card p-3 sm:p-4 h-[440px] flex flex-col">
      <app-esqueleto-grafico etiqueta="Cargando gráfico de cosechas" />
    </div>
  } @else if (graficos().length === 0) {
    <app-empty-state titulo="Sin datos" descripcion="No hay cosechas para el nivel y los filtros elegidos." />
  } @else {
    <div class="flex flex-col gap-4 w-full">
      @for (grafico of graficos(); track grafico.titulo) {
        <div class="mis-card p-3 sm:p-4 h-[440px] flex flex-col">
          <app-grafico-mixto [datos]="grafico" tipo="linea" formato="numero" />
        </div>
      }
    </div>
  }
</app-window-panel>
