<app-window-panel
  [conFiltros]="true"
  titulo="Monitor Productos Misionales"
  [subtitulo]="kpiOperaciones()?.fecha ? 'Actualizado al ' + kpiOperaciones()?.fecha + ' ' + kpiOperaciones()?.hora : ''"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Productos</span>
      <p-select
        [options]="opcionesProducto"
        optionLabel="desc"
        optionValue="id"
        [ngModel]="productoSeleccionado()"
        (ngModelChange)="onProductoSeleccionado($event)"
        styleClass="w-56 text-[11.5px]"
        ariaLabel="Productos"
      />
    </div>
  </div>

  <!-- Tarjeta KPI -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div class="mis-card p-3 flex items-center justify-between border-l-4 border-l-[var(--mis-primary)] bg-[var(--mis-panel-bg)]/80">
      <div class="flex flex-col gap-0.5 min-w-0">
        <span class="text-[12px] font-bold text-[var(--mis-text-primary)]">Operaciones Desembolsadas</span>
        <span class="text-[11px] font-medium text-[var(--mis-text-secondary)]">Cumplimiento de Meta:</span>
      </div>
      <span class="text-xl font-extrabold text-[var(--mis-primary-text)] shrink-0 ml-2">
        {{ kpiOperaciones()?.cumpl_des_acum || '--' }}
      </span>
    </div>
  </div>

  <!-- Tabla diaria (bloque _01 del legado) -->
  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tablaDetalle().headers" [filas]="tablaDetalle().body" [cargando]="false" />
  </div>

  <!-- Tabla resumen (bloque _02 del legado) -->
  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tablaSimple().headers" [filas]="tablaSimple().body" [cargando]="false" />
  </div>
</app-window-panel>
