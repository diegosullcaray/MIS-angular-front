<app-window-panel
  [conFiltros]="true"
  titulo="Poblaciones Misionales"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Población</span>
      <p-select
        [options]="opcionesPoblacion"
        optionLabel="desc"
        optionValue="id"
        [ngModel]="poblacionSeleccionada()"
        (ngModelChange)="onPoblacionSeleccionada($event)"
        styleClass="w-56 text-[11.5px]"
        ariaLabel="Población"
      />
    </div>
  </div>

  <p-tabs [(value)]="tabActiva">
    <p-tablist>
      <p-tab value="territorio">Territorio</p-tab>
      <p-tab value="corredores">Corredores</p-tab>
      <p-tab value="unidad">Unidad</p-tab>
      <p-tab value="asesores">Asesores</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="territorio">
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-dinamica [columnas]="territorio().columnas" [filas]="territorio().filas" [cargando]="cargando()" />
        </div>
      </p-tabpanel>
      <p-tabpanel value="corredores">
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-dinamica [columnas]="corredores().columnas" [filas]="corredores().filas" [cargando]="cargando()" />
        </div>
      </p-tabpanel>
      <p-tabpanel value="unidad">
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-dinamica [columnas]="unidad().columnas" [filas]="unidad().filas" [cargando]="cargando()" />
        </div>
      </p-tabpanel>
      <p-tabpanel value="asesores">
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-dinamica [columnas]="asesores().columnas" [filas]="asesores().filas" [cargando]="cargando()" />
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</app-window-panel>
