<app-window-panel
  titulo="Desempeño Social"
  [permitirActualizar]="false"
>
  <button
    ventana-acciones
    type="button"
    class="mis-window-btn"
    (click)="mostrarFiltros.set(!mostrarFiltros())"
    [attr.aria-pressed]="mostrarFiltros()"
    [attr.aria-label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    [pTooltip]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    tooltipPosition="bottom"
  >
    <i [class]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'" class="text-[14px]"></i>
  </button>
  <div class="flex items-center gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
  </div>

  <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">
    Los datos de Bancarización se comparan con el último RCC disponible a la fecha.
  </p>

  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tabla().headers" [filas]="tabla().body" [cargando]="false" />
  </div>
</app-window-panel>
