<app-window-panel
  [conFiltros]="true" [filtrosAbiertos]="true"
  titulo="Desempeño Social"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex items-center gap-3 flex-wrap">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
  </div>

  <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">
    Los datos de Bancarización se comparan con el último RCC disponible a la fecha.
  </p>

  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tabla().headers" [filas]="tabla().body" [cargando]="false" />
  </div>
</app-window-panel>
