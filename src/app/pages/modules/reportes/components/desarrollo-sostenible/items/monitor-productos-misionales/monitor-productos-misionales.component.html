<app-window-panel
  [conFiltros]="true" [filtrosAbiertos]="true"
  titulo="Monitor Productos Misionales"
  [subtitulo]="kpiOperaciones()?.fecha ? 'Actualizado al ' + kpiOperaciones()?.fecha + ' ' + kpiOperaciones()?.hora : ''"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />

    <app-grupo-filtros>
      <app-select-filtro etiqueta="Productos" [opciones]="opcionesProducto" [valor]="productoSeleccionado()" (valorChange)="onProductoSeleccionado($event)" ancho="w-56" />
    </app-grupo-filtros>
  </div>

  <!-- Tarjeta KPI — Liquid Glass -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
    <div class="kpi-card p-4 sm:p-5 rounded-2xl flex flex-col justify-between gap-3">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-[var(--mis-text-tertiary)]">Operaciones Desembolsadas</span>
        <span class="shrink-0 w-9 h-9 rounded-xl grid place-items-center bg-[var(--mis-primary-light)] text-[var(--mis-primary-text)]">
          <i class="pi pi-credit-card text-base" aria-hidden="true"></i>
        </span>
      </div>
      <div class="flex flex-col gap-0.5">
        <span class="text-[11px] font-medium text-[var(--mis-text-secondary)]">Cumplimiento de Meta</span>
        <span class="text-[26px] sm:text-[30px] font-extrabold tracking-tight text-[var(--mis-primary-text)] leading-tight tabular-nums">
          {{ kpiOperaciones()?.cumpl_des_acum || '--' }}
        </span>
      </div>
    </div>
  </div>

  <!-- Tabla diaria (bloque _01 del legado) -->
  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tablaDetalle().headers" [filas]="tablaDetalle().body" [cargando]="false" />
  </div>

  <!-- Tabla resumen (bloque _02 del legado) -->
  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tablaSimple().headers" [filas]="tablaSimple().body" [cargando]="false" />
  </div>
</app-window-panel>
