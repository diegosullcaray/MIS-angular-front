<app-window-panel
  titulo="Monitor Efectividades"
  subtitulo="Cartera en Mora"
  [permitirActualizar]="false"
  [conFiltros]="true"
>
  <app-hier-selector
    ventana-filtros
    [paramsHier]="paramsHier"
    placeholder="Elegir nivel"
    (nodoSeleccionado)="onNivelSeleccionado($event)"
    (error)="onErrorJerarquia()"
  />

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <!-- Las dos pestañas del legado: el resumen y el detalle filtrable. -->
    <p-tabs value="monitor">
      <p-tablist>
        <p-tab value="monitor" class="!py-2 !px-3">Monitor de Efectividades</p-tab>
        <p-tab value="detalle" class="!py-2 !px-3">Detalle de Efectividades</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="monitor">
          <div class="flex flex-col gap-5">
            @for (bloque of bloquesResumen; track bloque.titulo; let i = $index) {
              <section class="flex flex-col gap-2">
                <h2 class="text-[13px] font-semibold text-[var(--mis-text-primary)] m-0">{{ bloque.titulo }}</h2>
                <div class="mis-card p-3 overflow-x-auto">
                  <app-tabla-reporte
                    [encabezados]="tablasResumen()[i]?.headers ?? []"
                    [filas]="tablasResumen()[i]?.body ?? []"
                    [cargando]="cargandoResumen()"
                  />
                </div>
                @if (bloque.nota) {
                  <p class="text-[12px] text-[var(--mis-text-tertiary)] m-0 leading-relaxed" [innerHTML]="bloque.nota"></p>
                }
              </section>
            }
          </div>
        </p-tabpanel>

        <p-tabpanel value="detalle">
          <!--
            `<app-detalle-reasignado>` ya trae los tres filtros comunes del host
            (Última Gestión, Fecha Compromiso y Asesor), la tabla y el paginador.
            Los siete propios del bloque `_02` se proyectan en su slot.
          -->
          <app-detalle-reasignado
            [tabla]="tablaDetalle()"
            [cargando]="cargandoDetalle()"
            [total]="total()"
            [opcionesUltimaGestion]="opcionesUltimaGestion()"
            [(asesor)]="asesor"
            [(fechaCompromiso)]="fechaCompromiso"
            [(ultimaGestion)]="ultimaGestion"
            [(pagina)]="pagina"
            (buscarAsesor)="onBuscarAsesor()"
          >
            <div filtros class="flex flex-wrap gap-3">
              <app-select-filtro etiqueta="Tramo" [opciones]="opcionesTramo" [(valor)]="tramo" />
              <app-select-filtro etiqueta="Producto" [opciones]="opcionesProducto" [(valor)]="producto" ancho="w-64" />
              <app-select-filtro
                etiqueta="Compromiso Roto"
                [opciones]="opcionesSiNo"
                [(valor)]="compromisoRoto"
                ancho="w-32"
              />
              <app-select-filtro etiqueta="0 Cuota" [opciones]="opcionesSiNo" [(valor)]="ceroCuota" ancho="w-32" />
              <app-select-filtro etiqueta="1 Cuota" [opciones]="opcionesSiNo" [(valor)]="unaCuota" ancho="w-32" />
              <app-select-filtro
                etiqueta="Tramo Días Gestión"
                [opciones]="opcionesTramoDias"
                [(valor)]="tramoDias"
                ancho="w-52"
              />
              <app-select-filtro
                etiqueta="Precosecha"
                [opciones]="opcionesPrecosecha"
                [(valor)]="precosecha"
                ancho="w-36"
              />
            </div>
          </app-detalle-reasignado>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</app-window-panel>
