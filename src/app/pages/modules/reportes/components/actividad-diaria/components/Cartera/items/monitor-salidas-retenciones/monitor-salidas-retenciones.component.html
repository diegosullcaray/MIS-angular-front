<app-window-panel
  titulo="Monitor de Salidas y Retenciones por Nivel de Riesgo"
  subtitulo="Cartera"
  [permitirActualizar]="false"
  [conFiltros]="true"
>
  <app-hier-selector
    ventana-filtros
    [paramsHier]="paramsHier"
    placeholder="Elegir nivel"
    (nodoSeleccionado)="onNivelSeleccionado($event)"
    (error)="onErrorJerarquia()"
  />

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    <div class="grid gap-3 grid-cols-2 lg:grid-cols-4 xl:grid-cols-5">
      @for (t of tarjetas(); track $index; let i = $index) {
        <button
          type="button"
          class="kpi-card p-3.5 sm:p-4 rounded-xl sm:rounded-2xl flex flex-col gap-1 text-left"
          [class.cursor-pointer]="tarjetaAbreDetalle(i)"
          [class.cursor-default]="!tarjetaAbreDetalle(i)"
          [disabled]="!tarjetaAbreDetalle(i)"
          (click)="onTarjeta(i)"
        >
          <span class="text-[11px] sm:text-[12px] font-bold uppercase tracking-wider text-[var(--mis-text-tertiary)]">{{ t.lbl }}</span>

          <div class="flex items-center gap-2">
            @if (t.tl != null && t.tl !== -99) {
              <span
                class="inline-block w-3 h-3 rounded-full shrink-0"
                [class.bg-emerald-500]="t.tl === 1"
                [class.bg-amber-500]="t.tl === 0"
                [class.bg-red-500]="t.tl === -1"
              ></span>
            } @else if (t.typ === 'percent') {
              <span
                class="inline-block w-3 h-3 rounded-full shrink-0"
                [class.bg-emerald-500]="t.val >= 0.95"
                [class.bg-amber-500]="t.val >= 0.9025 && t.val < 0.95"
                [class.bg-red-500]="t.val < 0.9025"
              ></span>
            }
            <span class="text-[20px] sm:text-[24px] font-extrabold tracking-tight text-[var(--mis-text-primary)] leading-tight" [class.underline]="tarjetaAbreDetalle(i)">
              @if (t.typ === 'percent') {
                {{ t.val * 100 | number: '1.0-2' }}%
              } @else {
                {{ t.val | number: '1.0-0' }}
              }
            </span>
          </div>

          @if (t.val2 != null) {
            <span class="text-[11px]">
              <span class="text-[var(--mis-text-tertiary)]">{{ t.lbl2 }}:</span>
              <!-- Al revés que en Monitor IMR: acá caer es malo. -->
              <span
                class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full align-middle"
                [class.trend-badge-positive]="t.val2 >= 0"
                [class.trend-badge-negative]="t.val2 < 0"
              >
                @if (t.typ === 'percent') {
                  {{ t.val2 * 100 | number: '1.0-2' }}%
                } @else {
                  {{ t.val2 | number: '1.0-0' }}
                }
              </span>
            </span>
          }
        </button>
      }
    </div>

    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-dinamica
        [columnas]="columnas"
        [filas]="filas()"
        [cargando]="cargando()"
        [seleccionable]="true"
        (filaSeleccionada)="onFila($event)"
      />
    </div>

    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">* Nivel de riesgo Muy Bajo, Bajo y Medio Bajo.</p>
  }
</app-window-panel>

<!-- Listado de clientes detrás de la métrica elegida — legado `lista-clientes`. -->
<p-dialog
  [header]="tituloDetalle()"
  [visible]="!!metrica()"
  (visibleChange)="cerrarDetalle()"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '92vw', maxWidth: '1200px' }"
>
  <div class="flex flex-col gap-3">
    <app-select-filtro etiqueta="Mostrar" [opciones]="opcionesTope" [(valor)]="tope" ancho="w-36" />

    <app-data-table
      [columns]="columnasClientes"
      [data]="clientes()"
      [loading]="cargandoDetalle()"
      [searchFields]="busquedaClientes"
      searchPlaceholder="Buscar por nombre, unidad o asesor..."
      emptyMessage="No se encontraron clientes."
      emptyHint="Ajusta la búsqueda o los filtros para ver más resultados."
    />
  </div>
</p-dialog>
