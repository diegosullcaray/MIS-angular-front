<app-window-panel titulo="CMG Captaciones - Agencias" [permitirActualizar]="!!nivelActual()" [actualizando]="cargando()" (actualizar)="refrescar()" [conFiltros]="true" [filtrosAbiertos]="true">
  <app-hier-selector
    ventana-filtros
    [paramsHier]="paramsHier"
    placeholder="Elegir agencia"
    (nodoSeleccionado)="onNivelSeleccionado($event)"
    (error)="onErrorJerarquia()"
  />

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige una agencia"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [ajustarAncho]="true" [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
