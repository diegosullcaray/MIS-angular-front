<app-window-panel
  titulo="Dashboard"
  subtitulo="Cero Cuotas Nuevas"
  [permitirActualizar]="!!nivelActual()" [actualizando]="cargando()" (actualizar)="refrescar()"
  [conFiltros]="true"
>
  @if (periodos().length) {
    <!-- Fecha de corte con el estilo de los cierres mensuales: botón de calendario en la barra
         (escritorio) y selector en los filtros (pantallas angostas). -->
    <app-fecha-cierre-boton ventana-acciones etiqueta="Fecha de corte" [opciones]="periodos()" [(valor)]="periodo" />
  }

  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
    @if (periodos().length) {
      <app-grupo-filtros class="lg:hidden">
        <app-select-filtro etiqueta="Fecha de corte" [opciones]="periodos()" [(valor)]="periodo" />
      </app-grupo-filtros>
    }
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else if (cargando()) {
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="mis-card p-3 h-[360px]">
          <app-esqueleto-grafico />
        </div>
      }
    </div>
  } @else if (!graficos().length) {
    <app-empty-state titulo="Sin datos" descripcion="El nivel elegido no tiene información para esta fecha de corte." />
  } @else {
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      @for (grafico of graficos(); track $index) {
        <div class="mis-card p-3 h-[360px]">
          <!-- Legado `Dashboard_rda` (`theme_gp1`): no fija tipo de gráfico, Highcharts cae en línea por defecto. -->
          <app-grafico-mixto [datos]="grafico" tipo="linea" formato="numero" />
        </div>
      }
    </div>
  }
</app-window-panel>
