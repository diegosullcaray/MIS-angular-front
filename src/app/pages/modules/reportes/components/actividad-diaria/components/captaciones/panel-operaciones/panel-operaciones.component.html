<app-window-panel titulo="Panel Operaciones" [permitirActualizar]="false" [conFiltros]="true">
  <div ventana-filtros class="flex items-end gap-3 flex-wrap">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
    <app-select-filtro etiqueta="Producto" [opciones]="opcionesProducto" [(valor)]="producto" ancho="w-56" />
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
    </div>
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla2().headers" [filas]="tabla2().body" [cargando]="cargando()" />
    </div>
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0 leading-relaxed">
      Panel Gestión RED (excluido JP).<br />
      TPPP Mes DPF (excluido renovaciones automáticas).
    </p>
  }
</app-window-panel>
