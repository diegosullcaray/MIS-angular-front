<div class="mis-page mis-page--alta">
  <div class="flex flex-col gap-3 pb-3.5 border-b border-[var(--mis-border)]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-2">
        <i class="pi pi-wallet text-[var(--mis-primary-text)]"></i>
        <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">CMG Captaciones - Agencias</h2>
      </div>

      <p-button
        [icon]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'"
        [label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
        severity="secondary"
        (onClick)="mostrarFiltros.set(!mostrarFiltros())"
      />
    </div>
  </div>

  <div class="flex items-center gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir agencia"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige una agencia"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
    </div>
  }
</div>
