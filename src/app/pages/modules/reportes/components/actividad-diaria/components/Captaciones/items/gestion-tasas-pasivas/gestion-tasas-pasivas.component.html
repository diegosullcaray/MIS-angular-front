<app-window-panel titulo="Gestión de Tasas Pasivas" [permitirActualizar]="false" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir agencia"
      (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
    <div class="flex items-end gap-3 flex-wrap">
      <app-select-filtro etiqueta="Tipo" [opciones]="opcionesTipo" [(valor)]="tipo" ancho="w-36" />
      <app-select-filtro etiqueta="Canal" [opciones]="opcionesCanal" [(valor)]="canal" ancho="w-52" />
    </div>
  </div>

  @if (!nivelActual()) {
  <app-empty-state titulo="Elige una agencia"
    descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
  <p-tabs value="tab1">
    <p-tablist>
      <p-tab value="tab1">Depósitos a Plazo Fijo — Número de Aperturas por Tipo de Persona y Moneda
      </p-tab>
      <p-tab value="tab2">TPPP Mes Aperturas por Tipo de Persona y Moneda
      </p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="tab1">
        <section class="flex flex-col gap-2">
          <div class="mis-card p-3 overflow-x-auto">
            <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
          </div>
        </section>
      </p-tabpanel>
      <p-tabpanel value="tab2">
        <section class="flex flex-col gap-2">
          <div class="mis-card p-3 overflow-x-auto">
            <app-tabla-reporte [encabezados]="tabla2().headers" [filas]="tabla2().body" [cargando]="cargando()" />
          </div>
        </section>

      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
  }
</app-window-panel>
