<app-window-panel titulo="Gestión de Cartera Reasignada" subtitulo="Portafolio Reasignado" [permitirActualizar]="false"
  [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
    <app-select-filtro etiqueta="Mostrar por" [opciones]="opcionesMostrarPor" [(valor)]="mostrarPor" ancho="w-48" />
  </div>

  @if (!nivelActual()) {
  <app-empty-state titulo="Elige un nivel"
    descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
  <p-tabs value="resumen">
    <p-tablist>
      <p-tab value="resumen" class="!py-2 !px-3">Resumen</p-tab>
      <p-tab value="detalle" class="!py-2 !px-3">Detalle</p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="resumen">
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-reporte [encabezados]="resumen().headers" [filas]="resumen().body"
            [cargando]="cargandoResumen()" />

          <!-- `content.lower` de `cuadro_Variable_Riesgo_01` en `cra-map.ts`. -->
          <p nota class="text-[11px] text-[var(--mis-text-tertiary)] m-0 leading-relaxed">
            <b>reacción de visita al cliente versus la geolocalización del domicilio legal registrada en el " Alta de
            persona"</b><br />
          </p>
  
        </div>
      </p-tabpanel>

      <p-tabpanel value="detalle">
        <app-detalle-reasignado [tabla]="detalle()" [cargando]="cargandoDetalle()" [total]="totalDetalle()"
          [opcionesUltimaGestion]="opcionesUltimaGestion()" [(asesor)]="asesor" [(fechaCompromiso)]="fechaCompromiso"
          [(ultimaGestion)]="ultimaGestion" [(pagina)]="pagina" (buscarAsesor)="onBuscarAsesor()" />
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
  }
</app-window-panel>
