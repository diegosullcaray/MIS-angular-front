<app-window-panel titulo="Gestión Pasivo Comercial" [permitirActualizar]="false" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-dinamica [columnas]="tabla().columnas" [filas]="tabla().filas" [cargando]="cargando()" [colorearVariaciones]="true" />
    </div>
  }
</app-window-panel>
