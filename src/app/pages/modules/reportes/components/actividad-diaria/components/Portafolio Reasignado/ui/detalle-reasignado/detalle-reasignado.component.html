<div class="flex flex-col gap-3">
  <app-grupo-filtros>
    <ng-content select="[filtros]" />

    <div class="flex flex-col gap-0.5">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Última gestión</span>
      <p-select appendTo="body"
        [options]="opcionesUltimaGestion()"
        optionLabel="desc"
        optionValue="id"
        [ngModel]="ultimaGestion()"
        (ngModelChange)="ultimaGestion.set($event)"
        styleClass="text-[11.5px] w-52"
        ariaLabel="Última gestión"
      />
    </div>

    <div class="flex flex-col gap-0.5">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Fecha compromiso</span>
      <p-datepicker
        [ngModel]="fechaCompromiso()"
        (ngModelChange)="fechaCompromiso.set($event)"
        dateFormat="dd/mm/yy"
        [showClear]="true"
        styleClass="text-[11.5px] w-44"
        inputStyleClass="text-[11.5px]"
        ariaLabel="Fecha compromiso"
      />
    </div>

    <div class="flex flex-col gap-0.5">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
      <input
        pInputText
        [ngModel]="asesor()"
        (ngModelChange)="asesor.set($event)"
        (keyup.enter)="buscarAsesor.emit()"
        placeholder="Nombre del asesor"
        class="w-52 text-[11.5px]"
      />
    </div>

    <p-button label="Buscar asesor" icon="pi pi-search" size="small" (onClick)="buscarAsesor.emit()" />
  </app-grupo-filtros>

  <!-- El paginador va dentro de la tarjeta de la tabla, pegado a su pie. -->
  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tabla().headers" [filas]="tabla().body" [cargando]="cargando()" />
    <p-paginator
      class="border-t border-[var(--mis-border)] mt-2 pt-1"
      [first]="primeraFila"
      [rows]="porPagina"
      [totalRecords]="total()"
      (onPageChange)="onPagina($event)"
      styleClass="text-[12px] !bg-transparent"
    />
  </div>
</div>
