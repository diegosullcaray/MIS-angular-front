<app-window-panel titulo="Ranking Mujer" subtitulo="Clientes" [permitirActualizar]="false" [conFiltros]="true">
  <app-hier-selector
    ventana-filtros
    [paramsHier]="paramsHier"
    placeholder="Elegir nivel"
    (nodoSeleccionado)="onNivelSeleccionado($event)"
    (error)="onErrorJerarquia()"
  />

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    <p-tabs value="nuevas">
      <p-tablist>
        @for (tab of tabs; track tab.id) {
          <p-tab [value]="tab.id" class="!py-2 !px-3">{{ tab.titulo }}</p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        @for (tab of tabs; track tab.id) {
          <p-tabpanel [value]="tab.id">
            <div class="mis-card p-3 overflow-x-auto">
              <app-tabla-dinamica [columnas]="tab.tabla().columnas" [filas]="tab.tabla().filas" [cargando]="cargando()" />
            </div>
          </p-tabpanel>
        }
      </p-tabpanels>
    </p-tabs>
  }
</app-window-panel>
