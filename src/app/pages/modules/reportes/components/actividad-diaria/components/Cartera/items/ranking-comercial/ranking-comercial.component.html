<app-window-panel
  titulo="Ranking Unidades de Negocio - Desembolsos"
  subtitulo="Cartera"
  [permitirActualizar]="false"
  [conFiltros]="true"
>
  <!--
    Sin selector de jerarquía a propósito: el legado pide el ranking completo y
    filtra en el cliente, así que este reporte solo usa sus tres filtros propios.
  -->
  <div ventana-filtros class="flex flex-wrap items-end gap-3">
    <app-input-filtro etiqueta="Unidad" placeholder="Buscar unidad…" [(valor)]="unidad" />
    <app-input-filtro etiqueta="Corredor" placeholder="Buscar corredor…" [(valor)]="corredor" />
    <app-select-filtro etiqueta="Territorio" [opciones]="territorios()" [(valor)]="territorio" ancho="w-52" />
  </div>

  @if (error()) {
    <app-empty-state
      titulo="No se pudo cargar el reporte"
      descripcion="Vuelve a intentarlo en unos segundos."
    />
  } @else {
    <!--
      "Avance Esperado": el `Timing` de la primera fila — el porcentaje de días
      transcurridos del mes, y la referencia contra la que se pinta el semáforo
      de cada columna de avance.
    -->
    <div class="mis-card p-4 flex items-center justify-between gap-4 max-w-sm">
      <div class="flex flex-col gap-1">
        <span class="text-[11px] uppercase tracking-wide text-[var(--mis-text-tertiary)]">Avance Esperado</span>
        <span class="text-[28px] leading-none font-semibold text-[var(--mis-text-primary)] tabular-nums">
          {{ avanceEsperado() | number: '1.2-2' }}%
        </span>
      </div>
      <span class="text-[11px] text-[var(--mis-text-tertiary)] text-right leading-relaxed max-w-[11rem]">
        Días transcurridos del mes. Cada avance se compara contra este valor.
      </span>
    </div>

    <!-- Leyenda del semáforo, con los mismos umbrales que el legado. -->
    <div class="flex flex-wrap items-center gap-4 text-[11px] text-[var(--mis-text-tertiary)]">
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-[var(--mis-success)]"></span>
        Avance ≥ esperado
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
        Entre el 80 % y el 100 % del esperado
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-[var(--mis-danger)]"></span>
        Por debajo del 80 %
      </span>
    </div>

    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-dinamica [columnas]="columnas()" [filas]="filas()" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
