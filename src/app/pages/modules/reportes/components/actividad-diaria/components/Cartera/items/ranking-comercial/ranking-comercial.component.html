<app-window-panel
  titulo="Ranking Unidades de Negocio - Desembolsos"
  subtitulo="Cartera"
  [permitirActualizar]="false"
  [conFiltros]="true"
>
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />

    <div class="flex flex-wrap items-end gap-3">
      <div class="flex flex-col gap-0.5">
        <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Unidad</span>
        <input pInputText [ngModel]="unidad()" (ngModelChange)="unidad.set($event)" placeholder="Buscar unidad…" class="w-44 text-[11.5px]" />
      </div>
      <div class="flex flex-col gap-0.5">
        <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Corredor</span>
        <input pInputText [ngModel]="corredor()" (ngModelChange)="corredor.set($event)" placeholder="Buscar corredor…" class="w-44 text-[11.5px]" />
      </div>
      <div class="flex flex-col gap-0.5">
        <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Territorio</span>
        <p-select
          [options]="territorios()"
          optionLabel="desc"
          optionValue="id"
          [ngModel]="territorio()"
          (ngModelChange)="territorio.set($event)"
          styleClass="text-[11.5px] w-52"
          ariaLabel="Territorio"
        />
      </div>
    </div>
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-dinamica [columnas]="columnas()" [filas]="filas()" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
