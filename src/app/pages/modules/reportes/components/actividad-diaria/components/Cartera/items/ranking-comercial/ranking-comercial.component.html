<app-window-panel
  titulo="Ranking Unidades de Negocio - Desembolsos"
  subtitulo="Cartera"
  [permitirActualizar]="false"
  [conFiltros]="true"
>
  <!--
    Sin selector de jerarquía a propósito: el legado pide el ranking completo y
    filtra en el cliente, así que este reporte solo usa sus tres filtros propios.
  -->
  <div ventana-filtros class="flex flex-wrap items-end gap-3">
    <app-input-filtro etiqueta="Unidad" placeholder="Buscar unidad…" [(valor)]="unidad" />
    <app-input-filtro etiqueta="Corredor" placeholder="Buscar corredor…" [(valor)]="corredor" />
    <app-select-filtro etiqueta="Territorio" [opciones]="territorios()" [(valor)]="territorio" ancho="w-52" />
  </div>

  @if (error()) {
    <app-empty-state
      titulo="No se pudo cargar el reporte"
      descripcion="Vuelve a intentarlo en unos segundos."
    />
  } @else {
    <!-- "Avance Esperado (Timing)" del legado con tokens del sistema -->
    <div class="flex items-center gap-3">
      <div class="inline-flex items-center gap-2 bg-[var(--mis-surface)] border border-[var(--mis-border-strong)] px-4 py-1.5 rounded-full shadow-xs">
        <i class="pi pi-clock text-[var(--mis-primary)] text-sm"></i>
        <span class="text-xs font-semibold text-[var(--mis-text-primary)]">Avance Esperado (Timing):</span>
        <span class="text-sm font-bold text-[var(--mis-primary-text)] tabular-nums">{{ avanceEsperado() | number: '1.2-2' }}%</span>
      </div>
    </div>

    <div class="bg-white dark:bg-[var(--mis-surface)] p-3 rounded-xl border border-[var(--mis-border)] overflow-x-auto shadow-xs">
      <app-tabla-dinamica [columnas]="columnas()" [filas]="filas()" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
