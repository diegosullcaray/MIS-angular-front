<app-window-panel
  titulo="Tablero Digital Comercial"
  subtitulo="Tablero Digital"
  [permitirActualizar]="false"
  [conFiltros]="true"
>
  <div ventana-filtros class="flex flex-wrap items-end gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
    <!--
      El periodo del legado es la lista de cortes que devuelve `RS_FECH`, no un
      calendario libre. Si viene vacía, el reporte usa el corte del usuario.
    -->
    @if (periodos().length) {
      <app-select-filtro etiqueta="Periodo" [opciones]="periodos()" [(valor)]="periodo" ancho="w-44" />
    }
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-dinamica [columnas]="columnas()" [filas]="filas()" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
