<app-window-panel titulo="Gestión Comercial" subtitulo="Cartera" [permitirActualizar]="false" [conFiltros]="true">
  <app-hier-selector
    ventana-filtros
    [paramsHier]="paramsHier"
    placeholder="Elegir nivel"
    (nodoSeleccionado)="onNivelSeleccionado($event)"
    (error)="onErrorJerarquia()"
  />

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    <div class="flex flex-col gap-5">
      <!-- Dos pestañas, mismo orden y nombres que el legado (`gestion-comercial.component.html`):
           "Saldo Cartera" primero, "Clientes" segundo. Los 7 gráficos van debajo, fuera de las
           pestañas — el legado los muestra sin depender de cuál esté activa. -->
      <p-tabs value="saldo">
        <p-tablist>
          <p-tab value="saldo" class="!py-2 !px-3">Saldo Cartera</p-tab>
          <p-tab value="clientes" class="!py-2 !px-3">Clientes</p-tab>
        </p-tablist>

        <p-tabpanels>
          <!-- Las dos pestañas son el mismo `RS_GEST_COM_01` con distintas columnas. -->
          <p-tabpanel value="saldo">
            <div class="flex flex-col gap-5">
              <div class="mis-card p-3 overflow-x-auto">
                <app-tabla-dinamica [columnas]="columnasProduccion" [filas]="filas()" [cargando]="cargando()" />
              </div>

              <section class="flex flex-col gap-2">
                <h2 class="text-[13px] font-semibold text-[var(--mis-text-primary)] m-0">Var. Saldo Cartera Vigente</h2>
                <div class="mis-card p-3 overflow-x-auto">
                  <app-tabla-dinamica
                    [columnas]="varSaldoVigente().columnas"
                    [filas]="varSaldoVigente().filas"
                    [cargando]="cargando()"
                  />
                </div>
              </section>
            </div>
          </p-tabpanel>

          <p-tabpanel value="clientes">
            <div class="flex flex-col gap-5">
              <div class="mis-card p-3 overflow-x-auto">
                <app-tabla-dinamica [columnas]="columnasClientes" [filas]="filas()" [cargando]="cargando()" />
              </div>

              <section class="flex flex-col gap-2">
                <h2 class="text-[13px] font-semibold text-[var(--mis-text-primary)] m-0">Var. Clientes Stock</h2>
                <div class="mis-card p-3 overflow-x-auto">
                  <app-tabla-dinamica
                    [columnas]="varClientesStock().columnas"
                    [filas]="varClientesStock().filas"
                    [cargando]="cargando()"
                  />
                </div>
              </section>
            </div>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>

      <!-- "📊 Análisis Gráfico" del legado: los 7 gráficos de `GRAFICOS_GESTION_COMERCIAL`,
           siempre visibles debajo de las pestañas (no dependen de cuál está activa). -->
      <section class="flex flex-col gap-1 border-t border-[var(--mis-border)] pt-4">
        <h2 class="text-[15px] font-semibold text-[var(--mis-text-primary)] m-0">Análisis Gráfico</h2>
        <p class="text-[12px] text-[var(--mis-text-tertiary)] m-0">Visualización de métricas y tendencias del periodo actual.</p>
      </section>

      <div class="grid gap-3 grid-cols-1 xl:grid-cols-2">
        @for (grafico of graficos(); track grafico.titulo) {
          <!-- El título lo pinta la propia gráfica a partir de `bloque.titulo`. -->
          <div class="mis-card p-3 h-[360px]">
            <app-grafico-mixto [datos]="grafico" />
          </div>
        }
      </div>
    </div>
  }
</app-window-panel>
