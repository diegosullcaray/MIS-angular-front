<app-window-panel titulo="Vinculación Cartera" subtitulo="Captaciones" [permitirActualizar]="false" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    @if (kpis().length) {
      <div class="grid gap-3 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
        @for (kpi of kpis(); track kpi.producto) {
          <div class="mis-card p-3 flex flex-col gap-1">
            <span class="text-[11px] uppercase tracking-wide text-[var(--mis-text-tertiary)]">{{ kpi.producto }}</span>
            <span class="text-[11px] text-[var(--mis-text-tertiary)]">Saldo total</span>
            <span class="text-lg font-semibold text-[var(--mis-text-primary)]">S/ {{ kpi.saldo | number: '1.2-2' }}</span>
            <span
              class="text-[12px] font-medium"
              [style.color]="kpi.variacion > 0 ? 'var(--mis-success)' : kpi.variacion < 0 ? 'var(--mis-danger)' : null"
            >
              @if (kpi.variacion > 0) { ▲ } @else if (kpi.variacion < 0) { ▼ }
              {{ kpi.variacion | number: '1.0-0' }} <span class="text-[var(--mis-text-tertiary)]">var. mes</span>
            </span>
          </div>
        }
      </div>
    }

    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-dinamica [columnas]="tabla().columnas" [filas]="tabla().filas" [cargando]="cargando()" [colorearVariaciones]="true" />
    </div>
  }
</app-window-panel>
