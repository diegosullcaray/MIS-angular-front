<app-window-panel titulo="Vinculación Cartera" subtitulo="Captaciones" [permitirActualizar]="false" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel" descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte." />
  } @else {
    @if (kpis().length) {
      <!-- Tres columnas y no cuatro: son tres productos (ahorros, plazo fijo, CTS). -->
      <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
        @for (kpi of kpis(); track kpi.producto) {
          <div class="kpi-card p-3.5 sm:p-4 rounded-xl sm:rounded-2xl flex flex-col justify-between gap-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[11px] sm:text-[12px] font-bold uppercase tracking-wider text-[var(--mis-text-tertiary)] truncate">
                {{ kpi.producto }}
              </span>
              @if (kpi.variacion !== 0) {
                <span
                  class="flex items-center gap-1 text-[11px] sm:text-xs font-bold px-2 py-0.5 rounded-full shrink-0"
                  [class.trend-badge-positive]="kpi.variacion > 0"
                  [class.trend-badge-negative]="kpi.variacion < 0"
                >
                  {{ kpi.variacion | number: '1.0-2' }}
                  <i class="pi text-[10px]" [class.pi-arrow-up]="kpi.variacion > 0" [class.pi-arrow-down]="kpi.variacion < 0"></i>
                </span>
              }
            </div>

            <!-- `truncate`: el saldo va completo (no compactado), y uno largo desbordaría. -->
            <span class="text-[20px] sm:text-[24px] font-extrabold tracking-tight text-[var(--mis-text-primary)] leading-tight truncate">
              S/ {{ kpi.saldo | number: '1.0-2' }}
            </span>

            <span class="text-[11px] sm:text-[12px] font-medium text-[var(--mis-text-secondary)]">
              vs. mes anterior
            </span>
          </div>
        }
      </section>
    }

    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-dinamica [columnas]="tabla().columnas" [filas]="tabla().filas" [cargando]="cargando()" [colorearVariaciones]="true" />
    </div>
  }
</app-window-panel>
