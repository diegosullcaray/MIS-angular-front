<app-reporte-simple
  titulo="CMG Clientes Pasivo Detalle"
  subtitulo="CMG Clientes Pasivos"
  [paramsHier]="paramsHier"
  placeholder="Elegir agencia"
  [nivel]="nivelActual()"
  [tabla]="tabla()"
  [cargando]="cargando()"
  tituloVacio="Elige una agencia"
  (nivelSeleccionado)="onNivelSeleccionado($event)"
  (errorJerarquia)="onErrorJerarquia()"
>
  <div filtros class="flex flex-wrap items-end gap-3">
    <app-select-filtro etiqueta="Variable" [opciones]="opcionesVariable" [(valor)]="variable" />
    <app-select-filtro etiqueta="Grupo" [opciones]="opcionesGrupo" [(valor)]="grupo" ancho="w-48" />
  </div>
</app-reporte-simple>
