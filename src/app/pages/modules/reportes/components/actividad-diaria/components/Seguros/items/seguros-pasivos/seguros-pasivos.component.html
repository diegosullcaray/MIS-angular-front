<app-window-panel titulo="Seguros Pasivos" subtitulo="Seguros" [permitirActualizar]="false" [conFiltros]="true">
  <app-hier-selector
    ventana-filtros
    [paramsHier]="paramsHier"
    placeholder="Elegir nivel"
    (nodoSeleccionado)="onNivelSeleccionado($event)"
    (error)="onErrorJerarquia()"
  />

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <!-- Mismas pestañas que el `mat-tab-group` del legado. -->
    <p-tabs [value]="pestanas[0].id">
      <p-tablist>
        @for (p of pestanas; track p.id) {
          <p-tab [value]="p.id" class="!py-2 !px-3">{{ p.titulo }}</p-tab>
        }
      </p-tablist>
      <p-tabpanels>
        @for (p of pestanas; track p.id) {
          <p-tabpanel [value]="p.id">
            <div class="mis-card p-3 overflow-x-auto">
              <app-tabla-dinamica
                [columnas]="tablas()[p.indice]?.columnas ?? []"
                [filas]="tablas()[p.indice]?.filas ?? []"
                [cargando]="cargando()"
              />
            </div>
          </p-tabpanel>
        }
      </p-tabpanels>
    </p-tabs>
  }
</app-window-panel>
