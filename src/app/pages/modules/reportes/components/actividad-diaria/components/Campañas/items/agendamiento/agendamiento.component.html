<app-window-panel titulo="Agendamiento" subtitulo="Campañas" [permitirActualizar]="false" [conFiltros]="true">
  <div ventana-filtros class="flex flex-col gap-3">
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
    <div class="flex items-end gap-3 flex-wrap">
      <app-select-filtro etiqueta="Nivel de fuga" [opciones]="opcionesFuga" [(valor)]="fuga" ancho="w-52" />
      <app-select-filtro etiqueta="Nivel de propensión" [opciones]="opcionesPropension" [(valor)]="propension" ancho="w-52" />
      <app-select-filtro etiqueta="Rango" [opciones]="opcionesRango" [(valor)]="rango" ancho="w-44" />
    </div>
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <div class="flex flex-col gap-5">
      @for (tabla of tablas(); track $index; let i = $index) {
        <section class="flex flex-col gap-2">
          <h2 class="text-[13px] font-semibold text-[var(--mis-text-primary)] m-0">{{ titulos[i] }}</h2>
          <div class="mis-card p-3 overflow-x-auto">
            <app-tabla-dinamica [columnas]="tabla.columnas" [filas]="tabla.filas" [cargando]="cargando()" />
          </div>
        </section>
      }
    </div>
  }
</app-window-panel>
