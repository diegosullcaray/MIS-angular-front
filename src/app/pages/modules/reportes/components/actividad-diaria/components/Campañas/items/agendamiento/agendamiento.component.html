<app-window-panel titulo="Agendamiento" subtitulo="Campañas" [permitirActualizar]="false" [conFiltros]="true">
  <app-hier-selector
    ventana-filtros
    [paramsHier]="paramsHier"
    placeholder="Elegir nivel"
    (nodoSeleccionado)="onNivelSeleccionado($event)"
    (error)="onErrorJerarquia()"
  />

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel"
      descripcion="Selecciona un nivel de la jerarquía en los filtros de arriba para ver el reporte."
    />
  } @else {
    <!-- Las cuatro pestañas del legado (`mat-tab-group`), cada una con su propia secuencia de filtros. -->
    <p-tabs [(value)]="pestana">
      <p-tablist>
        <p-tab value="resumen-total" class="!py-2 !px-3">Resumen Total</p-tab>
        <p-tab value="resumen-bases" class="!py-2 !px-3">Resumen por Bases</p-tab>
        <p-tab value="detalle-vivas" class="!py-2 !px-3">Detalle Bases Vivas</p-tab>
        <p-tab value="detalle-auto" class="!py-2 !px-3">Detalle Bases Automáticos y express</p-tab>
      </p-tablist>

      <p-tabpanels>
        <!-- "Resumen Total" — legado: Nivel de Fuga + Nivel de propensión. -->
        <p-tabpanel value="resumen-total">
          <div class="flex flex-col gap-3">
            <app-grupo-filtros>
              <app-select-filtro etiqueta="Nivel de fuga" [opciones]="opcionesFuga" [(valor)]="fuga" ancho="w-52" />
              <app-select-filtro
                etiqueta="Nivel de propensión"
                [opciones]="opcionesPropension"
                [(valor)]="propension"
                ancho="w-52"
              />
            </app-grupo-filtros>
            <!-- Solo la pestaña visible pinta su tabla. -->
            @if (pestana() === 'resumen-total') {
              <div class="mis-card p-3 overflow-x-auto">
                <app-tabla-dinamica
                  [columnas]="resumenTotal().columnas"
                  [filas]="resumenTotal().filas"
                  [cargando]="cargandoTabla(0)"
                />
              </div>
            }
          </div>
        </p-tabpanel>

        <!-- "Resumen por Bases" — legado: mismos dos filtros que "Resumen Total". -->
        <p-tabpanel value="resumen-bases">
          <div class="flex flex-col gap-3">
            <app-grupo-filtros>
              <app-select-filtro etiqueta="Nivel de fuga" [opciones]="opcionesFuga" [(valor)]="fuga" ancho="w-52" />
              <app-select-filtro
                etiqueta="Nivel de propensión"
                [opciones]="opcionesPropension"
                [(valor)]="propension"
                ancho="w-52"
              />
            </app-grupo-filtros>
            <!-- Solo la pestaña visible pinta su tabla. -->
            @if (pestana() === 'resumen-bases') {
              <div class="mis-card p-3 overflow-x-auto">
                <app-tabla-dinamica
                  [columnas]="resumenPorBases().columnas"
                  [filas]="resumenPorBases().filas"
                  [cargando]="cargandoTabla(1)"
                />
              </div>
            }
          </div>
        </p-tabpanel>

        <!--
          "Detalle Bases Vivas" — legado `onTabChanged()`: acá se OCULTA "Nivel de
          Fuga" y aparece "Rango de fechas Cancela" en su lugar. Es la única
          pestaña con ese filtro visible.
        -->
        <p-tabpanel value="detalle-vivas">
          <div class="flex flex-col gap-3">
            <app-grupo-filtros>
              <app-select-filtro
                etiqueta="Nivel de propensión"
                [opciones]="opcionesPropension"
                [(valor)]="propension"
                ancho="w-52"
              />
              <app-select-filtro etiqueta="Rango de fechas Cancela" [opciones]="opcionesRango" [(valor)]="rango" ancho="w-48" />
            </app-grupo-filtros>
            <!-- Solo la pestaña visible pinta su tabla. -->
            @if (pestana() === 'detalle-vivas') {
              <div class="mis-card p-3 overflow-x-auto">
                <app-tabla-dinamica
                  [columnas]="detalleBasesVivas().columnas"
                  [filas]="detalleBasesVivas().filas"
                  [cargando]="cargandoTabla(2)"
                  [filasPorPagina]="filasPorPaginaDetalle"
                />
              </div>
            }
          </div>
        </p-tabpanel>

        <!--
          "Detalle Bases Automáticos y express" — legado: mismos filtros que
          "Resumen Total" (Fuga + Propensión). El rango elegido en "Detalle
          Bases Vivas" sigue afectando a esta tabla (`RS_AGE_COM_03` también
          recibe `nom`), aunque acá no se pueda cambiar.
        -->
        <p-tabpanel value="detalle-auto">
          <div class="flex flex-col gap-3">
            <app-grupo-filtros>
              <app-select-filtro etiqueta="Nivel de fuga" [opciones]="opcionesFuga" [(valor)]="fuga" ancho="w-52" />
              <app-select-filtro
                etiqueta="Nivel de propensión"
                [opciones]="opcionesPropension"
                [(valor)]="propension"
                ancho="w-52"
              />
            </app-grupo-filtros>
            <!-- Solo la pestaña visible pinta su tabla. -->
            @if (pestana() === 'detalle-auto') {
              <div class="mis-card p-3 overflow-x-auto">
                <app-tabla-dinamica
                  [columnas]="detalleBasesAutomaticas().columnas"
                  [filas]="detalleBasesAutomaticas().filas"
                  [cargando]="cargandoTabla(3)"
                  [filasPorPagina]="filasPorPaginaDetalle"
                />
              </div>
            }
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</app-window-panel>
