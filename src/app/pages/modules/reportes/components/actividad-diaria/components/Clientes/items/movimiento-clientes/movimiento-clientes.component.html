<app-window-panel titulo="Movimiento de Clientes" subtitulo="Clientes" [permitirActualizar]="false">
  <p-tabs value="carteras">
    <p-tablist>
      @for (pestana of pestanas; track pestana.id) {
        <p-tab [value]="pestana.id" class="!py-2 !px-3">{{ pestana.titulo }}</p-tab>
      }
    </p-tablist>

    <p-tabpanels>
      @for (pestana of pestanas; track pestana.id) {
        <p-tabpanel [value]="pestana.id">
          <div class="flex flex-col gap-5">
            @for (bloque of pestana.bloques; track bloque.gru) {
              <section class="flex flex-col gap-2">
                <h2 class="text-[13px] font-semibold text-[var(--mis-text-primary)] m-0">{{ bloque.titulo }}</h2>

                <div class="mis-card p-3 overflow-x-auto">
                  <app-tabla-dinamica [columnas]="reporte().columnas" [filas]="filas(bloque.gru)" [cargando]="cargando()" />
                </div>

                @if (bloque.notas) {
                  <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0 leading-relaxed">
                    @for (nota of bloque.notas; track nota) {
                      {{ nota }}<br />
                    }
                  </p>
                }
              </section>
            }
          </div>
        </p-tabpanel>
      }
    </p-tabpanels>
  </p-tabs>
</app-window-panel>
