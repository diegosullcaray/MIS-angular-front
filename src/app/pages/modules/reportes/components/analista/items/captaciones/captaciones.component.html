<app-window-panel
  [conFiltros]="true"
  titulo="Captaciones"
  [permitirActualizar]="false"
>
  <app-grupo-filtros ventana-filtros>
    <app-filtro-asesor [asesores]="asesores()" [seleccionado]="asesorSeleccionado()" [editable]="mostrarSelector()" (cambio)="onAsesorSeleccionado($event)" />
  </app-grupo-filtros>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver sus captaciones.</p>
  } @else {
    <div class="flex flex-col gap-4">
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
      </div>
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla2().headers" [filas]="tabla2().body" [cargando]="cargando()" />
      </div>
      <div class="flex flex-col gap-2">
        <span class="text-[11px] font-bold text-[var(--mis-text-primary)] uppercase tracking-wider">Ahorro Programado</span>
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-reporte [encabezados]="tabla3().headers" [filas]="tabla3().body" [cargando]="cargando()" />
        </div>
      </div>
    </div>
  }
</app-window-panel>
