<app-window-panel
  [conFiltros]="true"
  titulo="Inversión y Stock de Mora"
  [permitirActualizar]="false"
>
  <app-grupo-filtros ventana-filtros>
    <div class="flex flex-col gap-1">
      <span class="text-[11px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
      @if (mostrarSelector()) {
            <p-select appendTo="body"
        [options]="asesores()"
        [ngModel]="asesorSeleccionado()"
        (ngModelChange)="onAsesorSeleccionado($event)"
        optionLabel="nombre"
        dataKey="dni"
        [filter]="true"
        filterBy="nombre"
        placeholder="Buscar asesor"
        styleClass="w-72 text-[11.5px]"
        ariaLabel="Asesor"
      />
      } @else {
        <span class="text-[11.5px] text-[var(--mis-text-secondary)]">{{ asesorSeleccionado()?.nombre }}</span>
      }
    </div>
  </app-grupo-filtros>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver su inversión y stock de mora.</p>
  } @else if (error()) {
    <app-inline-error [titulo]="errorDeCarga" detalle="Reintenta la consulta en unos segundos." (reintentar)="onAsesorSeleccionado(asesorSeleccionado())" />
  } @else if (cargando()) {
    <div class="flex flex-col gap-4">
      <p-skeleton height="320px" />
    </div>
  } @else if (vacio()) {
    <app-empty-state titulo="Sin datos de mora" descripcion="Este asesor no registra inversión ni stock de mora." />
  } @else {
    <div class="flex flex-col gap-5">
      @for (grafico of graficos(); track $index) {
        <div class="mis-card p-3 h-[360px]">
          <app-grafico-mixto [datos]="grafico" tipo="linea" />
        </div>
      }
    </div>
  }
</app-window-panel>
