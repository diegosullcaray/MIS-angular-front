<app-window-panel
  [conFiltros]="true"
  titulo="Colocaciones Diaria"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex flex-col gap-1">
    <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
    <p-select
      [options]="asesores()"
      [ngModel]="asesorSeleccionado()"
      (ngModelChange)="onAsesorSeleccionado($event)"
      optionLabel="nombre"
      dataKey="dni"
      [filter]="true"
      filterBy="nombre"
      placeholder="Buscar asesor"
      styleClass="w-72 text-[11.5px]"
      ariaLabel="Asesor"
    />
  </div>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver sus colocaciones diarias.</p>
  } @else {
    <div class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <h3 class="m-0 text-[13px] font-bold text-[var(--mis-text-primary)]">Proyección Diaria por Operaciones</h3>
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <h3 class="m-0 text-[13px] font-bold text-[var(--mis-text-primary)]">Proyección Diaria por Colocaciones</h3>
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-reporte [encabezados]="tabla2().headers" [filas]="tabla2().body" [cargando]="cargando()" />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <h3 class="m-0 text-[13px] font-bold text-[var(--mis-text-primary)]">Proyección Diaria por Efectividades</h3>
        <div class="mis-card p-3 overflow-x-auto">
          <app-tabla-reporte [encabezados]="tabla3().headers" [filas]="tabla3().body" [cargando]="cargando()" />
        </div>
      </div>
    </div>
  }
</app-window-panel>
