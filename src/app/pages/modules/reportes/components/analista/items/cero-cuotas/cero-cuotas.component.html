<app-window-panel
  [conFiltros]="true"
  titulo="Cero Cuotas"
  [permitirActualizar]="!!asesorSeleccionado()"
  [actualizando]="cargando()"
  (actualizar)="refrescar()"
>
  <app-grupo-filtros ventana-filtros>
    <app-filtro-asesor [asesores]="asesores()" [seleccionado]="asesorSeleccionado()" [editable]="mostrarSelector()" (cambio)="onAsesorSeleccionado($event)" />
  </app-grupo-filtros>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver sus clientes con cero o una cuota impaga.</p>
  } @else {
    <div class="flex flex-col gap-2">
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
      </div>
      <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">
        ¡Urgente gestión! Estos son los clientes de tu cartera que no han pagado ni una cuota.
      </p>
    </div>
  }
</app-window-panel>
