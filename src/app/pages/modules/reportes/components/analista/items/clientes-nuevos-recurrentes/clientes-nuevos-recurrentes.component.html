<app-window-panel
  [conFiltros]="true"
  titulo="Clientes Nuevos y Recurrentes"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex flex-col gap-1">
    <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
    @if (mostrarSelector()) {
          <p-select appendTo="body"
      [options]="asesores()"
      [ngModel]="asesorSeleccionado()"
      (ngModelChange)="onAsesorSeleccionado($event)"
      optionLabel="nombre"
      dataKey="dni"
      [filter]="true"
      filterBy="nombre"
      placeholder="Buscar asesor"
      styleClass="w-72 text-[11.5px]"
      ariaLabel="Asesor"
    />
    } @else {
      <span class="text-[11.5px] text-[var(--mis-text-secondary)]">{{ asesorSeleccionado()?.nombre }}</span>
    }
  </div>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver sus clientes nuevos y recurrentes.</p>
  } @else {
    <div class="flex flex-col gap-4">
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
      </div>
    </div>
  }
</app-window-panel>
