<app-window-panel
  [conFiltros]="true"
  titulo="Recuperación Preventiva"
  [permitirActualizar]="!!asesorSeleccionado()"
  [actualizando]="cargando()"
  (actualizar)="refrescar()"
>
  <app-grupo-filtros ventana-filtros>
    <app-filtro-asesor [asesores]="asesores()" [seleccionado]="asesorSeleccionado()" [editable]="mostrarSelector()" (cambio)="onAsesorSeleccionado($event)" />
  </app-grupo-filtros>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver su recuperación preventiva.</p>
  } @else {
    <div class="flex flex-col gap-2">
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [ajustarAncho]="true" [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
      </div>
      <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">
        Esta es la lista de tus créditos que vencen en los próximos días; 30 días para créditos agro y 5 días para los otros productos.
        Programa tus gestiones con tiempo.
      </p>
    </div>
  }
</app-window-panel>
