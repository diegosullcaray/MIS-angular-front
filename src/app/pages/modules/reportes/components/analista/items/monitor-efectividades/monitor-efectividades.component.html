<app-window-panel
  [conFiltros]="true"
  titulo="Detalle Monitor de Efectividades"
  [permitirActualizar]="!!asesorSeleccionado()"
  [actualizando]="cargando()"
  (actualizar)="refrescar()"
>
  <app-grupo-filtros ventana-filtros>
    <app-filtro-asesor [asesores]="asesores()" [seleccionado]="asesorSeleccionado()" [editable]="mostrarSelector()" (cambio)="onAsesorSeleccionado($event)" />

    <div class="flex flex-col gap-1">
      <span class="text-[11px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Tramo</span>
      <p-select appendTo="body"
        [options]="opcionesTramo"
        [ngModel]="filtros().tramof"
        (ngModelChange)="actualizarFiltro('tramof', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-36 text-[11.5px]"
        ariaLabel="Tramo"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[11px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Producto</span>
      <p-select appendTo="body"
        [options]="opcionesProducto"
        [ngModel]="filtros().prod"
        (ngModelChange)="actualizarFiltro('prod', $event)"
        optionLabel="desc"
        optionValue="id"
        [filter]="true"
        filterBy="desc"
        styleClass="w-52 text-[11.5px]"
        ariaLabel="Producto"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[11px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Compromiso Roto</span>
      <p-select appendTo="body"
        [options]="opcionesSiNo"
        [ngModel]="filtros().comp_r"
        (ngModelChange)="actualizarFiltro('comp_r', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-32 text-[11.5px]"
        ariaLabel="Compromiso Roto"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[11px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">0 Cuota</span>
      <p-select appendTo="body"
        [options]="opcionesSiNo"
        [ngModel]="filtros().zcuo"
        (ngModelChange)="actualizarFiltro('zcuo', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-32 text-[11.5px]"
        ariaLabel="0 Cuota"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[11px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">1 Cuota</span>
      <p-select appendTo="body"
        [options]="opcionesSiNo"
        [ngModel]="filtros().ucuo"
        (ngModelChange)="actualizarFiltro('ucuo', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-32 text-[11.5px]"
        ariaLabel="1 Cuota"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[11px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Tramo Días Gestión</span>
      <p-select appendTo="body"
        [options]="opcionesTramoDiasGestion"
        [ngModel]="filtros().tdcr"
        (ngModelChange)="actualizarFiltro('tdcr', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-44 text-[11.5px]"
        ariaLabel="Tramo Días Gestión"
      />
    </div>
  </app-grupo-filtros>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver el detalle de efectividades.</p>
  } @else {
    <div class="flex flex-col gap-2">
      <app-chip-informativo texto="Expresado en PEN y %" />
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [ajustarAncho]="true" [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
      </div>
    </div>
  }
</app-window-panel>
