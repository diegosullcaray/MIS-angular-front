<app-window-panel
  [conFiltros]="true"
  titulo="Cartera"
  [permitirActualizar]="false"
>
  <app-grupo-filtros ventana-filtros>
    <app-filtro-asesor [asesores]="asesores()" [seleccionado]="asesorSeleccionado()" [editable]="mostrarSelector()" (cambio)="onAsesorSeleccionado($event)" />
  </app-grupo-filtros>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver su cartera.</p>
  } @else {
    <div class="flex flex-col gap-4">
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
      </div>
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla2().headers" [filas]="tabla2().body" [cargando]="cargando()" />
      </div>
    </div>
  }
</app-window-panel>
