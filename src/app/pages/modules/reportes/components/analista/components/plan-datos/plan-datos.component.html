<app-window-panel
  [conFiltros]="true"
  titulo="Plan de Datos"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex items-end gap-3 flex-wrap">
    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
      <p-select
        [options]="asesores()"
        [ngModel]="asesorSeleccionado()"
        (ngModelChange)="onAsesorSeleccionado($event)"
        optionLabel="nombre"
        dataKey="dni"
        [filter]="true"
        filterBy="nombre"
        placeholder="Buscar asesor"
        styleClass="w-72 text-[11.5px]"
        ariaLabel="Asesor"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Fecha Base</span>
      <p-select
        [options]="opcionesFechaBase"
        [ngModel]="fechaBase()"
        (ngModelChange)="onFechaBaseSeleccionada($event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-44 text-[11.5px]"
        ariaLabel="Fecha Base"
      />
    </div>
  </div>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver su plan de datos.</p>
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
