<app-window-panel
  [conFiltros]="true"
  titulo="Canal Alterno"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex flex-col gap-1">
    <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
    <p-select
      [options]="asesores()"
      [ngModel]="asesorSeleccionado()"
      (ngModelChange)="onAsesorSeleccionado($event)"
      optionLabel="nombre"
      dataKey="dni"
      [filter]="true"
      filterBy="nombre"
      placeholder="Buscar asesor"
      styleClass="w-72 text-[11.5px]"
      ariaLabel="Asesor"
    />
  </div>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver sus canales alternativos.</p>
  } @else {
    <div class="flex flex-col gap-2">
      <input
        pInputText
        [ngModel]="busqueda()"
        (ngModelChange)="busqueda.set($event)"
        placeholder="Filtrar..."
        class="w-72 text-[11.5px]"
      />
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="filasFiltradas()" [cargando]="cargando()" />
      </div>
      <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">
        Estos son los canales alternativos para la atención de tus clientes.
      </p>
    </div>
  }
</app-window-panel>
