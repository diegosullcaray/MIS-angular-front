<div class="mis-page mis-page--alta">
  <div class="flex flex-col gap-3 pb-3.5 border-b border-[var(--mis-border)]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-2">
        <i class="pi pi-list-check text-[var(--mis-primary-text)]"></i>
        <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">Detalle Monitor de Efectividades</h2>
      </div>

      <p-button
        [icon]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'"
        [label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
        severity="secondary"
        (onClick)="mostrarFiltros.set(!mostrarFiltros())"
      />
    </div>
  </div>

  <div class="flex items-end gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
      <p-select
        [options]="asesores()"
        [ngModel]="asesorSeleccionado()"
        (ngModelChange)="onAsesorSeleccionado($event)"
        optionLabel="nombre"
        dataKey="dni"
        [filter]="true"
        filterBy="nombre"
        placeholder="Buscar asesor"
        styleClass="w-72 text-[11.5px]"
        ariaLabel="Asesor"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Tramo</span>
      <p-select
        [options]="opcionesTramo"
        [ngModel]="filtros().tramof"
        (ngModelChange)="actualizarFiltro('tramof', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-36 text-[11.5px]"
        ariaLabel="Tramo"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Producto</span>
      <p-select
        [options]="opcionesProducto"
        [ngModel]="filtros().prod"
        (ngModelChange)="actualizarFiltro('prod', $event)"
        optionLabel="desc"
        optionValue="id"
        [filter]="true"
        filterBy="desc"
        styleClass="w-52 text-[11.5px]"
        ariaLabel="Producto"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Compromiso Roto</span>
      <p-select
        [options]="opcionesSiNo"
        [ngModel]="filtros().comp_r"
        (ngModelChange)="actualizarFiltro('comp_r', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-32 text-[11.5px]"
        ariaLabel="Compromiso Roto"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">0 Cuota</span>
      <p-select
        [options]="opcionesSiNo"
        [ngModel]="filtros().zcuo"
        (ngModelChange)="actualizarFiltro('zcuo', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-32 text-[11.5px]"
        ariaLabel="0 Cuota"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">1 Cuota</span>
      <p-select
        [options]="opcionesSiNo"
        [ngModel]="filtros().ucuo"
        (ngModelChange)="actualizarFiltro('ucuo', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-32 text-[11.5px]"
        ariaLabel="1 Cuota"
      />
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Tramo Días Gestión</span>
      <p-select
        [options]="opcionesTramoDiasGestion"
        [ngModel]="filtros().tdcr"
        (ngModelChange)="actualizarFiltro('tdcr', $event)"
        optionLabel="desc"
        optionValue="id"
        styleClass="w-44 text-[11.5px]"
        ariaLabel="Tramo Días Gestión"
      />
    </div>
  </div>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver el detalle de efectividades.</p>
  } @else {
    <div class="flex flex-col gap-2">
      <span class="text-[11px] font-bold text-[var(--mis-text-primary)] uppercase tracking-wider">Expresado en PEN y %</span>
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
      </div>
    </div>
  }
</div>
