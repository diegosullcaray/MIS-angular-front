<div class="mis-page mis-page--alta">
  <div class="flex flex-col gap-3 pb-3.5 border-b border-[var(--mis-border)]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-2">
        <i class="pi pi-map-marker text-[var(--mis-primary-text)]"></i>
        <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">Prospecto Corresponsal</h2>
      </div>

      <div class="flex items-center gap-2">
        @if (asesorSeleccionado()) {
          <p-button icon="pi pi-plus" label="Nuevo" (onClick)="dialogoVisible.set(true)" />
        }
        <p-button
          [icon]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'"
          [label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
          severity="secondary"
          (onClick)="mostrarFiltros.set(!mostrarFiltros())"
        />
      </div>
    </div>
  </div>

  <div class="flex flex-col gap-1" [class.hidden]="!mostrarFiltros()">
    <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Asesor</span>
    <p-select
      [options]="asesores()"
      [ngModel]="asesorSeleccionado()"
      (ngModelChange)="onAsesorSeleccionado($event)"
      optionLabel="nombre"
      dataKey="dni"
      [filter]="true"
      filterBy="nombre"
      placeholder="Buscar asesor"
      styleClass="w-72 text-[11.5px]"
      ariaLabel="Asesor"
    />
  </div>

  @if (!asesorSeleccionado()) {
    <p class="text-[11px] text-[var(--mis-text-tertiary)] m-0">Elegí un asesor para ver sus prospectos corresponsales.</p>
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="cargando()" />
    </div>
  }
</div>

<app-agregar-prospecto-dialog
  [visible]="dialogoVisible()"
  (visibleChange)="dialogoVisible.set($event)"
  (guardado)="onProspectoGuardado()"
/>
