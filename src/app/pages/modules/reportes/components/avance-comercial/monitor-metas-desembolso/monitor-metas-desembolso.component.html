<div class="mis-page mis-page--alta">
  <div class="flex flex-col gap-3 pb-3.5 border-b border-[var(--mis-border)]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-2">
        <i class="pi pi-chart-line text-[var(--mis-primary-text)]"></i>
        <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">Monitor Metas Desembolso</h2>
      </div>

      <p-button
        [icon]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'"
        [label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
        severity="secondary"
        [outlined]="true"
        (onClick)="mostrarFiltros.set(!mostrarFiltros())"
      />
    </div>
  </div>

  <div class="flex items-center gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
  </div>

  <!-- Tarjetas KPI Compactas -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div class="mis-card p-3 flex items-center justify-between border-l-4 border-l-[var(--mis-primary)] bg-[var(--mis-panel-bg)]/80">
      <div class="flex flex-col gap-0.5 min-w-0">
        <span class="text-[12px] font-bold text-[var(--mis-text-primary)]">Operaciones Desembolsadas</span>
        <span class="text-[11px] font-medium text-[var(--mis-text-secondary)]">Cumplimiento de Meta:</span>
        @if (kpiOperaciones()?.fecha) {
          <span class="text-[10px] text-[var(--mis-text-tertiary)] mt-0.5">
            <i class="pi pi-clock text-[9px] mr-1"></i>Al {{ kpiOperaciones()?.fecha }} {{ kpiOperaciones()?.hora }}
          </span>
        }
      </div>
      <span class="text-xl font-extrabold text-[var(--mis-primary-text)] shrink-0 ml-2">
        {{ kpiOperaciones()?.cumpl_des_acum || '--' }}
      </span>
    </div>

    <div class="mis-card p-3 flex items-center justify-between border-l-4 border-l-[var(--mis-primary)] bg-[var(--mis-panel-bg)]/80">
      <div class="flex flex-col gap-0.5 min-w-0">
        <span class="text-[12px] font-bold text-[var(--mis-text-primary)]">Monto Desembolsado</span>
        <span class="text-[11px] font-medium text-[var(--mis-text-secondary)]">Cumplimiento de Meta:</span>
      </div>
      <span class="text-xl font-extrabold text-[var(--mis-primary-text)] shrink-0 ml-2">
        {{ kpiMonto()?.cumpl_ope_acum || '--' }}
      </span>
    </div>
  </div>

  <!-- Las 4 Tablas del Reporte (Bloques _01, _02, _03 y _04 del legado) -->
  <div class="flex flex-col gap-4">
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="false" />
    </div>

    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla2().headers" [filas]="tabla2().body" [cargando]="false" />
    </div>

    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla3().headers" [filas]="tabla3().body" [cargando]="false" />
    </div>

    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tabla4().headers" [filas]="tabla4().body" [cargando]="false" />
    </div>
  </div>
</div>
