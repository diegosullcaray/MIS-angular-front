<app-window-panel
  titulo="Monitor Metas Desembolso"
  [subtitulo]="kpiOperaciones()?.fecha ? 'Actualizado al ' + kpiOperaciones()?.fecha + ' ' + kpiOperaciones()?.hora : ''"
  [permitirActualizar]="false"
>
  <button
    ventana-acciones
    type="button"
    class="mis-window-btn"
    (click)="mostrarFiltros.set(!mostrarFiltros())"
    [attr.aria-pressed]="mostrarFiltros()"
    [attr.aria-label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    [pTooltip]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
    tooltipPosition="bottom"
  >
    <i [class]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'" class="text-[14px]"></i>
  </button>
  <div class="flex items-center gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <!-- `autoSeleccionar: false`: la raíz ("Financiera") queda a la vista como
         punto de partida, pero NO se emite. Con el default en `true` el
         selector emitía la raíz al cargar y esta pantalla pedía su reporte
         sola, sin que nadie lo eligiera — ver `reportes-jerarquia.spec.ts`. -->
    <app-hier-selector
      [paramsHier]="paramsHier"
      [autoSeleccionar]="false"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel de la jerarquía"
      descripcion="Selecciona una unidad en los filtros de arriba para ver el reporte."
    />
  } @else {
    <!-- Tarjetas KPI Compactas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="mis-card p-3 flex items-center justify-between border-l-4 border-l-[var(--mis-primary)] bg-[var(--mis-panel-bg)]/80">
        <div class="flex flex-col gap-0.5 min-w-0">
          <span class="text-[12px] font-bold text-[var(--mis-text-primary)]">Operaciones Desembolsadas</span>
          <span class="text-[11px] font-medium text-[var(--mis-text-secondary)]">Cumplimiento de Meta:</span>
        </div>
        <span class="text-xl font-extrabold text-[var(--mis-primary-text)] shrink-0 ml-2">
          {{ kpiOperaciones()?.cumpl_des_acum || '--' }}
        </span>
      </div>

      <div class="mis-card p-3 flex items-center justify-between border-l-4 border-l-[var(--mis-primary)] bg-[var(--mis-panel-bg)]/80">
        <div class="flex flex-col gap-0.5 min-w-0">
          <span class="text-[12px] font-bold text-[var(--mis-text-primary)]">Monto Desembolsado</span>
          <span class="text-[11px] font-medium text-[var(--mis-text-secondary)]">Cumplimiento de Meta:</span>
        </div>
        <span class="text-xl font-extrabold text-[var(--mis-primary-text)] shrink-0 ml-2">
          {{ kpiMonto()?.cumpl_ope_acum || '--' }}
        </span>
      </div>
    </div>

    <!-- Las 4 Tablas del Reporte (Bloques _01, _02, _03 y _04 del legado) -->
    <div class="flex flex-col gap-4">
      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla1().headers" [filas]="tabla1().body" [cargando]="false" />
      </div>

      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla2().headers" [filas]="tabla2().body" [cargando]="false" />
      </div>

      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla3().headers" [filas]="tabla3().body" [cargando]="false" />
      </div>

      <div class="mis-card p-3 overflow-x-auto">
        <app-tabla-reporte [encabezados]="tabla4().headers" [filas]="tabla4().body" [cargando]="false" />
      </div>
    </div>
  }
</app-window-panel>
