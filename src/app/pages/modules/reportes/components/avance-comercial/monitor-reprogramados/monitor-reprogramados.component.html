<app-window-panel
  titulo="Monitor Reprogramados"
  [permitirActualizar]="false"
>
  @if (nivelActual()) {
    <!-- Solo tiene sentido alternar una vez que hay reporte a la vista: sin
         nivel elegido el panel queda forzado abierto (ver `mostrarFiltros`),
         así que ocultarlo no haría nada. -->
    <button
      ventana-acciones
      type="button"
      class="mis-window-btn"
      (click)="filtrosAbiertos.set(!filtrosAbiertos())"
      [attr.aria-pressed]="mostrarFiltros()"
      [attr.aria-label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
      [pTooltip]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
      tooltipPosition="bottom"
    >
      <i [class]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'" class="text-[14px]"></i>
    </button>
  }
  <div class="flex flex-col gap-3" [class.hidden]="!mostrarFiltros()">
    <!-- Mismo criterio que su hermano de Avance Comercial: la raíz se muestra
         pero no se emite, así no se pide un reporte que nadie eligió. -->
    <app-hier-selector
      [paramsHier]="paramsHier"
      [autoSeleccionar]="false"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Tipo</span>
      <p-select
        [options]="opcionesTipo"
        optionLabel="desc"
        optionValue="id"
        [ngModel]="tipoSeleccionado()"
        (ngModelChange)="onTipoSeleccionado($event)"
        styleClass="w-40 text-[11.5px]"
        ariaLabel="Tipo"
      />
    </div>
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel de la jerarquía"
      descripcion="Selecciona una unidad en los filtros de arriba para ver el reporte."
    />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tablaReprogramados().headers" [filas]="tablaReprogramados().body" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
