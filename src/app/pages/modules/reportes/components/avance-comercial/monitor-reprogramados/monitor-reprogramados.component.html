<div class="mis-page mis-page--alta">
  <div class="flex flex-col gap-3 pb-3.5 border-b border-[var(--mis-border)]">
    <div class="flex items-center justify-between flex-wrap gap-3">
      <div class="flex items-center gap-2">
        <i class="pi pi-list-check text-[var(--mis-primary-text)]"></i>
        <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">Monitor Reprogramados</h2>
      </div>

      <p-button
        [icon]="mostrarFiltros() ? 'pi pi-filter-slash' : 'pi pi-filter'"
        [label]="mostrarFiltros() ? 'Ocultar filtros' : 'Mostrar filtros'"
        severity="secondary"
        [outlined]="true"
        (onClick)="mostrarFiltros.set(!mostrarFiltros())"
      />
    </div>
  </div>

  <div class="flex items-end gap-3 flex-wrap" [class.hidden]="!mostrarFiltros()">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" />

    <div class="flex flex-col gap-1">
      <span class="text-[9.5px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">Tipo</span>
      <p-select
        [options]="opcionesTipo"
        optionLabel="desc"
        optionValue="id"
        [ngModel]="tipoSeleccionado()"
        (ngModelChange)="onTipoSeleccionado($event)"
        styleClass="w-40 text-[11.5px]"
        ariaLabel="Tipo"
      />
    </div>
  </div>

  <div class="mis-card p-3 overflow-x-auto">
    <app-tabla-reporte [encabezados]="tablaReprogramados().headers" [filas]="tablaReprogramados().body" [cargando]="false" />
  </div>
</div>
