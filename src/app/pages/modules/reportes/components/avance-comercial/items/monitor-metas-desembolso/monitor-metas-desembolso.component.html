<app-window-panel
  [conFiltros]="true" titulo="Monitor Metas Desembolso"
  [subtitulo]="kpiOperaciones()?.fecha ? 'Actualizado al ' + kpiOperaciones()?.fecha + ' ' + kpiOperaciones()?.hora : ''"
  [permitirActualizar]="false">
  <div ventana-filtros class="flex items-center gap-3 flex-wrap">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)" (error)="onErrorJerarquia()" />
  </div>

  @if (!nivelActual()) {
    <app-empty-state titulo="Elige un nivel de la jerarquía"
      descripcion="Selecciona una unidad en los filtros de arriba para ver el reporte." />
  } @else {
    <!-- Implementación Dinámica de Tabs -->
    <p-tabs value="tab1">
      <p-tablist>
        @for (tab of tabs; track tab.id) {
          <p-tab [value]="tab.id" class="flex items-center gap-2! !py-2 !px-3">
            {{ tab.titulo }}
          </p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        @for (tab of tabs; track tab.id) {
          <p-tabpanel [value]="tab.id">
            <div class="flex flex-col gap-4">
              <!-- Chip informativo con el cumplimiento de meta de la pestaña -->
              @if (tab.chip(); as chip) {
                <app-chip-informativo [texto]="chip" [severidad]="tab.severidad()" />
              }
              <!-- Iteramos sobre las tablas configuradas para esta pestaña -->
              @for (tabla of tab.tablas; track $index) {
                <div class="mis-card p-3 overflow-x-auto">
                  <app-tabla-reporte
                    [encabezados]="tabla().headers"
                    [filas]="tabla().body"
                    [cargando]="cargando()" />
                </div>
              }
            </div>
          </p-tabpanel>
        }
      </p-tabpanels>
    </p-tabs>
  }
</app-window-panel>
