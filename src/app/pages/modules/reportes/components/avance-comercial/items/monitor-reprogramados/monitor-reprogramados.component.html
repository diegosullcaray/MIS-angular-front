<app-window-panel
  [conFiltros]="true"
  titulo="Monitor Reprogramados"
  [permitirActualizar]="false"
>
  <div ventana-filtros class="flex flex-col gap-3">
    <!-- Mismo criterio que su hermano de Avance Comercial: la raíz se emite al
         cargar, así al entrar ya se ve el reporte del total. -->
    <app-hier-selector
      [paramsHier]="paramsHier"
      placeholder="Elegir nivel"
      (nodoSeleccionado)="onNivelSeleccionado($event)"
      (error)="onErrorJerarquia()"
    />

    <app-grupo-filtros>
      <app-select-filtro etiqueta="Tipo" [opciones]="opcionesTipo" [valor]="tipoSeleccionado()" (valorChange)="onTipoSeleccionado($event)" ancho="w-40" />
    </app-grupo-filtros>
  </div>

  @if (!nivelActual()) {
    <app-empty-state
      titulo="Elige un nivel de la jerarquía"
      descripcion="Selecciona una unidad en los filtros de arriba para ver el reporte."
    />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tablaReprogramados().headers" [filas]="tablaReprogramados().body" [cargando]="cargando()" />
    </div>
  }
</app-window-panel>
