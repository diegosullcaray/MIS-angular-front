<div class="flex flex-col gap-4">
  <div class="flex items-center gap-3 flex-wrap">
    <app-hier-selector [paramsHier]="paramsHier" placeholder="Elegir nivel" (nodoSeleccionado)="onNivelSeleccionado($event)" />

    <p-select
      [options]="opcionesTipo"
      optionLabel="desc"
      optionValue="id"
      [ngModel]="tipoSeleccionado()"
      (ngModelChange)="onTipoSeleccionado($event)"
      styleClass="w-40"
      ariaLabel="Tipo"
    />
  </div>

  @if (!nivelActual()) {
    <p class="text-[13px] text-[var(--mis-text-tertiary)]">Elige un nivel de la jerarquía para ver el reporte.</p>
  } @else if (cargando()) {
    <p-skeleton height="220px" />
  } @else {
    <div class="mis-card p-3 overflow-x-auto">
      <app-tabla-reporte [encabezados]="tablaReprogramados().headers" [filas]="tablaReprogramados().body" />
    </div>
  }
</div>
