<app-tarjeta-dominio titulo="Recuperaciones y Mora" icono="lucideCircleAlert" [alerta]="true" (verDetalle)="verDetalle.emit()">
  <div class="grid w-full grid-cols-2 gap-2.5">
    @for (r of recuperaciones(); track r.titulo) {
      <div class="flex flex-col gap-1 rounded-[10px] border border-[var(--mis-tile-border)] px-3 py-1" style="background: var(--mis-tile-bg)">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-[var(--mis-primary-text)]">{{ r.titulo }}</span>
        <div class="flex items-center justify-between gap-2">
          <div class="flex shrink-0 flex-col gap-0.5 text-[var(--mis-primary-text)]">
            <span class="text-sm font-semibold leading-tight">{{ r.porcentaje }}</span>
            <span class="text-[11px]">recuperado</span>
          </div>
          <div class="flex min-w-0 flex-col gap-0.5 text-right">
            <span class="text-[20px] font-semibold leading-tight text-[var(--mis-text-primary)]">{{ r.recuperado }}</span>
            <span class="text-[11px] text-[var(--mis-text-secondary)]">de {{ r.total }}</span>
          </div>
        </div>
      </div>
    }
  </div>
  <div class="grid w-full grid-cols-2 gap-2.5">
    @for (e of efectividades(); track e.etiqueta) {
      <div class="flex min-w-0 flex-col gap-0.5">
        <span class="text-xs text-[var(--mis-text-secondary)]">{{ e.etiqueta }}</span>
        <div class="flex flex-wrap items-baseline justify-between gap-x-1.5 gap-y-0.5">
          <span class="text-base font-semibold text-[var(--mis-text-primary)]">{{ e.valor }}</span>
          <span class="text-[11px] text-[var(--mis-text-secondary)]">{{ e.meta }}</span>
        </div>
        <app-barra-meta
          [pct]="e.pct"
          [color]="e.color"
          [marca]="e.marca"
          [alto]="11"
          [descripcion]="e.etiqueta + ': ' + e.valor + ' (' + e.meta + ')'"
        />
      </div>
    }
  </div>
  <app-kpi-pie pie [kpis]="datos().kpis" />
</app-tarjeta-dominio>
