<app-tarjeta-dominio titulo="Seguros" icono="lucideShield" (verDetalle)="verDetalle.emit()">
  @if (datos(); as d) {
    <div class="flex w-full flex-col gap-1">
      <div class="flex justify-between text-base">
        <span class="text-[var(--mis-text-primary)]">{{ d.polizas.etiqueta }}</span>
        <span class="font-semibold text-[var(--mis-text-secondary)]">{{ resumen() }}</span>
      </div>
      <!-- El segmento de cada tipo y su leyenda los dibuja p-metergroup. -->
      <p-metergroup
        [value]="tipos()"
        [max]="escala()"
        [attr.aria-label]="d.polizas.etiqueta + ' por tipo'"
        style="--p-metergroup-meters-size: 12px; --p-metergroup-meters-background: color-mix(in srgb, var(--mis-text-secondary) 22%, var(--mis-surface))"
      >
        <ng-template #label>
          <ul class="m-0 mt-1 grid w-full list-none grid-cols-3 gap-x-1.5 gap-y-1 rounded-lg border border-[var(--mis-border)] px-2 py-1.5 text-xs" style="background: var(--mis-tile-bg)">
            @for (tipo of d.tipos; track tipo.nombre) {
              <li class="flex items-center gap-1 overflow-hidden">
                <span class="h-1.5 w-1.5 shrink-0 rounded-full" [style.background]="tipo.color" aria-hidden="true"></span>
                <span class="overflow-hidden text-ellipsis whitespace-nowrap text-[var(--mis-text-secondary)]">{{ tipo.nombre }}:</span>
                <b class="text-[var(--mis-text-primary)]">{{ tipo.polizas }}</b>
              </li>
            }
          </ul>
        </ng-template>
      </p-metergroup>
    </div>
  } @else {
    <p class="m-0 flex flex-1 items-center justify-center text-center text-sm text-[var(--mis-text-secondary)]">
      Seguros pendiente: la carga de pólizas del corte aún no corrió.
    </p>
  }
  <!-- Bloque propio: el pie solo se proyecta si es la única raíz del @if. -->
  @if (datos(); as d) {
    <app-kpi-pie pie [kpis]="d.kpis" />
  }
</app-tarjeta-dominio>
