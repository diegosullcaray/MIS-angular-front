<div class="mis-card ranking-table-card">
  <div class="px-4 py-3 border-b border-[var(--mis-border)]">
    <h3 class="text-sm font-semibold text-[var(--mis-primary)] m-0 truncate" [title]="titulo()">{{ titulo() }}</h3>
  </div>

  <p-table [value]="filas()" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th class="w-10 text-center text-[11px] uppercase !bg-[var(--mis-primary)] !text-[var(--mis-text-on-primary)]">N°</th>
        <th class="text-[11px] uppercase !bg-[var(--mis-primary)] !text-[var(--mis-text-on-primary)]">Usuario</th>
        <th class="text-center text-[11px] uppercase !bg-[var(--mis-primary)] !text-[var(--mis-text-on-primary)]">{{ valorLabel() }}</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-fila>
      <tr [class]="esPrimerPuesto(fila) ? '!bg-[#A9EFFD] font-semibold' : ''">
        <td class="text-center font-semibold">{{ fila.posicion }}</td>
        <td>{{ fila.etiqueta }}</td>
        <td class="text-center">{{ fila.valor }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center text-[13px] text-[var(--mis-text-tertiary)] py-4">Sin datos</td>
      </tr>
    </ng-template>
  </p-table>
</div>
