<div class="mis-card ranking-table-card rounded-lg overflow-hidden border border-[var(--mis-ranking-header-bg)]/30 bg-white/95 backdrop-blur-[10px] shadow-sm">
  <!-- Cabecera de la tabla (Título del grupo) -->
  <div class="px-4 py-2.5 text-center flex justify-center items-center bg-[var(--mis-ranking-header-bg)] text-white">
    @if (cargando()) {
      <p-skeleton width="60%" height="1.25rem" />
    } @else {
      <h3 class="text-[15px] font-bold text-center text-white uppercase tracking-wide m-0 truncate" [pTooltip]="titulo()" tooltipPosition="top">
        {{ titulo() }}
      </h3>
    }
  </div>

  @if (cargando()) {
    <div class="p-3 flex flex-col gap-2">
      @for (fila of filasSkeleton(); track $index) {
        <p-skeleton height="1.25rem" />
      }
    </div>
  } @else {
    <p-table [value]="filasVisibles()" [scrollable]="true" scrollHeight="360px" styleClass="p-datatable-sm ranking-custom-table">
      <ng-template pTemplate="header">
        <tr>
          <th class="w-12 text-center text-[12px] font-bold uppercase whitespace-nowrap border-r border-white/30" style="background-color: var(--mis-ranking-subheader-bg); color: #ffffff;">N°</th>
          <th class="text-center text-[12px] font-bold uppercase whitespace-nowrap border-r border-white/30" style="background-color: var(--mis-ranking-subheader-bg); color: #ffffff;">Usuario</th>
          <th class="text-center text-[12px] font-bold uppercase whitespace-nowrap" style="background-color: var(--mis-ranking-subheader-bg); color: #ffffff;">{{ valorLabel() }}</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-fila>
        <tr [style.background-color]="esPrimerPuesto(fila) ? 'var(--mis-ranking-row1-bg)' : null" [style.font-weight]="esPrimerPuesto(fila) ? 600 : null">
          <td class="text-center font-semibold whitespace-nowrap text-[13px] border-r border-[var(--mis-border)]">{{ formatPosicion(fila.posicion) }}</td>
          <td class="max-w-[160px] overflow-hidden text-ellipsis whitespace-nowrap text-[13px] border-r border-[var(--mis-border)]" [pTooltip]="fila.etiqueta" tooltipPosition="top">{{ fila.etiqueta }}</td>
          <td class="text-center whitespace-nowrap text-[13px] font-medium">{{ fila.valor }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="text-center text-[13px] text-[var(--mis-text-tertiary)] py-4">Sin datos</td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
