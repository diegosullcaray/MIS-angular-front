<div class="mis-card p-4 flex flex-col gap-4">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Usuario</label>
      <input
        type="text"
        pInputText
        [(ngModel)]="usuario"
        placeholder="Buscar por nombre..."
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Lugares</label>
      <p-multiSelect
        [options]="lugaresDisponibles()"
        [(ngModel)]="lugares"
        placeholder="Todos los lugares"
        [showToggleAll]="true"
        styleClass="w-full"
        display="chip"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">
        Puntos: {{ rangoPuntos()[0] }} — {{ rangoPuntos()[1] }}
      </label>
      <p-slider
        [(ngModel)]="rangoPuntos"
        [range]="true"
        [min]="puntosMinDisponible()"
        [max]="puntosMaxDisponible()"
        class="mt-2"
      />
    </div>
  </div>

  <div class="flex items-center justify-end gap-2">
    <p-button label="Limpiar" severity="secondary" [text]="true" (click)="onLimpiar()" />
    <p-button label="Aplicar filtros" icon="pi pi-filter" (click)="onAplicar()" />
  </div>
</div>
