<div class="mis-card p-4 flex flex-col gap-4 bg-[var(--mis-glass-bg)] backdrop-blur-[16px] border border-[var(--mis-glass-border)] rounded-xl shadow-sm">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Usuario</label>
      <input
        type="text"
        pInputText
        [formField]="filtrosForm.usuario"
        placeholder="Buscar por nombre..."
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Posiciones por tabla</label>
      <p-select
        [options]="opcionesPosiciones"
        [ngModel]="model().limitePosiciones"
        (ngModelChange)="onLimitePosicionesChange($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleccionar..."
        styleClass="w-full"
        appendTo="body"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">Lugares</label>
      <p-multiSelect
        [options]="lugaresDisponibles()"
        [ngModel]="model().lugares"
        (ngModelChange)="onLugaresChange($event)"
        placeholder="Todos los lugares"
        [showToggleAll]="true"
        styleClass="w-full"
        display="chip"
        appendTo="body"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[12px] font-medium text-[var(--mis-text-secondary)]">
        Puntos: {{ model().rangoPuntos[0] }} — {{ model().rangoPuntos[1] }}
      </label>
      <p-slider
        [ngModel]="model().rangoPuntos"
        (ngModelChange)="onRangoPuntosChange($event)"
        [range]="true"
        [min]="puntosMinDisponible()"
        [max]="puntosMaxDisponible()"
        class="mt-2"
      />
    </div>
  </div>

  <div class="flex items-center justify-end gap-2">
    <p-button label="Limpiar" severity="secondary" [text]="true" (click)="onLimpiar()" />
    <p-button label="Aplicar filtros" icon="pi pi-filter" (click)="onAplicar()" />
  </div>
</div>
