<div class="flex flex-col gap-6 w-full">
  <div class="flex items-center gap-3">
    <a routerLink="/app/ranking-k" class="flex items-center justify-center w-8 h-8 rounded-full bg-transparent text-[var(--mis-text-secondary)] no-underline hover:bg-[var(--mis-panel-bg)] hover:text-[var(--mis-text-primary)]">
      <ng-icon name="lucideArrowLeft" size="16" />
    </a>
    <ng-icon name="lucideTrophy" size="24" class="text-[var(--mis-warning)]" />
    <h1 class="text-[var(--mis-text-xl)] font-semibold text-[var(--mis-text-primary)] m-0">
      Ranking Kaypacha — Categoría: {{ categoria()?.name ?? id() }}
    </h1>
  </div>

  @if (cargando()) {
    <div class="mis-card p-5">
      <app-list-skeleton [rows]="[1, 2, 3, 4]" [cols]="[1, 2, 3]" />
    </div>
  } @else if (error()) {
    <div class="mis-card p-5">
      <app-inline-error titulo="No se pudo cargar el detalle" [detalle]="error()!" (reintentar)="cargarDetalle()" />
    </div>
  } @else if (grupos().length === 0) {
    <div class="mis-card">
      <app-empty-state titulo="Sin datos" descripcion="Esta categoría todavía no tiene información de ranking." />
    </div>
  } @else {
    <!-- Una tarjeta con su propia tabla por cada grupo (hdester), igual que el legado -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      @for (grupo of grupos(); track grupo.hdester) {
        <app-ranking-table [titulo]="grupo.hdester" [filas]="grupo.filas" valorLabel="Puntos" />
      }
    </div>
  }
</div>
