<!-- Pantalla puente: carga las categorías y salta al detalle de la primera
     (ver el `effect` del componente). Lo único que llega a verse es el estado
     de esa carga, así que la ventana va con alto natural. -->
<app-window-panel
  titulo="Ranking Kaypacha"
  [altoAuto]="true"
  [actualizando]="kaypacha.cargando()"
  etiquetaActualizar="Reintentar la carga de categorías"
  (actualizar)="kaypacha.recargarCategorias()"
>
  @if (kaypacha.cargando()) {
    <app-list-skeleton [rows]="[1, 2]" [cols]="[1]" />
  } @else if (kaypacha.error()) {
    <app-inline-error
      titulo="No se pudo cargar el ranking"
      [detalle]="kaypacha.error()!"
      (reintentar)="kaypacha.recargarCategorias()"
    />
  } @else if (kaypacha.categorias().length === 0) {
    <app-empty-state titulo="Sin categorías" descripcion="Todavía no hay categorías de ranking disponibles." />
  } @else {
    <!-- Ya hay categorías: el `effect` está navegando al detalle en este mismo
         instante, así que se mantiene el esqueleto hasta que la ruta cambie. -->
    <app-list-skeleton [rows]="[1, 2]" [cols]="[1]" />
  }
</app-window-panel>
