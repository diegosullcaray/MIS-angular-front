<p-dialog
  [visible]="visible()"
  (visibleChange)="cerrar()"
  [modal]="true"
  [style]="{ width: '92vw', maxWidth: '700px' }"
  [draggable]="false"
  [resizable]="false"
  header="Asesor de Negocios"
  appendTo="body"
>
  <div class="flex flex-col gap-3">
    <app-data-table
      [columns]="columnas"
      [data]="sectoristas()"
      [loading]="cargando()"
      [rows]="8"
      [searchFields]="['des_sec', 'des_uni', 'des_cor', 'des_ter']"
      searchPlaceholder="Buscar asesor, unidad, corredor o territorio…"
      emptyMessage="Sin colaboradores para mostrar."
      [selectableRows]="true"
      [selectedRow]="seleccionado()"
      (filaSeleccionada)="seleccionado.set($event)"
    />
  </div>

  <ng-template pTemplate="footer">
    <p-button
      label="Cancelar"
      severity="secondary"
      size="small"
      (onClick)="cerrar()"
    />
    <p-button
      label="Seleccionar"
      size="small"
      [disabled]="!seleccionado()"
      (onClick)="confirmar()"
    />
  </ng-template>
</p-dialog>
