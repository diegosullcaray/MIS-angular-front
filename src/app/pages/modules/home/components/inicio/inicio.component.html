<!-- Igual que el explorador de sistemas: el contenido del shell va sobre un
     panel de vidrio, porque el fondo de escritorio no garantiza contraste. -->
<app-window-panel
  titulo="Reportes recientes"
  [mostrarSemaforo]="false"
  [permitirActualizar]="false"
  [altoAuto]="true"
>
  @if (recientes().length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4">
      @for (reporte of recientes(); track reporte.ruta) {
        <a
          class="kpi-card reciente-card p-3.5 sm:p-4 rounded-xl sm:rounded-2xl flex flex-col justify-between gap-2"
          [routerLink]="reporte.ruta"
        >
          <span class="text-[11px] sm:text-[12px] font-bold uppercase tracking-wider text-[var(--mis-text-tertiary)] truncate">
            {{ reporte.categoria ?? 'Reporte' }}
          </span>

          <span class="text-[15px] sm:text-[17px] font-bold tracking-tight text-[var(--mis-text-primary)] leading-tight">
            {{ reporte.titulo }}
          </span>

          <span class="flex items-center gap-1.5 text-[11px] sm:text-[12px] font-medium text-[var(--mis-text-secondary)]">
            <i class="pi pi-clock text-[10px]" aria-hidden="true"></i>
            {{ desde(reporte.fechaVisita) }}
          </span>
        </a>
      }
    </div>
  } @else {
    <app-empty-state
      titulo="Todavía no abriste ningún reporte"
      descripcion="Abre uno desde el menú lateral y quedará aquí para volver en un clic."
    />
  }
</app-window-panel>
