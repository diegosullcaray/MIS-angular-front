<!-- El panel de novedades queda fijo al borde derecho; el espacio principal
     reserva su ancho en pantallas amplias para no quedar debajo de él. -->
<app-panel-novedades #panelNovedades />

<!-- La bienvenida de Pachi: se abre sola la primera vez y su botón principal
     levanta el panel de al lado. -->
<app-bienvenida-dialog
  (verNovedades)="panelNovedades.abrir()"
  (entrarDirecto)="panelNovedades.cerrar()"
/>

<section class="inicio" aria-labelledby="inicio-titulo">
  @if (recientes().length > 0) {
    <header class="inicio-encabezado">
      <h1 id="inicio-titulo">Accesos recientes</h1>
    </header>
  }

  <app-demo-navegacion [modo]="ejemploNovedad()" />

  @if (recientes().length > 0) {
    <section class="recientes bg-[var(--mis-glass-bg)] border border-[var(--mis-glass-border)] rounded-[var(--mis-radius-lg)] shadow-[var(--mis-shadow-md)] backdrop-blur-md backdrop-saturate-[140%] overflow-hidden" aria-label="Reportes recientes">
      <ul class="recientes-lista">
        @for (reporte of recientes(); track reporte.ruta) {
          <li>
            <a class="reciente-fila" [routerLink]="reporte.ruta">
              <span class="reciente-icono" aria-hidden="true">
                <i class="pi pi-chart-line"></i>
              </span>
              <span class="reciente-contenido">
                <span class="reciente-nombre">{{ reporte.titulo }}</span>
                @if (reporte.categoria) {
                  <span class="reciente-categoria">{{ reporte.categoria }}</span>
                }
              </span>
              <span class="reciente-meta">
                <span class="reciente-fecha">{{ desde(reporte.fechaVisita) }}</span>
                <i class="pi pi-arrow-up-right" aria-hidden="true"></i>
              </span>
            </a>
          </li>
        }
      </ul>
    </section>
  }
</section>
