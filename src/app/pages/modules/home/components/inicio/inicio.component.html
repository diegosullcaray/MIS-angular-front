<div class="dashboard-container">
    <!-- Welcome Header -->
    <header class="dashboard-header">
        <h1 class="welcome-title">¡Hola, {{ primerNombre() }}!</h1>
        <p class="welcome-subtitle">
            Bienvenido al centro de control del Sistema de Información Gerencial (MIS).
        </p>
    </header>

    <a routerLink="/admin/kaypacha" class="kpi-card kpi-card--link">
        <div class="kpi-content">
            <div class="kpi-details">
                <span class="kpi-label">Ranking Kaypacha</span>
                <span class="kpi-value">{{ kaypacha.categorias().length }} categorías</span>
            </div>
            <div class="kpi-icon kpi-icon--amber">
                <ng-icon name="lucideTrophy" size="18" />
            </div>
        </div>
    </a>
</div>
