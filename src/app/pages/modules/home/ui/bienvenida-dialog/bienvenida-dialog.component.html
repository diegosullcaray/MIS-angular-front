<p-dialog
  [visible]="abierto()"
  (visibleChange)="cerrar()"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  appendTo="body"
  styleClass="mis-bienvenida-dialog"
  [style]="{ width: 'min(560px, 90vw)' }"
  header="Te damos la bienvenida"
>
  <div class="bienvenida">
    <!-- Decorativa: el saludo lo lleva el texto, no el dibujo. -->
    <img class="bienvenida-pachi" src="/assets/images/fc/tours/mascota-saluda.png" alt="" aria-hidden="true" />

    <div class="bienvenida-texto">
      <p class="bienvenida-saludo">
        ¡Hola! Soy <b>Pachi</b> y te acompaño en el sistema nuevo.
      </p>
      <p class="bienvenida-bajada">
        Haz clic en «Ver las novedades» y te mostraré todo lo que cambió en la plataforma, paso a paso.
      </p>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Entrar directo" [text]="true" severity="secondary" (onClick)="cerrar()" />
    <p-button label="Ver las novedades" icon="pi pi-sparkles" (onClick)="irANovedades()" />
  </ng-template>
</p-dialog>
