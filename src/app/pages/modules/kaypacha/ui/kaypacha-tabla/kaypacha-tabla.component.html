<p-table
  [value]="dataSource()"
  [scrollable]="scrollable()"
  [scrollHeight]="scrollHeight()"
  styleClass="kaypacha-table p-datatable-sm p-datatable-gridlines p-datatable-striped"
  responsiveLayout="scroll"
>
  <ng-template pTemplate="header">
    <tr>
      @for (col of headers(); track col.key) {
      <th [ngStyle]="col.style || {}">
        {{ col.label }}
      </th>
      }
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      @for (col of headers(); track col.key) {
      <td>
        {{ row[col.key] }}
      </td>
      }
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="headers().length || 1" class="text-center py-6 text-[var(--mis-text-tertiary)] text-xs">
        {{ mensajeVacio() }}
      </td>
    </tr>
  </ng-template>
</p-table>
