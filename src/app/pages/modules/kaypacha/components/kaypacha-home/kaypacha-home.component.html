<div class="flex flex-col gap-6 w-full">
  <div class="flex items-center gap-3">
    <ng-icon name="lucideTrophy" size="24" class="text-[var(--mis-warning)]" />
    <h1 class="text-[var(--mis-text-xl)] font-semibold text-[var(--mis-text-primary)] m-0">Ranking Kaypacha</h1>
  </div>

  <div class="mis-card">
    @if (kaypacha.cargando()) {
      <div class="p-5">
        <app-list-skeleton [rows]="[1, 2]" [cols]="[1]" />
      </div>
    } @else if (kaypacha.error()) {
      <div class="p-5">
        <app-inline-error
          titulo="No se pudo cargar el ranking"
          [detalle]="kaypacha.error()!"
          (reintentar)="kaypacha.recargarCategorias()"
        />
      </div>
    } @else if (kaypacha.categorias().length === 0) {
      <app-empty-state titulo="Sin categorías" descripcion="Todavía no hay categorías de ranking disponibles." />
    } @else {
      <app-empty-state
        titulo="Elige una categoría"
        descripcion="Selecciona una categoría en el panel lateral (sección 'Categoría') para ver su ranking desglosado."
      />
    }
  </div>
</div>
