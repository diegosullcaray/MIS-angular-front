<!-- Panel de módulo como ventana macOS: la barra de título va pegada al borde
     del panel (semáforo, título centrado y "Actualizar" en la esquina) y el
     contenido del tablero se proyecta como cuerpo de la ventana. -->
<app-window-panel
  titulo="Kaypacha"
  subtitulo="Plataforma de desempeño"
  [actualizando]="service.loading()"
  etiquetaActualizar="Actualizar tablero"
  (actualizar)="limpiarTodo()"
>
  <!-- Acción propia del módulo, a la izquierda del botón de la esquina -->
  @if (service.permitirBusqueda()) {
  <button
    ventana-acciones
    type="button"
    class="mis-window-btn"
    (click)="abrirBuscador()"
    aria-label="Buscar y seleccionar otro colaborador"
    pTooltip="Buscar y seleccionar otro colaborador"
    tooltipPosition="bottom"
  >
    <i class="pi pi-user-edit text-[14px]"></i>
  </button>
  }

  @if (service.loading()) {
  <div class="mis-superficie p-6 rounded-2xl shadow-sm">
    <app-list-skeleton [rows]="[1, 2, 3, 4, 5, 6]" />
  </div>
  } @else if (service.error()) {
  <div class="mis-superficie p-6 rounded-2xl shadow-sm">
    <app-inline-error [titulo]="'Error al cargar Kaypacha'" [detalle]="service.error()!"
      (reintentar)="service.cargarDatos()" />
  </div>
  } @else {
  <section class="mis-superficie rounded-2xl p-4 sm:p-5 shadow-sm">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
      <!-- Bloque Izquierdo: Asesor y Cargo (Col 1-5) -->
      <div class="lg:col-span-5 flex flex-col gap-3">
        <div class="flex items-center gap-2">
          <span
            class="inline-flex items-center justify-center px-3 py-1 rounded bg-[var(--mis-primary)] text-[var(--mis-text-on-primary)] font-bold text-xs sm:text-sm tracking-wide shrink-0 w-24 text-center border border-[var(--mis-primary)]">
            ASESOR:
          </span>
          <input
            type="text"
            pInputText
            readonly
            [value]="service.nombreUsuario()"
            placeholder="Asesor de la sesión"
            class="flex-1 w-full bg-[var(--mis-surface)] border border-[var(--mis-primary)] rounded px-3 py-1.5 text-[var(--mis-text-primary)] font-bold text-xs sm:text-sm truncate shadow-xs focus:outline-none"
          />
        </div>

        <div class="flex items-center gap-2">
          <span
            class="inline-flex items-center justify-center px-3 py-1 rounded bg-[var(--mis-primary)] text-[var(--mis-text-on-primary)] font-bold text-xs sm:text-sm tracking-wide shrink-0 w-24 text-center border border-[var(--mis-primary)]">
            CARGO:
          </span>
          <input
            type="text"
            pInputText
            readonly
            [value]="service.cargo()"
            placeholder="Sin Cargo"
            class="flex-1 w-full bg-[var(--mis-surface)] border border-[var(--mis-primary)] rounded px-3 py-1.5 text-[var(--mis-text-primary)] font-bold text-xs sm:text-sm truncate shadow-xs focus:outline-none"
          />
        </div>
      </div>

      <!-- Bloque Centro: Imagen Medalla AL COSTADO de Asesor/Cargo (Col 6-7) -->
      <div class="lg:col-span-2 flex items-center justify-center py-1">
        <img [src]="imagenMedalla" alt="Plataforma de Desempeño"
          class="max-h-24 sm:max-h-28 w-auto object-contain filter drop-shadow-sm hover:scale-105 transition-transform" />
      </div>

      <!-- Bloque Derecho: Tarjetas KPI con PrimeNG p-card (Col 8-12) -->
      <div class="lg:col-span-5 grid grid-cols-2 gap-3">
        <p-card
          styleClass="bg-[var(--mis-kaypacha-oro)] text-[var(--mis-kaypacha-oro-texto)] rounded-xl p-0 shadow-xs border border-[var(--mis-kaypacha-oro-texto)]/20 h-24 flex flex-col justify-center items-center text-center overflow-hidden">
          <div class="flex flex-col justify-center items-center text-center w-full">
            <span class="text-[11px] uppercase tracking-wider font-bold text-[var(--mis-kaypacha-oro-texto)]/90 leading-tight">
              Puntaje Promedio Final
            </span>
            <span class="text-[20px] sm:text-[24px] font-extrabold tracking-tight text-[var(--mis-kaypacha-oro-texto)] mt-1">
              {{ service.puntajeFinal() }}
            </span>
          </div>
        </p-card>

        <p-card
          styleClass="bg-gradient-to-br from-[var(--mis-primary)] to-[var(--mis-primary-hover)] text-[var(--mis-text-on-primary)] rounded-xl p-0 shadow-xs border border-[var(--mis-text-on-primary)]/20 h-24 flex flex-col justify-center items-center text-center overflow-hidden">
          <div class="flex flex-col justify-center items-center text-center w-full">
            <span class="text-[11px] uppercase tracking-wider font-bold text-[var(--mis-text-on-primary)]/85 leading-tight">
              Posición
            </span>
            <span class="text-[20px] sm:text-[24px] font-extrabold tracking-tight text-[var(--mis-text-on-primary)] mt-1">
              {{ service.posicion() }}
            </span>
          </div>
        </p-card>
      </div>
    </div>
  </section>

  <section
    class="mis-superficie rounded-2xl shadow-sm overflow-hidden">
    <!-- Window Header Bar (Legacy rgb(3, 80, 150)) -->
    <div class="kaypacha-window-bar px-5 py-2.5 flex items-center justify-between border-b border-blue-900/30">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-star-fill text-[var(--mis-kaypacha-oro)] text-base"></i>
        <h2 class="text-sm sm:text-base font-bold tracking-wide m-0 text-[var(--mis-text-on-primary)]">Puntos Acumulados</h2>
      </div>
      <p-tag value="Detalle por Métricas" severity="info"
        styleClass="bg-[var(--mis-text-on-primary)]/20 text-[var(--mis-text-on-primary)] font-medium border-0 text-[11px]"></p-tag>
    </div>

    <div class="p-4 grid grid-cols-1 lg:grid-cols-2 gap-4 bg-[var(--mis-panel-bg)]/60">
      <!-- Tabla 1 Izquierda -->
      <div class="mis-baldosa kaypacha-table-wrapper rounded-xl">
        <app-kaypacha-tabla [dataSource]="service.dataSources1()" [headers]="service.headers1()" />
      </div>

      <!-- Tabla 1 Derecha -->
      <div class="mis-baldosa kaypacha-table-wrapper rounded-xl">
        <app-kaypacha-tabla [dataSource]="service.dataSources1()" [headers]="service.headers1_1()" />
      </div>
    </div>
  </section>

  <section
    class="mis-superficie rounded-2xl shadow-sm overflow-hidden">
    <!-- Window Header Bar (Legacy rgb(3, 80, 150)) -->
    <div class="kaypacha-window-bar px-5 py-2.5 flex items-center justify-between border-b border-blue-900/30">
      <div class="flex items-center gap-2.5">
        <i class="pi pi-history text-[var(--mis-text-on-primary)]/80 text-base"></i>
        <h2 class="text-sm sm:text-base font-bold tracking-wide m-0 text-[var(--mis-text-on-primary)]">Variables Históricas</h2>
      </div>
      <p-tag value="Evolución Temporal" severity="info"
        styleClass="bg-[var(--mis-text-on-primary)]/20 text-[var(--mis-text-on-primary)] font-medium border-0 text-[11px]"></p-tag>
    </div>

    <div class="p-4 grid grid-cols-1 lg:grid-cols-2 gap-4 bg-[var(--mis-panel-bg)]/60">
      <!-- Tabla 2 Izquierda -->
      <div class="mis-baldosa kaypacha-table-wrapper rounded-xl">
        <app-kaypacha-tabla [dataSource]="service.dataSources2()" [headers]="service.headers2()"
          [scrollable]="true" scrollHeight="200px" mensajeVacio="Sin datos históricos disponibles" />
      </div>

      <!-- Tabla 2 Derecha -->
      <div class="mis-baldosa kaypacha-table-wrapper rounded-xl">
        <app-kaypacha-tabla [dataSource]="service.dataSources2()" [headers]="service.headers2_2()"
          [scrollable]="true" scrollHeight="200px" mensajeVacio="Sin datos históricos disponibles" />
      </div>
    </div>
  </section>
  }

  <app-buscador-colaborador-dialog [(visible)]="mostrarDialogBuscador"
    (colaboradorSeleccionado)="onColaboradorSeleccionado($event)" />
</app-window-panel>
