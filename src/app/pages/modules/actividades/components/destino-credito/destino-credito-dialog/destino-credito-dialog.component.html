<p-dialog
  [header]="'Actualizar Destino de Crédito — Operación #' + codOpe"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  appendTo="body"
  [style]="{ width: '92vw', maxWidth: '640px' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 py-3">
    <!-- Campos de solo lectura -->
    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-600">Cod. Asesor</label>
      <input pInputText readonly [value]="codAsesor" class="bg-slate-100 text-xs" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-600">Asesor</label>
      <input pInputText readonly [value]="asesor" class="bg-slate-100 text-xs" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-600">Cliente</label>
      <input pInputText readonly [value]="desCli" class="bg-slate-100 text-xs" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-600">Cuenta Cliente</label>
      <input pInputText readonly [value]="ctaCli" class="bg-slate-100 text-xs" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-600">Fecha Desembolso</label>
      <input pInputText readonly [value]="fecDes" class="bg-slate-100 text-xs" />
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-xs font-semibold text-slate-600">Monto Desembolso</label>
      <input pInputText readonly [value]="monDes | currency:'PEN':'symbol':'1.2-2'" class="bg-slate-100 text-xs" />
    </div>

    <!-- Campo editable: Fecha de Visita -->
    <div class="flex flex-col gap-1 sm:col-span-2">
      <label class="text-xs font-semibold text-[#035096]">Fecha de Visita *</label>
      <p-datepicker
        [(ngModel)]="fecVis"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        placeholder="Seleccione la fecha de visita"
        styleClass="w-full text-xs"
        [maxDate]="today"
        (ngModelChange)="fecVisError = false"
      ></p-datepicker>
      @if (fecVisError) {
        <small class="text-red-500 text-[11px]">La fecha de visita es obligatoria.</small>
      }
    </div>

    <!-- Toggle Cumple Destino -->
    <div class="flex items-center gap-2 sm:col-span-2 pt-1">
      <p-checkbox [(ngModel)]="cumpleDestino" [binary]="true" inputId="cumple_dc"></p-checkbox>
      <label for="cumple_dc" class="text-xs font-semibold text-slate-800 cursor-pointer select-none">
        Cumple Destino de Crédito
      </label>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-2 pt-2">
      <p-button label="Cancelar" severity="secondary" [text]="true" size="small" (onClick)="cerrar()"></p-button>
      <p-button label="Guardar" icon="pi pi-check" severity="primary" size="small" (onClick)="guardar()"></p-button>
    </div>
  </ng-template>
</p-dialog>
