<!-- Ventana del módulo: la barra de título reemplaza al banner con ícono,
     nombre y bajada que estaba dentro del panel. -->
<app-window-panel
  titulo="Actividades"
  subtitulo="Seguimiento comercial"
  icono="pi pi-calendar-clock"
  [permitirActualizar]="false"
>
  <p class="text-xs text-[var(--mis-text-secondary)] m-0 max-w-2xl leading-relaxed">
    Acceda a las herramientas de seguimiento de destino de crédito, registro de prospectos
    y monitoreo de transacciones del sistema corresponsal.
  </p>

  <!-- Cards de navegación -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (card of cards; track card.ruta) {
      <a
        [routerLink]="card.ruta"
        class="nav-card group flex flex-col bg-[var(--mis-surface-translucido)] backdrop-blur-sm rounded-xl border border-[var(--mis-border)] shadow-xs hover:shadow-md hover:border-[var(--mis-border)] transition-all duration-200 cursor-pointer no-underline overflow-hidden"
      >
        <!-- Top bar de color -->
        <div class="h-1.5 w-full" [style.background]="card.colorIcon"></div>

        <div class="p-4 flex flex-col gap-3 flex-1">
          <!-- Icono + Badge -->
          <div class="flex items-start justify-between">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center text-xl" [style.background]="card.colorBg">
              <i [class]="card.icono" [style.color]="card.colorIcon"></i>
            </div>
            @if (card.badge) {
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[var(--mis-primary-light)] text-[var(--mis-primary-text)]">{{ card.badge }}</span>
            }
          </div>

          <!-- Texto -->
          <div>
            <h2 class="text-sm font-bold text-[var(--mis-text-primary)] m-0 leading-tight group-hover:text-[var(--mis-primary-text)] transition-colors duration-150">
              {{ card.titulo }}
            </h2>
            <p class="text-xs text-[var(--mis-text-secondary)] m-0 mt-1 leading-relaxed">{{ card.descripcion }}</p>
          </div>

          <!-- Acción -->
          <div class="flex items-center justify-end mt-auto pt-2 border-t border-[var(--mis-border)]">
            <span class="text-xs text-[var(--mis-primary-text)] font-semibold flex items-center gap-1 group-hover:gap-2 transition-all duration-150">
              Acceder <i class="pi pi-arrow-right text-[10px]"></i>
            </span>
          </div>
        </div>
      </a>
    }
  </div>
</app-window-panel>
