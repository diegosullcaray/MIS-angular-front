<p-dialog
  [visible]="visible"
  (visibleChange)="cerrar()"
  [modal]="true"
  [style]="{ width: '95vw', maxWidth: '1000px' }"
  [draggable]="false"
  [resizable]="false"
  header="Clientes en base de riesgos"
  styleClass="riesgo-dialog"
  appendTo="body"
>
  <app-data-table
    [columns]="columnas"
    [data]="resultados()"
    [loading]="cargando()"
    [rows]="8"
    [rowsPerPageOptions]="[8, 15, 25]"
    [searchFields]="['HCTACLI', 'HDESCLI']"
    searchPlaceholder="Buscar por cuenta o nombre del cliente..."
    emptyMessage="No se encontraron clientes en la base de riesgos."
    [showRefreshButton]="true"
    (refrescar)="cargarClientes()"
  >
    <ng-template appDataTableCell="HCTACLI" let-row>
      <span class="font-mono font-medium text-[var(--mis-text-primary)]">{{ row.HCTACLI }}</span>
    </ng-template>

    <ng-template appDataTableCell="HDESCLI" let-row>
      <span class="font-medium text-[var(--mis-text-primary)]">{{ row.HDESCLI }}</span>
    </ng-template>

    <ng-template appDataTableCell="accion" let-row>
      <p-button
        icon="pi pi-check"
        label="Seleccionar"
        [text]="true"
        size="small"
        severity="primary"
        pTooltip="Seleccionar cliente"
        tooltipPosition="top"
        (onClick)="seleccionar(row)"
      ></p-button>
    </ng-template>
  </app-data-table>

  <ng-template pTemplate="footer">
    <div class="flex items-center justify-end">
      <p-button label="Cerrar" icon="pi pi-times" [outlined]="true" severity="secondary" size="small" (click)="cerrar()" />
    </div>
  </ng-template>
</p-dialog>
