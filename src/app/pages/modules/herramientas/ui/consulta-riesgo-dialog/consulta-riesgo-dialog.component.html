<p-dialog
  [visible]="visible"
  (visibleChange)="cerrar()"
  [modal]="true"
  [style]="{ width: '92vw', maxWidth: '850px' }"
  [draggable]="false"
  [resizable]="false"
  header="Clientes en base de riesgos"
  styleClass="riesgo-dialog"
  appendTo="body"
>
  <div class="flex flex-col gap-4 py-1">
    <div class="w-full">
      <p-iconfield iconPosition="left" class="w-full">
        <p-inputicon class="pi pi-search text-[var(--mis-text-tertiary)]"></p-inputicon>
        <input
          type="text"
          pInputText
          placeholder="Buscar por cuenta o nombre del cliente..."
          class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-[var(--mis-border-strong)] focus:border-[var(--mis-primary)] focus:ring-2 focus:ring-[var(--mis-primary)]/20 transition-all text-sm text-[var(--mis-text-primary)] bg-[var(--mis-surface)]"
          [value]="terminoBusqueda()"
          (input)="onBuscar($event)"
        />
      </p-iconfield>
    </div>

    <div class="border border-[var(--mis-border)] rounded-xl overflow-hidden shadow-xs bg-[var(--mis-surface)]">
      <p-table
        [value]="resultados()"
        [paginator]="true"
        [rows]="8"
        [rowsPerPageOptions]="[8, 15, 25]"
        [loading]="cargando()"
        selectionMode="single"
        [selection]="itemSeleccionado()"
        (onRowSelect)="onRowSelect($event.data)"
        dataKey="HCTACLI"
        styleClass="p-datatable-sm p-datatable-striped"
      >
        <ng-template pTemplate="header">
          <tr>
            <th class="py-3 px-4 text-[var(--mis-text-on-primary)]" style="background-color: var(--mis-primary);">Cuenta Cliente</th>
            <th class="py-3 px-4 text-[var(--mis-text-on-primary)]" style="background-color: var(--mis-primary);">Nombre Cliente</th>
            <th class="py-3 px-4 text-[var(--mis-text-on-primary)]" style="background-color: var(--mis-primary);">Fecha Reg.</th>
            <th class="py-3 px-4 text-[var(--mis-text-on-primary)] text-center" style="background-color: var(--mis-primary);">Tipo Cartera</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item>
          <tr
            [pSelectableRow]="item"
            class="hover:bg-[var(--mis-primary-light)]/60 cursor-pointer transition-colors text-sm border-b border-[var(--mis-border)]"
            [style.background-color]="itemSeleccionado()?.HCTACLI === item.HCTACLI ? 'var(--mis-primary-light)' : null"
            [style.font-weight]="itemSeleccionado()?.HCTACLI === item.HCTACLI ? 600 : null"
          >
            <td class="py-2.5 px-4 font-mono font-medium text-[var(--mis-text-primary)] whitespace-nowrap">{{ item.HCTACLI }}</td>
            <td class="py-2.5 px-4 font-medium text-[var(--mis-text-primary)] whitespace-nowrap">{{ item.HDESCLI }}</td>
            <td class="py-2.5 px-4 text-[var(--mis-text-secondary)] whitespace-nowrap">{{ item.FECHA }}</td>
            <td class="py-2.5 px-4 text-center whitespace-nowrap">{{ item.TIPO }}</td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center py-8 text-[var(--mis-text-secondary)] text-sm">
              @if (cargando()) {
                <div class="flex items-center justify-center gap-2">
                  <i class="pi pi-spin pi-spinner text-[var(--mis-primary-text)]"></i>
                  <span>Buscando...</span>
                </div>
              } @else {
                <span>No se encontraron clientes que coincidan con la búsqueda.</span>
              }
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex items-center justify-end gap-3">
      <p-button label="Cerrar" icon="pi pi-times" [outlined]="true" severity="secondary" size="small" (click)="cerrar()" />
      <p-button
        label="Seleccionar"
        icon="pi pi-check"
        severity="primary"
        size="small"
        [disabled]="!itemSeleccionado()"
        (click)="seleccionarYCerrar()"
      />
    </div>
  </ng-template>
</p-dialog>
