<div class="mis-page">
  <div class="flex items-center justify-between gap-3 pb-3.5 border-b border-[var(--mis-border)]">
    <div class="flex items-center gap-2.5">
      <p-button icon="pi pi-arrow-left" severity="secondary" [outlined]="true" size="small" ariaLabel="Volver" pTooltip="Volver" tooltipPosition="bottom" (onClick)="volver()" />
      <h2 class="m-0 text-base font-semibold text-[var(--mis-text-primary)]">Listas</h2>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    @for (enlace of enlaces; track enlace.ruta) {
      <a
        [routerLink]="enlace.ruta"
        class="rounded-xl border border-[var(--mis-border)] bg-[var(--mis-surface)] p-4 flex items-center gap-3 no-underline hover:border-[var(--mis-primary)] hover:shadow-md transition-all"
      >
        <div class="w-11 h-11 rounded-full bg-[var(--mis-primary-light)] flex items-center justify-center shrink-0">
          <i [class]="enlace.icono" class="text-[var(--mis-primary-text)] text-lg"></i>
        </div>
        <div class="flex flex-col gap-0.5 min-w-0">
          <span class="text-[14px] font-semibold text-[var(--mis-text-primary)]">{{ enlace.nombre }}</span>
          <span class="text-[12px] text-[var(--mis-text-secondary)]">{{ enlace.descripcion }}</span>
        </div>
        <div class="flex-1"></div>
        <i class="pi pi-chevron-right text-[var(--mis-text-tertiary)]"></i>
      </a>
    }
  </div>
</div>
