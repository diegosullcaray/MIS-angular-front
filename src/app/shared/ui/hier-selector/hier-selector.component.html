<div
  class="w-full flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-end gap-2.5 sm:gap-3 p-2.5 sm:p-2 bg-[var(--mis-panel-bg)]/60 border border-[var(--mis-border)] rounded-xl shadow-xs"
  [class.sm:w-fit]="!anchoCompleto()"
  [class.sm:w-full]="anchoCompleto()"
>
  @for (cbo of nodosNivel(); track cbo.level; let i = $index) {
    <div class="flex flex-col gap-1 w-full sm:w-auto">
      <span class="text-[10px] font-bold text-[var(--mis-text-secondary)] uppercase tracking-wider">
        {{ cbo.label }}
      </span>
      <p-select
        [options]="cbo.data"
        [ngModel]="valoresSeleccionados()[i]"
        (onChange)="onSeleccionarNivel(i, $event.value)"
        optionLabel="desc_rel"
        dataKey="cod_rel"
        styleClass="w-full sm:min-w-44 text-[12px]"
        [placeholder]="cbo.label"
        ariaLabel="Seleccionar nivel jerárquico"
      >
        <ng-template pTemplate="selectedItem" let-selectedOption>
          @if (selectedOption) {
            <span class="truncate block w-full max-w-full sm:max-w-[200px] text-ellipsis">{{ selectedOption.desc_rel || selectedOption.des_rel }}</span>
          }
        </ng-template>
        <ng-template pTemplate="item" let-nodo>
          <span class="truncate block max-w-full sm:max-w-[260px] text-ellipsis">{{ nodo.desc_rel || nodo.des_rel }}</span>
        </ng-template>
      </p-select>
    </div>
  }

  @if (anchoCompleto()) {
    <div class="hidden sm:block flex-1"></div>
  }

  <div class="flex flex-col gap-1 w-full sm:w-auto pt-1 sm:pt-0">
    <span class="hidden sm:block text-[10px] font-bold opacity-0 select-none uppercase tracking-wider">&nbsp;</span>
    <p-button
      label="Limpiar"
      icon="pi pi-refresh"
      severity="secondary"
      styleClass="w-full sm:w-auto text-[12px] font-medium justify-center"
      (onClick)="limpiar()"
    />
  </div>
</div>
