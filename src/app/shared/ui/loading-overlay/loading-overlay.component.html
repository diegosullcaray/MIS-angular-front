@if (estado().isLoading) {
  <div
    class="loading-overlay-wrapper fixed inset-0 z-[9999] flex flex-col items-center justify-center gap-3 p-4"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <img
      class="loading-puma animate-pulse"
      src="assets/images/fc/puma-carga.png"
      width="85"
      height="139"
      alt=""
      aria-hidden="true"
    />
    <span class="text-sm font-medium text-white">{{ estado().message || 'Cargando…' }}</span>
  </div>
}
