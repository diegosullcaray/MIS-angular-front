<article class="kpi-tile">
  <!-- Riel de acento: da estructura a la tarjeta sin agregar otra línea de texto. -->
  <span class="kpi-tile__riel" aria-hidden="true"></span>

  <div class="flex flex-col gap-1.5 min-w-0">
    <span class="text-[11px] font-semibold uppercase tracking-wide text-[var(--mis-text-tertiary)] truncate">
      {{ etiqueta() }}
    </span>

    <span class="flex items-baseline gap-1 min-w-0">
      @if (unidad()) {
        <span class="text-[13px] font-medium text-[var(--mis-text-tertiary)]">{{ unidad() }}</span>
      }
      <span class="text-[26px] leading-none font-semibold text-[var(--mis-text-primary)] tabular-nums truncate">
        {{ valorCompacto() }}
      </span>
    </span>

    @if (variacionConSigno()) {
      <span class="flex items-center gap-1 text-[12px] font-medium" [class]="claseVariacion()">
        <i class="pi text-[10px]" [class]="iconoVariacion()" aria-hidden="true"></i>
        <span class="tabular-nums">{{ variacionConSigno() }}</span>
        <span class="font-normal text-[var(--mis-text-tertiary)]">{{ periodo() }}</span>
      </span>
    }
  </div>
</article>
