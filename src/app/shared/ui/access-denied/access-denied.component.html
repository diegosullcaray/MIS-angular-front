<div class="flex flex-col items-center justify-center min-h-[calc(100vh-140px)] w-full p-4">
  <div class="mis-card bg-white/85 backdrop-blur-[16px] border border-white/60 shadow-xl rounded-2xl p-8 sm:p-12 max-w-md w-full flex flex-col items-center justify-center gap-4 text-center">
    <div class="w-16 h-16 rounded-full bg-[var(--mis-danger-light)] flex items-center justify-center shrink-0">
      <ng-icon name="lucideShieldAlert" size="32" class="text-[var(--mis-danger)]" />
    </div>

    <div class="flex flex-col gap-1">
      <h2 class="m-0 text-xl font-bold text-[var(--mis-text-primary)]">Acceso denegado</h2>
      <p class="m-0 text-xs text-[var(--mis-text-secondary)] leading-relaxed max-w-[280px]">{{ mensaje() }}</p>
    </div>

    <a
      routerLink="/app/dashboard"
      class="inline-flex items-center justify-center gap-2 mt-2 px-5 py-2.5 rounded-xl bg-[var(--mis-primary)] text-white text-xs font-semibold no-underline shadow-md transition-all duration-150 hover:bg-[var(--mis-primary-hover)] hover:scale-[1.02]"
    >
      <ng-icon name="lucideArrowLeft" size="16" />
      Volver a Mi espacio
    </a>
  </div>
</div>
