<div class="fixed top-4 right-4 z-[var(--mis-z-dropdown)] flex flex-col gap-2 w-[360px] max-w-[calc(100vw-2rem)]">
  @for (mensaje of toast.toasts(); track mensaje.id) {
    <div
      class="flex items-start gap-3 p-3 pr-2 rounded-[10px] bg-[var(--mis-surface)] border border-[var(--mis-border)] shadow-[var(--mis-shadow-lg)] animate-dropdownFadeIn"
      role="alert"
    >
      <div
        class="flex items-center justify-center w-8 h-8 rounded-full shrink-0"
        [style.background]="fondoBorde[mensaje.severity]"
      >
        <ng-icon [name]="icono[mensaje.severity]" size="16" [style.color]="colorIcono[mensaje.severity]" />
      </div>
      <div class="flex-1 min-w-0 pt-0.5">
        <div class="text-sm font-semibold text-[var(--mis-text-primary)]">{{ mensaje.titulo }}</div>
        @if (mensaje.detalle) {
          <div class="text-xs text-[var(--mis-text-secondary)] mt-0.5">{{ mensaje.detalle }}</div>
        }
      </div>
      <button
        type="button"
        class="flex items-center justify-center w-6 h-6 rounded-full bg-transparent border-0 text-[var(--mis-text-tertiary)] cursor-pointer shrink-0 hover:bg-[var(--mis-panel-bg)] hover:text-[var(--mis-text-primary)]"
        (click)="toast.descartar(mensaje.id)"
        aria-label="Cerrar notificación"
      >
        <ng-icon name="lucideX" size="12" />
      </button>
    </div>
  }
</div>
