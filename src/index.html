<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MisHost</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- PWA: manifest + íconos + theme-color (barra de estado del navegador/OS) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1D396E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MIS">

  <!-- Tema antes del primer frame: sin esto se ve un destello claro entre que
       el navegador pinta el CSS y Angular arranca `ThemeService`. Replica su
       lógica (preferencia guardada, o `oscuro` por defecto) — si cambia el
       modo por defecto del servicio, hay que cambiarlo también acá. -->
  <script>
    (function () {
      var oscuro = true;
      try {
        var guardado = localStorage.getItem('mis-tema');
        if (guardado === 'claro') oscuro = false;
        else if (guardado === 'sistema') oscuro = matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) { /* storage bloqueado: se queda con el tema por defecto */ }

      if (oscuro) document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
