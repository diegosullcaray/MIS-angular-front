<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>MisHost</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- PWA: manifest + íconos + theme-color (barra de estado del navegador/OS) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1D396E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MIS">

  <!-- Aplicar apariencia.tema de mis.preferencias antes del primer frame.
       Ante JSON inválido se conserva el valor de fábrica: oscuro. -->
  <script>
    (function () {
      var oscuro = true;
      try {
        var preferencias = JSON.parse(localStorage.getItem('mis.preferencias') || 'null');
        var guardado = preferencias && preferencias.apariencia && preferencias.apariencia.tema;
        if (guardado === 'claro') oscuro = false;
        else if (guardado === 'sistema') oscuro = matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) { /* storage bloqueado: se queda con el tema por defecto */ }

      if (oscuro) document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
